<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>مناهج البحث · الوحدة الثانية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a single 16:9 "chalk-less" lecture stage with captions, controls and a scene index below. */
:root{
  color-scheme: dark;
  --ground:#0c1720; --stage:#122331; --stage2:#17293a; --line:#24405a;
  --ink:#eaf1f3; --muted:#9bb0bc; --teal:#4cc3bd; --amber:#f2b43e; --coral:#ee7c62; --violet:#a99cf0;
  --display:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --hero:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --k:1;
  --u:calc(max(1cqi,5.4px) * var(--k));
}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;direction:rtl}
.wrap{max-width:1120px;margin-inline:auto;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.top h1{font-family:var(--display);font-size:22px;margin:0;font-weight:700;text-wrap:balance}
.top span{color:var(--muted);font-size:13px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts button{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:start;min-height:44px}
.parts button small{display:block;color:var(--muted);font-size:12px}
.parts button[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal)}

.player{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--stage)}
.stage{container-type:inline-size;position:relative;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/calc(var(--u)*4) calc(var(--u)*4),linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/calc(var(--u)*4) calc(var(--u)*4),var(--stage)}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 30%,transparent 30%,var(--stage) 85%);opacity:.88;pointer-events:none}
.scene{--u:calc(max(1cqi,5.4px) * var(--k));position:absolute;inset:0;padding:calc(var(--u)*2.6) calc(var(--u)*3.4);display:flex;flex-direction:column;gap:calc(var(--u)*1.3)}
.head{display:flex;flex-direction:column;gap:calc(var(--u)*.35)}
.chap{font-size:calc(var(--u)*1.2);color:var(--teal);letter-spacing:.04em;font-weight:500}
.ttl{font-family:var(--display);font-size:calc(var(--u)*2.9);font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.1)}

.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.38s + .15s)}
@keyframes pop{from{opacity:0;transform:translateY(calc(var(--u)*1.2)) scale(.97)}to{opacity:1;transform:none}}
.rev{animation:rev .45s ease both;animation-delay:calc(var(--i,0)*.38s + .15s)}
@keyframes rev{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.pop,.rev{animation:none}}

.t{font-size:calc(var(--u)*1.55);line-height:1.7}
.lbl{font-size:calc(var(--u)*1.2);color:var(--amber);font-weight:500;letter-spacing:.02em}
.key{align-self:flex-start;background:var(--amber);color:#1b1405;font-weight:700;border-radius:8px;padding:calc(var(--u)*.6) calc(var(--u)*1.3);font-size:calc(var(--u)*1.38);line-height:1.5}
.intro{font-size:calc(var(--u)*1.45);line-height:1.65;background:var(--stage2);border:1px solid var(--line);border-radius:10px;padding:calc(var(--u)*.9) calc(var(--u)*1.3)}
.exbox{font-size:calc(var(--u)*1.28);line-height:1.6;color:var(--ink);border:1px dashed var(--amber);border-radius:10px;padding:calc(var(--u)*.7) calc(var(--u)*1.2)}
.exbox::before{content:"مثال من الواقع ";color:var(--amber);font-weight:700}

.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.4)}
.hero .code{color:var(--amber);font-weight:700;font-size:calc(var(--u)*1.5);letter-spacing:.06em;direction:ltr;align-self:flex-end}
.hero h2{font-family:var(--hero);font-size:calc(var(--u)*5.2);margin:0;line-height:1.2;text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.8)}
.chips span{border:1px solid var(--line);background:var(--stage2);border-radius:999px;padding:calc(var(--u)*.4) calc(var(--u)*1.2);font-size:calc(var(--u)*1.3)}

.cmp{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:calc(var(--u)*1.3)}
.col{background:var(--stage2);border:1px solid var(--line);border-top:3px solid var(--c,var(--teal));border-radius:10px;padding:calc(var(--u)*1.2) calc(var(--u)*1.4);display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
.col h3{margin:0;font-family:var(--display);font-size:calc(var(--u)*2);color:var(--c,var(--teal))}
.col ul{margin:0;padding-inline-start:1.1em;display:grid;gap:calc(var(--u)*.25)}
.col li{font-size:calc(var(--u)*1.33);line-height:1.5}
.col .ex{margin-top:auto;font-size:calc(var(--u)*1.2);color:var(--muted);border-top:1px dashed var(--line);padding-top:calc(var(--u)*.5);line-height:1.5}

.grid{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:calc(var(--u)*.9)}
.cell{display:flex;gap:calc(var(--u)*.9);align-items:flex-start;background:var(--stage2);border:1px solid var(--line);border-radius:10px;padding:calc(var(--u)*.9) calc(var(--u)*1.1)}
.num{flex:none;font-family:var(--display);font-weight:700;color:var(--amber);font-size:calc(var(--u)*2);line-height:1;min-width:1.2em;text-align:center}
.cell b{display:block;font-size:calc(var(--u)*1.45);line-height:1.4}
.cell small{display:block;font-size:calc(var(--u)*1.18);color:var(--muted);line-height:1.5;margin-top:2px}
.grid.tight .cell{padding:calc(var(--u)*.6) calc(var(--u)*.9)}
.xrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:calc(var(--u)*.9)}
.xcell{border-inline-start:3px solid var(--teal);padding-inline-start:calc(var(--u)*1);display:grid;gap:2px}
.xcell b{font-size:calc(var(--u)*1.35);color:var(--teal)}
.xcell span{font-size:calc(var(--u)*1.2);line-height:1.5;color:var(--ink)}

.flow{display:flex;align-items:stretch;gap:calc(var(--u)*.6)}
.step{flex:1 1 0;min-width:0;background:var(--stage2);border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:8px;padding:calc(var(--u)*.9);display:flex;flex-direction:column;gap:calc(var(--u)*.35)}
.step .sn{color:var(--teal);font-weight:700;font-size:calc(var(--u)*1.15)}
.step b{font-size:calc(var(--u)*1.42);line-height:1.4}
.step small{font-size:calc(var(--u)*1.17);color:var(--muted);line-height:1.5}
.arrow{align-self:center;color:var(--amber);font-size:calc(var(--u)*2);flex:none}

.def{border-inline-start:4px solid var(--teal);padding-inline-start:calc(var(--u)*1.5);display:grid;gap:calc(var(--u)*.5)}
.def .term{font-family:var(--display);color:var(--teal);font-size:calc(var(--u)*1.7)}
.def .t{font-size:calc(var(--u)*1.7);line-height:1.75}
.pl{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.7)}
.pl span{background:var(--stage2);border:1px solid var(--line);border-radius:8px;padding:calc(var(--u)*.55) calc(var(--u)*1);font-size:calc(var(--u)*1.3);line-height:1.5}
.pl span i{font-style:normal;color:var(--amber);font-weight:700;margin-inline-end:.4em}

.cases{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:calc(var(--u)*1.1)}
.case{background:var(--stage2);border:1px solid var(--line);border-radius:10px;padding:calc(var(--u)*1.1);display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
.case .q{font-size:calc(var(--u)*1.38);line-height:1.55}
.case .a{align-self:flex-start;font-family:var(--display);font-weight:700;font-size:calc(var(--u)*1.7);color:#10161b;background:var(--c);border-radius:6px;padding:calc(var(--u)*.2) calc(var(--u)*1)}
.case .w{font-size:calc(var(--u)*1.2);color:var(--muted);line-height:1.55}

.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:calc(var(--u)*1.28);line-height:1.5;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th{background:#0d2638;color:var(--teal);font-family:var(--display);font-weight:700;padding:calc(var(--u)*.6) calc(var(--u)*.9);text-align:start;font-size:calc(var(--u)*1.4)}
.tbl td{padding:calc(var(--u)*.5) calc(var(--u)*.9);border-top:1px solid var(--line);background:var(--stage2)}
.tbl td:first-child{color:var(--amber);font-weight:700;white-space:nowrap}

.terms{display:grid;grid-template-columns:repeat(var(--c,2),minmax(0,1fr));gap:calc(var(--u)*.6) calc(var(--u)*1)}
.term-i{display:flex;gap:calc(var(--u)*.8);align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:calc(var(--u)*.45)}
.term-i .d{flex:1;font-size:calc(var(--u)*1.2);line-height:1.5;color:var(--muted)}
.term-i .tt{flex:none;font-family:var(--display);font-weight:700;color:var(--amber);font-size:calc(var(--u)*1.4);max-width:40%}

.nums{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:calc(var(--u)*.8)}
.nb{display:flex;align-items:center;gap:calc(var(--u)*1.1);background:var(--stage2);border:1px solid var(--line);border-radius:10px;padding:calc(var(--u)*.7) calc(var(--u)*1.1)}
.nb .big{font-family:var(--display);font-size:calc(var(--u)*3);color:var(--amber);line-height:1;min-width:1.1em;text-align:center}
.nb span{font-size:calc(var(--u)*1.3);line-height:1.45}

.calc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:calc(var(--u)*1.3);align-items:start}
.formula{font-family:var(--display);font-size:calc(var(--u)*1.8);background:#0d2638;border:1px solid var(--teal);color:var(--teal);border-radius:10px;padding:calc(var(--u)*.8) calc(var(--u)*1.2);text-align:center}
.work{display:grid;gap:calc(var(--u)*.5);counter-reset:w}
.work div{background:var(--stage2);border:1px solid var(--line);border-radius:8px;padding:calc(var(--u)*.55) calc(var(--u)*1);font-size:calc(var(--u)*1.45);line-height:1.5}
.work div.res{border-color:var(--amber);color:var(--amber);font-weight:700}
.mini{width:100%;border-collapse:collapse;font-size:calc(var(--u)*1.3);text-align:center}
.mini th{color:var(--teal);font-weight:500;padding:calc(var(--u)*.35);border-bottom:1px solid var(--line)}
.mini td{padding:calc(var(--u)*.3);border-bottom:1px solid var(--line)}
.mini tr.hl td{color:#1b1405;background:var(--amber);font-weight:700}
.mini tr.tot td{color:var(--amber);font-weight:700}
.act{border:1px dashed var(--coral);border-radius:10px;padding:calc(var(--u)*.8) calc(var(--u)*1.1);display:grid;gap:calc(var(--u)*.35)}
.act b{color:var(--coral);font-size:calc(var(--u)*1.35)}
.act span{font-size:calc(var(--u)*1.42)}

.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*1.4)}
.tg figure{margin:0;background:var(--stage2);border:1px solid var(--line);border-radius:12px;padding:calc(var(--u)*1);display:grid;justify-items:center;gap:calc(var(--u)*.5)}
.tg svg{width:78%;height:auto}
.tg figcaption{text-align:center;font-family:var(--display);font-size:calc(var(--u)*1.7)}
.tg figcaption small{display:block;font-family:var(--body);font-size:calc(var(--u)*1.1);color:var(--muted);direction:ltr}

.cap{min-height:4.4em;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 18px;background:#08121a;border-top:1px solid var(--line);font-size:17px;line-height:1.7}
.cap p{margin:0;max-width:66ch}
.bar{position:relative;height:6px;background:var(--line);cursor:pointer}
.bar .fill{position:absolute;inset-block:0;right:0;width:0;background:var(--teal)}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;background:#0a151e}
.ctrl button{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--stage2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
.ctrl button:hover{border-color:var(--teal)}
.ctrl button:focus-visible,.idx button:focus-visible,.parts button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ctrl .play{background:var(--teal);color:#062320;font-weight:700;border-color:var(--teal);min-width:96px}
.ctrl .count{margin-inline-start:auto;color:var(--muted);font-size:13px}
.ctrl .on{border-color:var(--amber);color:var(--amber)}
.note{color:var(--muted);font-size:13px;margin:0}
.idx{display:flex;flex-wrap:wrap;gap:6px}
.idx button{font-family:var(--body);font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.idx button[aria-current="true"]{color:#062320;background:var(--teal);border-color:var(--teal)}
.idx h4{width:100%;margin:6px 0 0;font-size:13px;color:var(--amber);font-weight:500}

@media (max-width:760px){
  .stage{aspect-ratio:auto;min-height:560px}
  .scene{--u:calc(6.2px * var(--k));position:relative;inset:auto;min-height:560px;padding:20px 16px}
  .cmp,.cases,.calc,.tg{grid-template-columns:minmax(0,1fr)}
  .grid,.terms,.nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow{flex-direction:column}.flow .arrow{display:none}
  .xrow{grid-template-columns:minmax(0,1fr)}
  .tblw{overflow-x:auto}
  .cap{font-size:15px}
}
@media (max-width:440px){.grid,.terms,.nums{grid-template-columns:minmax(0,1fr)}}
</style>
</head><body>

<div class="wrap">
  <div class="top">
    <h1>مناهج البحث · الوحدة الثانية</h1>
    <span>المنهجية في البحث العلمي والتربوي · EDUC4101</span>
  </div>
  <div class="parts" id="parts"></div>
  <div class="player">
    <div class="stage" id="stage" aria-live="polite"></div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="cap" id="cap"><p></p></div>
    <div class="ctrl">
      <button class="play" id="play">▶ تشغيل</button>
      <button id="prev">→ السابق</button>
      <button id="next">التالي ←</button>
      <button id="voice">🔈 الصوت: مغلق</button>
      <button id="speed">السرعة 1×</button>
      <span class="count" id="count"></span>
    </div>
  </div>
  <p class="note" id="vnote">الصوت يعتمد على وجود صوت عربي في متصفحك (الأفضل Chrome أو Edge)، والترجمة المكتوبة تعمل دائماً. المسافة للإيقاف والتشغيل، والأسهم للتنقل.</p>
  <nav class="idx" id="idx"></nav>
</div>

<script>
const PARTS = [
/* =================== الجزء الأول =================== */
{ name:"الجزء ١ · أنواع البحوث وأدواتها", week:"الأسبوع الرابع", scenes:[
 {chap:"مقدمة", type:"title", h:"أنواع البحوث<br><em>وأدوات جمع البيانات</em>",
  chips:["كمي · نوعي · مزجي","المقابلة","الاستبانة","الملاحظة","الاختبارات والمقاييس"],
  say:["أهلاً بك في الجزء الأول من شرح الوحدة الثانية: المنهجية في البحث العلمي والتربوي.","في هذا الجزء نتعرف على أنواع البحوث الثلاثة: الكمي والنوعي والمزجي، ثم أدوات البحث الأربع: المقابلة، والاستبانة، والملاحظة، والاختبارات والمقاييس.","وبما أن الاختبار فيه تعاريف تكتب لها المصطلح، ركّز على التعريف بنصّه، وعلى الكلمة المفتاحية في كل تعريف."]},

 {chap:"١ · أنواع البحوث", title:"ثلاثة أنواع للبحوث العلمية", type:"compare", n:3,
  cols:[{h:"البحث الكمي",c:"var(--teal)",pts:["يدرس الظواهر بطريقة موضوعية ومنظمة","يجمع بيانات رقمية ويحللها بالأساليب الإحصائية","يقيس المتغيرات ويختبر الفرضيات ويكشف العلاقات والفروق","نتائج دقيقة يمكن تعميمها","أدواته: الاستبانات والاختبارات والمقاييس"],ex:"مثال: العلاقة بين استخدام التقنيات التعليمية والتحصيل الدراسي"},
        {h:"البحث النوعي",c:"var(--coral)",pts:["الفهم العميق للظواهر الإنسانية والاجتماعية","يدرس الخبرات والتجارب والمعاني والتصورات","لا يركز على القياس العددي","بيانات وصفية غنية بالتفاصيل","أدواته: المقابلات المتعمقة، الملاحظة المباشرة، تحليل الوثائق"],ex:"مثال: تحديات المعلمين عند تطبيق استراتيجيات التدريس الحديثة"},
        {h:"البحث المزجي (المختلط)",c:"var(--amber)",pts:["يجمع بين الكمي والنوعي في دراسة واحدة","فهم أكثر شمولاً وتكاملاً للمشكلة","الكمي يحدد حجم الظاهرة","النوعي يفسر الأسباب والسياقات","يجمع النوعين معاً أو أحدهما أولاً ثم الآخر"],ex:"مثال: استبانة لقياس رضا الطلبة عن التعليم الإلكتروني، ثم مقابلات لفهم الأسباب"}],
  key:"اختيار النوع لا يعتمد على تفضيل الباحث، بل على طبيعة المشكلة وأهداف الدراسة وأسئلتها",
  say:["تخيّل أنك تريد أن تعرف وضع الطلبة في حصة الرياضيات في مدرستك في عبري.","إذا سألت: كم درجة الطلبة؟ وهل توجد علاقة بين ساعات المذاكرة والدرجة؟ فأنت تتعامل مع أرقام، وهذا هو البحث الكمي. يدرس الظاهرة بطريقة موضوعية منظمة، ويجمع بيانات رقمية ويحللها إحصائياً، ويختبر الفرضيات، ويصل إلى نتائج يمكن تعميمها.","أما إذا سألت: كيف يشعر الطالب الضعيف داخل الحصة؟ وما تجربته؟ فأنت تبحث عن المعنى والخبرة، وهذا هو البحث النوعي. يركّز على الفهم العميق، ولا يعتمد على القياس العددي، بل على المقابلات المتعمقة والملاحظة المباشرة وتحليل الوثائق.","وإذا جمعت الاثنين، وزعت استبانة على مئتي طالب لتعرف مستوى رضاهم، ثم قابلت بعضهم لتفهم لماذا ارتفع أو انخفض الرضا، فهذا هو البحث المزجي أو المختلط.","في المزجي، البيانات الكمية تحدد حجم الظاهرة، والبيانات النوعية تفسر الأسباب.","والقاعدة المهمة: اختيار نوع البحث لا يعتمد على تفضيل الباحث الشخصي، بل على طبيعة المشكلة وأهدافها وأسئلتها ونوعية البيانات المطلوبة."]},

 {chap:"١ · أنواع البحوث", title:"طبّق: صنّف البحث (نشاط الأسبوع الرابع)", type:"cases",
  items:[{q:"قياس العلاقة بين ساعات الدراسة والتحصيل الدراسي",a:"كمي",w:"متغيران رقميان يُقاسان ويُحسب الارتباط بينهما إحصائياً",c:"var(--teal)"},
         {q:"استكشاف تجارب المعلمين في التعامل مع صعوبات التعلم من خلال المقابلات",a:"نوعي",w:"الهدف فهم التجارب والمعاني، والأداة مقابلات",c:"var(--coral)"},
         {q:"قياس اتجاهات الطلبة نحو التعلم الإلكتروني باستبانة، ثم مقابلات لتفسير النتائج",a:"مزجي",w:"أداة كمية (استبانة) ثم أداة نوعية (مقابلات) في دراسة واحدة",c:"var(--amber)"}],
  say:["لنطبّق على نشاط الأسبوع الرابع.","الموقف الأول: قياس العلاقة بين ساعات الدراسة والتحصيل. الكلمة المفتاحية هنا: قياس، وعلاقة، ومتغيرات رقمية. إذن هو بحث كمي.","الموقف الثاني: استكشاف تجارب المعلمين مع صعوبات التعلم عبر المقابلات. الكلمات المفتاحية: استكشاف، وتجارب، ومقابلات. إذن هو بحث نوعي.","الموقف الثالث: استبانة لقياس الاتجاهات، ثم مقابلات لتفسير النتائج. هنا أداة كمية ثم أداة نوعية، إذن هو بحث مزجي.","حيلة سريعة: أرقام وقياس يعني كمي، معاني وتجارب يعني نوعي، والاثنان معاً يعني مزجي."]},

 {chap:"٢ · أدوات البحث", title:"أدوات البحث وجمع البيانات", type:"grid", c:2,
  items:[{t:"المقابلة",d:"تفاعل مباشر بين الباحث والمبحوث، تناسب التعمق وفهم الآراء والتجارب"},{t:"الاستبانة",d:"أسئلة مكتوبة منظمة، تناسب جمع البيانات من عدد كبير في أماكن متباعدة"},{t:"الملاحظة",d:"مشاهدة السلوك وتسجيله لحظة حدوثه، تناسب دراسة السلوك الفعلي"},{t:"الاختبارات والمقاييس",d:"قياس خصائص أو قدرات محددة بطريقة منظمة، بشرط الصدق والثبات والموضوعية"}],
  key:"لا توجد أداة واحدة أفضل لجميع الدراسات؛ الاختيار يرتبط بأسئلة البحث وأهدافه ونوع البيانات",
  say:["أدوات البحث هي الوسائل التي يستخدمها الباحث للحصول على المعلومات والبيانات اللازمة للإجابة عن أسئلة الدراسة واختبار فرضياتها.","ويعتمد اختيار الأداة على طبيعة المشكلة، ونوع المنهج، وخصائص المجتمع والعينة، ونوع البيانات المطلوبة.","أبرز الأدوات أربع: المقابلة للتعمق، والاستبانة لعدد كبير من المشاركين، والملاحظة لدراسة السلوك الفعلي، والاختبارات والمقاييس للقياس المنظم.","ولا توجد أداة واحدة أفضل لكل الدراسات، ويمكن الجمع بين أكثر من أداة للحصول على معلومات أشمل."]},

 {chap:"٢ · أدوات البحث", title:"لماذا هذه الأداة بالذات؟", type:"cases",
  items:[{q:"رضا الطلبة عن الخدمات الجامعية",a:"استبانة",w:"عدد كبير من الطلبة، وبيانات موحدة سريعة. مكمّلة: مقابلات مع عيّنة لفهم الأسباب",c:"var(--teal)"},
         {q:"أسباب الغياب",a:"مقابلة",w:"الأسباب شخصية وتحتاج تعمقاً واستفساراً. مكمّلة: استبانة لمعرفة انتشار كل سبب",c:"var(--coral)"},
         {q:"التفاعل داخل الصف",a:"ملاحظة",w:"سلوك فعلي يُرصد لحظة حدوثه بدل الاعتماد على ما يقوله الطلبة",c:"var(--amber)"},
         {q:"أثر برنامج تعليمي في التحصيل",a:"اختبار",w:"التحصيل يُقاس بالدرجات قبل البرنامج وبعده",c:"var(--violet)"}],
  say:["هذا هو النشاط الثاني من الأسبوع الرابع: أي أداة تناسب السؤال؟","رضا الطلبة عن الخدمات الجامعية، مثل خدمات الحافلات والمكتبة في جامعة صحار: الأنسب استبانة، لأن العدد كبير. ميزتها السرعة، وعيبها انخفاض نسبة الردود. وأداة مكملة: مقابلات مع بعض الطلبة لفهم الأسباب.","أسباب الغياب: الأنسب المقابلة، لأن الأسباب شخصية وتحتاج تعمقاً. عيبها أنها تأخذ وقتاً وجهداً.","التفاعل داخل الصف: الأنسب الملاحظة، لأنها ترصد ما يفعله الطلبة فعلاً، لا ما يقولون إنهم يفعلونه.","أثر برنامج تعليمي في التحصيل: الأنسب الاختبار، قبل البرنامج وبعده، لأن التحصيل يُقاس بالدرجات."]},

 {chap:"٢ · أدوات البحث › المقابلة", title:"المقابلة", type:"def",
  term:"التعريف",
  def:"محادثة موجهة بين الباحث والمبحوث للوصول إلى حقيقة أو موقف ما، وذلك لتحقيق أهداف الدراسة.",
  parts:["ليست حواراً عادياً، بل عملية بحثية مخططة لها أهداف وأسئلة","تفاعلية: يستفسر الباحث ويطلب التوضيح ويطرح أسئلة متابعة","قيمتها في الدراسات التي تهدف إلى فهم التجارب والمواقف بعمق"], partsLabel:"ما يميزها",
  key:"الكلمة المفتاحية: محادثة موجهة",
  say:["نبدأ بأول أداة: المقابلة.","تعريفها: محادثة موجهة بين الباحث والمبحوث، للوصول إلى حقيقة أو موقف ما، وذلك لتحقيق أهداف الدراسة.","احفظ الكلمة المفتاحية: محادثة موجهة. إذا جاءك في الاختبار تعريف فيه محادثة موجهة، فالمصطلح هو المقابلة.","والمقابلة ليست مجرد سوالف عادية، بل عملية بحثية مخططة لها أهداف وأسئلة محددة.","مثال: باحث يجلس مع معلمي الرياضيات في مدارس عبري ويسألهم عن تحديات تدريس الكسور، وإذا كانت الإجابة مختصرة يقول له: وضّح أكثر، أعطني مثالاً. هذه هي ميزة المقابلة التفاعلية."]},

 {chap:"٢ · أدوات البحث › المقابلة", title:"الأمور الواجب مراعاتها أثناء إجراء المقابلة", type:"grid", c:4, tight:true, numbered:1,
  items:[{t:"تدريب الأشخاص المكلفين بإجراء المقابلة",d:"والتأكد من كفاءتهم"},{t:"الترتيب المسبق للمقابلة"},{t:"تحديد مكان إجراء المقابلة",d:"هادئ ويوفر الخصوصية"},{t:"مناسبة مظهر الباحث وهندامه"},{t:"خلق جو ودي بين الباحث والمبحوث"},{t:"مراعاة قواعد وأسس طرح الأسئلة",d:"على المستجيب أثناء المقابلة"},{t:"ألا يترك للمبحوث إدارة المقابلة",d:"والسيطرة على مجرياتها"},{t:"اختيار الطريقة المناسبة لتسجيل الإجابات",d:"كتابة أو تسجيل صوتي بعد الموافقة"}],
  key:"العلاقة الودية لا تعني فقدان السيطرة المنهجية على المقابلة",
  say:["هناك ثمانية أمور يجب مراعاتها أثناء إجراء المقابلة.","أولاً: تدريب الأشخاص المكلفين بإجراء المقابلة والتأكد من كفاءتهم، لأن اختلاف أسلوب الباحثين قد يغير البيانات.","ثانياً: الترتيب المسبق للمقابلة. ثالثاً: تحديد مكان إجرائها، يكون هادئاً ويوفر الخصوصية.","رابعاً: مناسبة مظهر الباحث وهندامه. خامساً: خلق جو ودي بين الباحث والمبحوث، لبناء الثقة.","سادساً: مراعاة قواعد طرح الأسئلة، دون أن يوحي للمشارك بإجابة معينة.","سابعاً: ألا يترك للمبحوث إدارة المقابلة، فالعلاقة الودية لا تعني فقدان السيطرة.","ثامناً: اختيار الطريقة المناسبة لتسجيل الإجابات، سواء بالكتابة أو التسجيل الصوتي بعد أخذ الموافقة."]},

 {chap:"٢ · أدوات البحث › المقابلة", title:"مزايا المقابلة وعيوبها", type:"compare",
  cols:[{h:"المزايا",c:"var(--teal)",pts:["ارتفاع نسبة الردود مقارنة بالاستبانة","المرونة وقابلية توضيح الأسئلة للمستجيب أو المسؤول","وسيلة ممكنة للتطبيق في مجتمعات الأمية والأطفال","وسيلة لجمع البيانات عن ظواهر شخصية أو انفعالات خاصة بالمستجيب"],ex:"أهم ما يميزها: العمق والمرونة"},
        {h:"العيوب",c:"var(--coral)",pts:["تحتاج إلى وقت وجهد كبيرين في حالة الأعداد الكبيرة وطول مدة المقابلة","صعوبة الوصول إلى بعض الأفراد ومقابلتهم شخصياً","قد تتأثر بالحالة النفسية للباحث والمبحوث","إمكانية التحيز من قبل المبحوث للظهور بشكل لائق أمام الباحث"],ex:"أبرز تحدياتها: التكلفة الزمنية والتحيز"}],
  say:["ما مزايا المقابلة؟ أولاً: ارتفاع نسبة الردود مقارنة بالاستبانة، لأن الباحث أمامك ولن تتجاهله.","ثانياً: المرونة وإمكانية توضيح السؤال إذا لم يفهمه المستجيب.","ثالثاً: يمكن تطبيقها مع الأميين والأطفال، الذين لا يستطيعون تعبئة استبانة مكتوبة.","رابعاً: مناسبة لجمع بيانات عن الظواهر الشخصية والانفعالات الخاصة.","أما عيوبها: تحتاج وقتاً وجهداً كبيرين مع الأعداد الكبيرة، وصعوبة الوصول لبعض الأفراد.","وقد تتأثر بالحالة النفسية للباحث والمبحوث، ومن عيوبها المهمة: التحيز، فقد يعطي المبحوث إجابة يظنها مقبولة اجتماعياً ليظهر بشكل لائق، بدل أن يعبر عن رأيه الحقيقي."]},

 {chap:"٢ · أدوات البحث › الاستبانة", title:"الاستبانة", type:"def",
  term:"التعريف",
  def:"مجموعة من الأسئلة والعبارات المكتوبة بغرض الحصول على معلومات أو آراء المبحوثين حول ظاهرة ما أو موقف معين.",
  parts:["<i>١</i>المقدمة: توضح الغرض من الدراسة","<i>٢</i>إرشادات التعبئة: تعليمات واضحة","<i>٣</i>متن الاستبانة: الأسئلة أو العبارات"], partsLabel:"أقسامها الثلاثة",
  key:"أنواع الأسئلة: مغلقة · مفتوحة · مزدوجة (مغلقة ومفتوحة) · صور ورسومات",
  say:["الأداة الثانية: الاستبانة، وهي من أكثر أدوات جمع البيانات استخداماً.","تعريفها: مجموعة من الأسئلة والعبارات المكتوبة، بغرض الحصول على معلومات أو آراء المبحوثين حول ظاهرة ما أو موقف معين.","الكلمة المفتاحية: أسئلة وعبارات مكتوبة.","ومن المبادئ العامة أن تكون مطبوعة بشكل أنيق وواضح وجذاب، وتُقسم إلى ثلاثة أقسام: المقدمة، وإرشادات التعبئة، ومتن الاستبانة.","والأسئلة قد تكون مغلقة تتطلب الاختيار من بدائل، مثل: موافق بشدة، موافق، محايد. أو مفتوحة يكتب فيها المشارك إجابته بنفسه. أو مزدوجة تجمع بين المغلق والمفتوح، أو عبارة عن صور ورسومات."]},

 {chap:"٢ · أدوات البحث › الاستبانة", title:"الأمور الواجب مراعاتها عند صياغة أسئلة الاستبانة", type:"grid", c:4, tight:true, numbered:1,
  items:[{t:"أن تكون واضحة ومحددة",d:"وبلغة تتناسب مع المبحوثين"},{t:"تعريف المصطلحات الغامضة",d:"التي تحتمل أكثر من تفسير"},{t:"أن يكون طول السؤال مناسباً"},{t:"وضع جميع الاختيارات الممكنة",d:"لإجابة السؤال متعدد الإجابة"},{t:"التدرج من السهل إلى الصعب"},{t:"الانتقال من العامة إلى الخاصة"},{t:"أن يكون السؤال دقيقاً ومحدداً",d:"يعالج مشكلة أو ظاهرة معينة"},{t:"ترتيب الأسئلة حسب الموضوعات الفرعية",d:"إذا غطت أكثر من موضوع فرعي"}],
  say:["عند صياغة أسئلة الاستبانة نراعي ثمانية أمور.","أن تكون الأسئلة واضحة ومحددة وبلغة تناسب المبحوثين، فلا نكتب لطلاب الصف الثامن بلغة أكاديمية معقدة.","وتعريف المصطلحات الغامضة التي تحتمل أكثر من تفسير، وأن يكون طول السؤال مناسباً، لأن السؤال الطويل يسبب الارتباك.","ووضع جميع الاختيارات الممكنة للإجابة، والتدرج من السهل إلى الصعب، والانتقال من العام إلى الخاص.","وأن يكون كل سؤال دقيقاً يعالج مشكلة معينة، وترتيب الأسئلة حسب الموضوعات الفرعية إذا كانت الاستبانة تغطي أكثر من محور."]},

 {chap:"٢ · أدوات البحث › الاستبانة", title:"مزايا الاستبانة وعيوبها", type:"compare",
  cols:[{h:"المزايا",c:"var(--teal)",pts:["توفر الكثير من الجهد والوقت في جمع البيانات، خاصة الإرسال بالبريد","تغطي أماكن متباعدة في فترة زمنية قصيرة","تترك الحرية للمبحوث في التفكير واختيار الوقت المناسب للتعبئة","تقلل من مسألة التحيز (تأثير الباحث المباشر)"],ex:"نجاحها لا يقاس بعدد الأسئلة، بل بوضوحها وارتباطها بأهداف الدراسة"},
        {h:"العيوب",c:"var(--coral)",pts:["انخفاض نسبة الردود","قد توجد أسئلة غير مجاب عنها من قبل المبحوثين","قد يجيب المستجيب إجابة مغايرة للمطلوب في حالة الأسئلة غير المفهومة","لا توضح للباحث الأمور العاطفية والانفعالية"],ex:"أقل قدرة من المقابلة على الكشف عن الانفعالات والأسباب الكامنة"}],
  say:["مزايا الاستبانة: توفر الجهد والوقت، وتغطي أماكن متباعدة في فترة قصيرة. مثلاً تستطيع إرسال رابط استبانة إلكترونية لمعلمين في مسقط وصلالة وعبري في نفس اليوم.","وتترك للمبحوث حرية التفكير واختيار الوقت المناسب، وتقلل من التحيز لأن الباحث غير موجود أمامه.","وعيوبها: انخفاض نسبة الردود، وكلنا نعرف كم رابط استبانة وصلنا في الواتساب ولم نعبئه!","وقد تبقى أسئلة بلا إجابة، وقد يسيء المستجيب فهم السؤال فيجيب إجابة مغايرة، ولا يوجد باحث يوضح له.","وأخيراً لا توضح للباحث الأمور العاطفية والانفعالية. لاحظ أن مزايا الاستبانة هي تقريباً عيوب المقابلة، والعكس صحيح."]},

 {chap:"٢ · أدوات البحث › الملاحظة", title:"الملاحظة", type:"def",
  term:"التعريف",
  def:"عبارة عن مراقبة أو مشاهدة لسلوك الظواهر والمشكلات والأحداث ومكوناتها المادية والبيئية ومتابعة سيرها واتجاهاتها وعلاقاتها بأسلوب علمي منظم ومخطط وهادف، بقصد التفسير وتحديد العلاقة بين المتغيرات والتنبؤ بسلوك الظاهرة وتوجيهها لخدمة أغراض الإنسان وتلبية احتياجاته.",
  parts:["تختلف عن المشاهدة اليومية: الباحث يحدد مسبقاً ماذا يلاحظ وكيف يسجل وفي أي سياق","مناسبة عندما يهتم الباحث بما يفعله الأفراد فعلياً لا بما يقولون إنهم يفعلونه"], partsLabel:"الفكرة الأساسية",
  key:"الكلمة المفتاحية: مراقبة أو مشاهدة السلوك بأسلوب علمي منظم ومخطط وهادف",
  say:["الأداة الثالثة: الملاحظة.","تعريفها: مراقبة أو مشاهدة لسلوك الظواهر والمشكلات والأحداث ومكوناتها المادية والبيئية، ومتابعة سيرها واتجاهاتها وعلاقاتها، بأسلوب علمي منظم ومخطط وهادف.","بقصد التفسير، وتحديد العلاقة بين المتغيرات، والتنبؤ بسلوك الظاهرة، وتوجيهها لخدمة أغراض الإنسان.","الفرق بينها وبين المشاهدة اليومية: الباحث يحدد مسبقاً ماذا سيلاحظ، وكيف سيسجل، وفي أي سياق.","مثال: لو سألت الطلاب: هل تشاركون في الحصة؟ سيقول أغلبهم نعم. لكن لو جلست في آخر الصف ومعك بطاقة ملاحظة تسجل عدد المشاركات، ستعرف الحقيقة. الملاحظة تقيس ما يفعله الناس فعلاً، لا ما يقولونه."]},

 {chap:"٢ · أدوات البحث › الملاحظة", title:"الأمور الواجب مراعاتها أثناء إجراء الملاحظة", type:"grid", c:2, numbered:1,
  items:[{t:"أن يجمع معلومات أساسية مسبقة",d:"عن الشيء المراد ملاحظته"},{t:"ضرورة تحديد الباحث لأهداف الملاحظة",d:"والأمور الأساسية المطلوب ملاحظتها"},{t:"اختيار الوسيلة الملائمة لتسجيل الأحداث",d:"أو المشاهدات، والتدرب عليها (قوائم، نماذج، مذكرات ميدانية)"},{t:"القيام بالمشاهدة والملاحظة بشكل ناقد",d:"وبعناية لكل صغيرة وكبيرة خاصة بالظاهرة"}],
  key:"التدريب على التسجيل ضروري لتقليل الاختلاف في تفسير الأحداث، خاصة إذا شارك أكثر من باحث",
  say:["هناك أربعة أمور يجب مراعاتها أثناء الملاحظة.","أولاً: جمع معلومات أساسية مسبقة عن الشيء المراد ملاحظته.","ثانياً: تحديد أهداف الملاحظة والأمور الأساسية المطلوب ملاحظتها بدقة.","ثالثاً: اختيار الوسيلة الملائمة لتسجيل الأحداث، مثل القوائم أو النماذج أو المذكرات الميدانية، والتدرب عليها.","رابعاً: القيام بالملاحظة بشكل ناقد، والانتباه لكل صغيرة وكبيرة.","وهذا يفسر نشاط بطاقة الملاحظة: عندما يطبق طالبان البطاقة نفسها على نفس المشهد، ثم تختلف تسجيلاتهما، فالسبب غالباً غموض المؤشرات أو ضعف التدريب أو تحيز الملاحظ."]},

 {chap:"٢ · أدوات البحث › الملاحظة", title:"مزايا الملاحظة وعيوبها", type:"compare",
  cols:[{h:"المزايا",c:"var(--teal)",pts:["من أكثر وسائل جمع المعلومات فائدة للتعرف على الظواهر أو الحوادث","المصدر الرئيسي للمعلومات عن السلوك الطبيعي، دون الاعتماد على ما يدليه المبحوث","أكثر ملاءمة في دراسة سلوك ما أو ظواهر طبيعية مقارنة بالمقابلة والاستبانة","تسجيل السلوك في أثناء حدوث الظاهرة","تسمح بالتعرف على ظواهر عارضة لا يفكر فيها الباحث مسبقاً"],ex:""},
        {h:"العيوب",c:"var(--coral)",pts:["تحتاج من الباحث جهداً كبيراً ووقتاً طويلاً وتكلفة مرتفعة","قد يكون الباحث عرضة للخطر (مثل دراسة سلوك بعض القبائل البدائية)","قد يقع فيها تحيز من الباحث، مقصوداً أو غير مقصود","قد يحدث تحيز من المبحوثين باصطناع السلوك","يصعب استخدامها في خصوصيات الأفراد مثل العلاقات الزوجية"],ex:""}],
  key:"اصطناع السلوك: يتغير سلوك المشاركين عندما يعلمون أنهم تحت الملاحظة",
  say:["مزايا الملاحظة: من أكثر وسائل جمع المعلومات فائدة، وهي المصدر الرئيسي للمعلومات عن السلوك الطبيعي.","وتسجل السلوك أثناء حدوثه، وتسمح باكتشاف ظواهر عارضة لم يتوقعها الباحث.","أما عيوبها: تحتاج جهداً ووقتاً وتكلفة، وقد يتعرض الباحث للخطر في بعض البيئات.","وقد يقع تحيز من الباحث نفسه، مقصود أو غير مقصود.","وأهم عيب يُسأل عنه: اصطناع السلوك. تذكّر يوم يدخل المشرف التربوي حصتك، كيف يصير الطلاب فجأة هادئين ومنظمين؟ هذا هو تحيز المبحوثين باصطناع السلوك.","وأخيراً يصعب استخدام الملاحظة في خصوصيات الأفراد مثل العلاقات الزوجية."]},

 {chap:"٢ · أدوات البحث › الاختبارات", title:"الاختبارات والمقاييس", type:"def",
  term:"التعريف",
  def:"أدوات وضعت لوصف وقياس عينة في جوانب سلوكية معينة وتحديد مقدارها.",
  parts:["<i>١</i>فرد أو مجموعة قبل وبعد","<i>٢</i>جماعة وأخرى","<i>٣</i>فرد وجماعة (مرجعية)","<i>٤</i>فرد وآخر"], partsLabel:"تستخدم في مقارنة أربع حالات",
  key:"تحوّل الخاصية محل الدراسة إلى درجات أو مؤشرات يمكن تحليلها ومقارنتها",
  say:["الأداة الرابعة: الاختبارات والمقاييس.","تعريفها: أدوات وضعت لوصف وقياس عينة في جوانب سلوكية معينة، وتحديد مقدارها.","وتستخدم في مقارنة أربع حالات: الأولى، فرد أو مجموعة قبل وبعد، مثل اختبار قبلي وبعدي لطلاب الصف الثامن قبل وحدة الكسور وبعدها.","الثانية: جماعة وأخرى، مثل مقارنة صف ثامن أ مع صف ثامن ب.","الثالثة: فرد وجماعة، أي مقارنة طالب بمتوسط مجموعة مرجعية.","الرابعة: فرد وآخر، أي مقارنة طالب بطالب."]},

 {chap:"٢ · أدوات البحث › الاختبارات", title:"أمور يجب مراعاتها + شروط الاختبار الجيد", type:"grid", c:3, tight:true, numbered:1,
  items:[{t:"تحديد المجال الذي يراد قياسه"},{t:"تمثيل عناصر الاختبار لجميع عناصر المجال"},{t:"الصياغة العلمية لبنود الاختبار",d:"تقيس ما وضعت لقياسه، منسجمة مع أهدافه، ودقة ووضوح العبارات"},{t:"وضع فترة زمنية مناسبة لإجراء الاختبار"},{t:"وضوح تعليمات الاختبار"},{t:"مراعاة شروط الاختبار الجيد"}],
  extra:[{t:"الثبات",d:"مدى دقته واتساقه؛ أي أن يعطي نفس النتائج إذا ما تم استخدامه أكثر من مرة تحت ظروف مماثلة"},{t:"الصدق",d:"مدى قدرته على قياس ما وضع لقياسه"},{t:"الموضوعية",d:"اتصاف أسئلة أو عبارات الاختبار ببعد التحيز"}], extraLabel:"شروط الاختبار الجيد الثلاثة",
  say:["عند إجراء الاختبارات والمقاييس نراعي ستة أمور: تحديد المجال المراد قياسه، وأن تمثل عناصر الاختبار جميع عناصر المجال.","والصياغة العلمية للبنود بحيث تقيس ما وضعت لقياسه، ووضع فترة زمنية مناسبة، ووضوح التعليمات، ومراعاة شروط الاختبار الجيد.","وشروط الاختبار الجيد ثلاثة، وهي مهمة جداً للتعاريف:","الثبات: مدى دقة الاختبار واتساقه، أي أن يعطي نفس النتائج إذا استخدم أكثر من مرة تحت ظروف مماثلة.","الصدق: مدى قدرته على قياس ما وضع لقياسه.","الموضوعية: اتصاف أسئلة الاختبار ببعد التحيز."]},

 {chap:"٢ · أدوات البحث › الاختبارات", title:"مزايا الاختبارات والمقاييس وعيوبها", type:"compare",
  cols:[{h:"المزايا",c:"var(--teal)",pts:["ارتفاع نسبة الردود","تغطي أماكن متباعدة في فترة زمنية قصيرة","تترك الحرية للمبحوث في التفكير","تقلل من مسألة التحيز"],ex:"تسمح بالحصول على بيانات منظمة وإجراء المقارنات"},
        {h:"العيوب",c:"var(--coral)",pts:["تحتاج إلى وقت وجهد كبيرين","قد تتأثر بالحالة النفسية للباحث والمبحوث","قد توجد أسئلة غير مجاب عنها من قبل المبحوثين","لا توضح للباحث الأمور العاطفية والانفعالية","قد يقع فيها تحيز من قبل الباحث، سواء كان مقصوداً من قبله أو غير مقصود"],ex:"سهولة التطبيق لا تكفي للحكم على جودة الاختبار"}],
  say:["مزايا الاختبارات والمقاييس: ارتفاع نسبة الردود، وتغطية أماكن متباعدة في فترة قصيرة، وتترك الحرية للمبحوث في التفكير، وتقلل التحيز.","وعيوبها: تحتاج وقتاً وجهداً كبيرين في الإعداد، وقد تتأثر بالحالة النفسية للباحث والمبحوث، فالطالب المتوتر يوم الاختبار قد لا يعكس مستواه الحقيقي.","وقد توجد أسئلة غير مجاب عنها، ولا توضح الأمور العاطفية، وقد يقع تحيز من الباحث.","والقاعدة: سهولة تطبيق الاختبار لا تكفي للحكم على جودته؛ الأولوية لوجود أدلة على الثبات والصدق والموضوعية."]},

 {chap:"٢ · أدوات البحث › الاختبارات", title:"حلّل المواقف الثلاثة (نشاط ٥)", type:"cases",
  items:[{q:"اختبار لقياس التفكير الناقد يتكون من أسئلة حفظ فقط",a:"ضعف الصدق",w:"الاختبار لا يقيس ما وُضع لقياسه؛ يقيس الحفظ بدل التفكير الناقد",c:"var(--coral)"},
         {q:"اختبار يعطي نتائج متباينة جداً عند تكراره في ظروف متشابهة",a:"ضعف الثبات",w:"غياب الاتساق والاستقرار في النتائج",c:"var(--amber)"},
         {q:"إجابة واحدة يمنحها مصححان درجتين مختلفتين لغياب معايير تصحيح واضحة",a:"ضعف الموضوعية",w:"التصحيح تأثر بالأحكام الشخصية للمصحح",c:"var(--violet)"}],
  key:"الصدق ← يقيس ما وُضع له · الثبات ← نفس النتائج · الموضوعية ← بعيد عن التحيز",
  say:["الآن نطبق على النشاط الخامس، وهو سؤال متوقع جداً في الاختبار.","الموقف الأول: اختبار للتفكير الناقد كله أسئلة حفظ. المشكلة: ضعف الصدق، لأن الاختبار لا يقيس ما وضع لقياسه.","الموقف الثاني: اختبار يعطي نتائج متباينة جداً عند تكراره في ظروف متشابهة. المشكلة: ضعف الثبات، لأنه غير متسق.","الموقف الثالث: إجابة واحدة يعطيها مصححان درجتين مختلفتين لغياب معايير تصحيح واضحة. المشكلة: ضعف الموضوعية.","وهذا يحصل فعلاً في المدارس، ولهذا نستخدم سلّم تقدير أو نموذج إجابة واضح للأسئلة المقالية."]},

 {chap:"مراجعة", title:"مصطلحات الجزء الأول: اقرأ التعريف واذكر المصطلح", type:"terms",
  items:[{t:"البحث الكمي",d:"يدرس الظواهر بطريقة موضوعية ومنظمة من خلال جمع البيانات الرقمية وتحليلها بالأساليب الإحصائية"},{t:"البحث النوعي",d:"يركز على الفهم العميق للظواهر الإنسانية والاجتماعية والتربوية من خلال دراسة الخبرات والتجارب والمعاني والتصورات"},{t:"البحث المزجي",d:"يجمع بين البحث الكمي والنوعي ضمن دراسة علمية واحدة"},{t:"المقابلة",d:"محادثة موجهة بين الباحث والمبحوث للوصول إلى حقيقة أو موقف ما لتحقيق أهداف الدراسة"},{t:"الاستبانة",d:"مجموعة من الأسئلة والعبارات المكتوبة بغرض الحصول على معلومات أو آراء المبحوثين حول ظاهرة ما"},{t:"الملاحظة",d:"مراقبة أو مشاهدة لسلوك الظواهر بأسلوب علمي منظم ومخطط وهادف بقصد التفسير والتنبؤ"},{t:"الاختبارات والمقاييس",d:"أدوات وضعت لوصف وقياس عينة في جوانب سلوكية معينة وتحديد مقدارها"},{t:"الثبات",d:"أن يعطي الاختبار نفس النتائج إذا استخدم أكثر من مرة تحت ظروف مماثلة"},{t:"الصدق",d:"مدى قدرة الاختبار على قياس ما وضع لقياسه"},{t:"الموضوعية",d:"اتصاف أسئلة أو عبارات الاختبار ببعد التحيز"}],
  say:["لنراجع مصطلحات الجزء الأول بطريقة الاختبار: أقرأ التعريف، وأنت تقول المصطلح قبل أن يظهر.","يدرس الظواهر من خلال جمع بيانات رقمية وتحليلها إحصائياً: البحث الكمي. يركز على الفهم العميق للخبرات والمعاني: البحث النوعي. يجمع بين الاثنين: البحث المزجي.","محادثة موجهة بين الباحث والمبحوث: المقابلة. أسئلة وعبارات مكتوبة: الاستبانة.","مراقبة أو مشاهدة السلوك بأسلوب علمي منظم ومخطط وهادف: الملاحظة. أدوات لوصف وقياس عينة في جوانب سلوكية: الاختبارات والمقاييس.","نفس النتائج عند التكرار: الثبات. يقيس ما وضع لقياسه: الصدق. بعيد عن التحيز: الموضوعية."]},

 {chap:"مراجعة", title:"أرقام الجزء الأول", type:"nums",
  items:[{n:"٣",t:"أنواع البحوث: كمي، نوعي، مزجي"},{n:"٤",t:"أدوات البحث"},{n:"٨",t:"أمور تراعى في المقابلة"},{n:"٣",t:"أقسام الاستبانة"},{n:"٨",t:"أمور في صياغة أسئلة الاستبانة"},{n:"٤",t:"أمور تراعى في الملاحظة"},{n:"٤",t:"حالات مقارنة في الاختبارات"},{n:"٦",t:"أمور تراعى في الاختبارات"},{n:"٣",t:"شروط الاختبار الجيد"}],
  say:["وأخيراً أرقام الجزء الأول: ثلاثة أنواع للبحوث، وأربع أدوات للبحث.","ثمانية أمور تراعى في المقابلة، وثلاثة أقسام للاستبانة، وثمانية أمور في صياغة أسئلتها.","أربعة أمور في الملاحظة، وأربع حالات مقارنة في الاختبارات، وستة أمور تراعى فيها، وثلاثة شروط للاختبار الجيد.","انتهى الجزء الأول. في الجزء الثاني ننتقل إلى البحث الاستكشافي والمنهج الوصفي والتجريبي."]}
]},

/* =================== الجزء الثاني =================== */
{ name:"الجزء ٢ · الاستكشافي والوصفي والتجريبي", week:"الأسبوع الخامس", scenes:[
 {chap:"مقدمة", type:"title", h:"مناهج البحث<br><em>الاستكشافي · الوصفي · التجريبي</em>",
  chips:["البحث الاستكشافي","المنهج الوصفي وأنواعه","خطوات المنهج الوصفي","البحث التجريبي","المتغيرات والتصميمات"],
  say:["أهلاً بك في الجزء الثاني من الوحدة الثانية.","سنتعرف في هذا الجزء على البحث الاستكشافي، ثم المنهج الوصفي وأنواعه وخطواته، ثم البحث التجريبي ومتغيراته وتصميماته.","وفي النهاية مراجعة للمصطلحات والأرقام."]},

 {chap:"١ · البحث الاستكشافي", title:"البحوث الاستكشافية", type:"def",
  term:"التعريف",
  def:"من المداخل البحثية التي يلجأ إليها الباحث عندما تكون المشكلة أو الظاهرة التي يريد دراستها غير واضحة بصورة كافية، أو عندما تكون المعلومات المتوافرة عنها محدودة ولا تسمح منذ البداية بصياغة أسئلة دقيقة أو فرضيات محددة.",
  parts:["يُشبَّه الباحث الاستكشافي بالمسافر أو المستكشف","ليس لها منهجية محددة ولا إطار مقيد بخطوات بعينها، بل مرنة وقابلة للتغير","الباحث فيها يجب أن يكون مرناً وقابلاً لتغيير اتجاهاته عند ظهور بيانات ومشاهدات جديدة"], partsLabel:"سماتها",
  key:"المرونة لا تعني العشوائية؛ بل إن التصميم لا يكون مقيداً منذ البداية بكل التفاصيل",
  say:["البحوث الاستكشافية: يلجأ إليها الباحث عندما تكون المشكلة أو الظاهرة غير واضحة بصورة كافية، أو عندما تكون المعلومات المتوافرة عنها محدودة، ولا تسمح منذ البداية بصياغة أسئلة دقيقة أو فرضيات محددة.","يُشبَّه الباحث الاستكشافي بالمسافر أو المستكشف الذي يبدأ رحلته ولديه هدف عام، لكنه لا يعرف مسبقاً كل التفاصيل التي سيواجهها في الطريق.","تخيّل أنك أول مرة تزور ولاية لم تزرها من قبل؛ تعرف أنك تريد أن تستكشفها، لكنك تقرر الطريق حسب ما تشاهده. هذا هو البحث الاستكشافي.","ولذلك البحوث الاستكشافية مرنة وقابلة للتغير، وليس لها منهجية محددة ولا إطار مقيد بخطوات بعينها.","لكن انتبه: المرونة لا تعني أنه بحث عشوائي يفتقر إلى الأسس العلمية."]},

 {chap:"١ · البحث الاستكشافي", title:"خصائص البحث الاستكشافي", type:"grid", c:2, numbered:1,
  items:[{t:"أهميته في المراحل الأولى",d:"لدراسة المشكلات الجديدة أو قليلة الدراسة؛ يكوّن فهماً أولياً ويكشف المتغيرات"},{t:"نتائجه أولية وتمهيدية",d:"لا يقدم أحكاماً نهائية، بل يفتح المجال أمام دراسات أكثر تحديداً"},{t:"مصادر البيانات غير محددة بالكامل",d:"مراجعة الدراسات، مقابلات، تحليل وثائق، ملاحظات ميدانية"},{t:"العينة صغيرة نسبياً",d:"الهدف فهم أولي لا تقدير خصائص مجتمع كبير؛ وإمكانية التعميم محدودة"}],
  ex:"مثال: باحث يريد دراسة استخدام طلبة الجامعات لأدوات الذكاء الاصطناعي، والمعلومات محدودة؛ فيبدأ بمقابلات مع عدد محدود من الطلبة والأساتذة، فتكشف قضايا مثل التحصيل ومهارات الكتابة والنزاهة الأكاديمية، ثم ينتقل لدراسة أكثر تحديداً.",
  say:["من خصائص البحث الاستكشافي: أهميته في المراحل الأولى من دراسة المشكلات الجديدة أو قليلة الدراسة؛ يساعد على تكوين فهم أولي، وتحديد المفاهيم، والكشف عن المتغيرات.","ونتائجه أولية وتمهيدية، ولا يقدم أحكاماً نهائية أو تعميمات واسعة.","ومصادر البيانات قد لا تكون محددة بالكامل منذ البداية: مراجعة الدراسات، ثم مقابلات، ثم تحليل وثائق أو ملاحظات ميدانية.","والعينة صغيرة نسبياً، لأن الهدف ليس الدقة الإحصائية، فإمكانية التعميم محدودة.","مثال من الملزمة: باحث يريد دراسة استخدام طلبة الجامعات لأدوات الذكاء الاصطناعي. يبدأ بمقابلات مع عدد محدود من الطلبة والأساتذة، فتكشف قضايا مثل التحصيل والكتابة والنزاهة الأكاديمية، ثم ينتقل إلى دراسة أوسع."]},

 {chap:"٢ · المنهج الوصفي", title:"تعريف المنهج الوصفي", type:"def",
  term:"التعريف",
  def:"منهج علمي يدرس الظاهرة كما توجد في الواقع دون التدخل في تغييرها، ويعتمد على جمع البيانات والمعلومات لوصف خصائص الظاهرة والظروف المحيطة بها، ثم يحلل هذه البيانات ويفسرها للكشف عن علاقاتها والوصول إلى فهم دقيق لها، بهدف استخلاص نتائج تسهم في فهم الواقع وتطويره.",
  parts:["شائع الاستخدام في البحوث التربوية مقارنة بالتاريخي والتجريبي، لارتباطه بالظواهر الإنسانية المتبدلة","الهدف من الوصف هو التحليل: الباحثون ليسوا مجرد مبوبين أو مجدولين للبيانات","يجمعون الأدلة ويبوبونها ويلخصونها، ثم يحللونها بعمق لاستخلاص تعميمات تؤدي إلى تقدم المعرفة"], partsLabel:"نقاط مهمة",
  key:"الكلمة المفتاحية: يدرس الظاهرة كما توجد في الواقع دون التدخل في تغييرها",
  say:["الآن المنهج الوصفي، وتعريفه مهم جداً.","هو منهج علمي يدرس الظاهرة كما توجد في الواقع، دون التدخل في تغييرها، ويعتمد على جمع البيانات والمعلومات لوصف خصائص الظاهرة والظروف المحيطة بها.","ثم يحلل هذه البيانات ويفسرها للكشف عن علاقاتها، والوصول إلى فهم دقيق لها، بهدف استخلاص نتائج تسهم في فهم الواقع وتطويره.","احفظ: كما توجد في الواقع، دون التدخل. هذا ما يميزه عن التجريبي الذي يتدخل ويغير.","وهو شائع الاستخدام في البحوث التربوية، لارتباطه بالظواهر الإنسانية التي تتسم بالتبدل والتحول.","والهدف من الوصف هو التحليل؛ فالباحث ليس مجرد شخص يجمع الأرقام في جداول، بل يحللها بعمق ليستخلص تعميمات تؤدي إلى تقدم المعرفة."]},

 {chap:"٢ · المنهج الوصفي", title:"مقارنة بين البحث الاستكشافي والبحث الوصفي", type:"table",
  head:["وجه المقارنة","البحث الاستكشافي","البحث الوصفي"],
  rows:[["هدف البحث","عام: تكوين رؤية أولية للمشكلة المطلوب بحثها","محدد: دراسة رؤى محددة، والمساعدة في الوصول إلى اختيار أسلوب المعالجة الأفضل"],["أهمية البحث (المشكلة)","غير واضحة في البداية","واضحة ومحددة"],["مصادر الحصول على البيانات","غير محددة","محددة جيداً"],["عينة البحث","صغيرة نسبياً والتعميم محدود جداً","كبيرة نسبياً وتمكّن من التعميم في حدود عينة"],["القدرة على الاستنتاج","استنتاجات أولية عامة","استنتاجات محددة"],["السؤال المركزي","ما الذي يحدث هنا؟ وما الجوانب التي ينبغي أن أدرسها؟","ما خصائص هذه الظاهرة؟ وما مستوى وجودها؟"]],
  key:"ليسا متعارضين بل متكاملان: الاستكشافي مرحلة تمهيدية تقود إلى الوصفي",
  say:["هذه المقارنة مطلوبة في النشاط الأول، وغالباً تأتي في الاختبار.","من حيث الهدف: الاستكشافي هدفه عام، تكوين رؤية أولية للمشكلة. والوصفي هدفه محدد.","المشكلة في الاستكشافي غير واضحة في البداية، وفي الوصفي واضحة ومحددة.","مصادر البيانات في الاستكشافي غير محددة، وفي الوصفي محددة جيداً.","العينة في الاستكشافي صغيرة والتعميم محدود جداً، وفي الوصفي كبيرة نسبياً وتمكّن من التعميم.","والاستنتاجات في الاستكشافي أولية عامة، وفي الوصفي محددة.","والسؤال المركزي في الاستكشافي: ما الذي يحدث هنا؟ وفي الوصفي: ما خصائص هذه الظاهرة وما مستوى وجودها؟","وهما ليسا متعارضين، بل متكاملان؛ فالاستكشافي قد يكون مرحلة تمهيدية تقود إلى الوصفي."]},

 {chap:"٢ · المنهج الوصفي", title:"أهمية المنهج الوصفي (نشاط ٢)", type:"grid", c:2, numbered:1,
  items:[{t:"يوفر بيانات عن واقع الظاهرة",d:"المراد دراستها، مع تفسير لهذه البيانات في حدود الإجراءات المنهجية وقدرة الباحث"},{t:"يحلل البيانات وينظمها بصورة كمية أو كيفية",d:"ويستخرج الاستنتاجات التي تساعد على فهم الظاهرة وتطويرها"},{t:"معني بعمل مقارنات",d:"لتحديد العلاقات بين الظاهرة محل الدراسة والظواهر الأخرى ذات الصلة"},{t:"يمكن استخدامه لدراسة الظواهر الإنسانية والطبيعية",d:"على حد سواء"}],
  say:["ما أهمية المنهج الوصفي؟ وهذا سؤال النشاط الثاني.","أولاً: يوفر بيانات عن واقع الظاهرة المراد دراستها، مع تفسير لهذه البيانات.","ثانياً: يحلل البيانات وينظمها بصورة كمية أو كيفية، ويستخرج الاستنتاجات التي تساعد على فهم الظاهرة وتطويرها.","ثالثاً: معني بعمل مقارنات لتحديد العلاقات بين الظاهرة والظواهر الأخرى ذات الصلة.","رابعاً: يمكن استخدامه لدراسة الظواهر الإنسانية والطبيعية على حد سواء.","ومن وجهة نظرك يمكنك أن تضيف: أنه يناسب البيئة المدرسية، لأن الباحث لا يستطيع دائماً أن يتدخل ويغير في الطلبة، فيدرسهم كما هم."]},

 {chap:"٢ · المنهج الوصفي", title:"أنواع البحوث الوصفية: ثلاثة اتجاهات", type:"compare", n:3,
  cols:[{h:"١. البحوث المسحية",c:"var(--teal)",pts:["المسح المدرسي","المسح الاجتماعي","دراسات الرأي العام","تحليل العمل","تحليل المضمون (المحتوى)"],ex:"تصف الواقع كما هو"},
        {h:"٢. بحوث العلاقات المتبادلة",c:"var(--amber)",pts:["دراسة الحالة","الدراسة السببية المقارنة","الدراسات الارتباطية"],ex:"تدرس العلاقات بين المتغيرات"},
        {h:"٣. البحوث النمائية",c:"var(--coral)",pts:["النمط النمائي: الدراسات الطولية والدراسات المستعرضة","النمط الاتجاهي"],ex:"تهتم بدراسة التغير والتطور"}],
  key:"المنهج الوصفي ليس أسلوباً واحداً، بل إطار واسع يمكن استخدامه وفق طبيعة المشكلة",
  say:["تنقسم البحوث الوصفية إلى ثلاثة اتجاهات رئيسية، وهذه خريطة ذهنية مهمة جداً.","الاتجاه الأول: البحوث المسحية، وتشمل: المسح المدرسي، والمسح الاجتماعي، ودراسات الرأي العام، وتحليل العمل، وتحليل المضمون.","الاتجاه الثاني: بحوث العلاقات المتبادلة، وتشمل: دراسة الحالة، والدراسة السببية المقارنة، والدراسات الارتباطية.","الاتجاه الثالث: البحوث النمائية، التي تهتم بدراسة التغير والتطور، وتشمل النمط النمائي بنوعيه: الدراسات الطولية والمستعرضة، والنمط الاتجاهي.","حيلة للحفظ: مسح، علاقات، نمو. خمسة، ثلاثة، اثنان."]},

 {chap:"٢ · المنهج الوصفي", title:"خطوات المنهج الوصفي (نشاط ٥)", type:"grid", c:3, tight:true, numbered:1,
  items:[{t:"فهم المشكلة",d:"التعرف على الظاهرة وجمع معلومات أولية"},{t:"تحديد المشكلة وأسئلة البحث",d:"صياغتها بوضوح، ووضع فرضيات إذا تطلب ذلك"},{t:"توضيح الافتراضات",d:"الأفكار التي يستند إليها الباحث في صياغة فرضياته وإجراءاته"},{t:"اختيار المشاركين والمصادر",d:"الأشخاص والمراجع والوثائق اللازمة"},{t:"تحديد أدوات جمع البيانات",d:"استبانة أو مقابلة أو بطاقة ملاحظة"},{t:"تنظيم البيانات وتصنيفها",d:"فئات تساعد على معرفة التشابه والاختلاف والعلاقات"},{t:"التحقق من جودة الأدوات",d:"صدقها وثباتها، وتوحيد تعليمات تطبيقها"},{t:"جمع البيانات بدقة وموضوعية",d:"تسجيل المعلومات بطريقة منظمة دون تحيز"},{t:"تحليل النتائج وتفسيرها",d:"شرح معناها وربطها بأسئلة البحث"}],
  key:"تشبه خطوات الطريقة العلمية في التفكير: مشكلة ← فرضيات ← بيانات ← تحليل ← نتائج",
  say:["خطوات المنهج الوصفي تسع خطوات، وهي سؤال النشاط الخامس.","أولاً: فهم المشكلة، بالتعرف على الظاهرة وجمع معلومات أولية عنها.","ثانياً: تحديد المشكلة وأسئلة البحث، ووضع فرضيات إذا تطلب البحث ذلك.","ثالثاً: توضيح الافتراضات التي يستند إليها الباحث. رابعاً: اختيار المشاركين والمصادر.","خامساً: تحديد أدوات جمع البيانات. سادساً: تنظيم البيانات وتصنيفها.","سابعاً: التحقق من جودة الأدوات، من حيث صدقها وثباتها. ثامناً: جمع البيانات بدقة وموضوعية.","تاسعاً: تحليل النتائج وتفسيرها وربطها بأسئلة البحث.","ولاحظ أن هذه الخطوات هي نفسها تقريباً خطوات الطريقة العلمية في التفكير التي درستها في الوحدة الأولى: مشكلة، ثم فرضيات، ثم جمع بيانات، ثم تحليل، ثم نتائج."]},

 {chap:"٣ · أنواع البحوث الوصفية", title:"البحث المسحي", type:"grid", c:3,
  items:[{t:"ما هو؟",d:"يقوم على جمع البيانات من جميع أفراد مجتمع البحث أو من عينة كبيرة منهم؛ لوصف طبيعة الظاهرة وتحديد مستوى وجودها"},{t:"ما هدفه؟",d:"تحديد الوضع الراهن للظاهرة، والإجابة عن أسئلة الدراسة أو اختبار فروض وصفية محددة، دون إثبات الأسباب"},{t:"كيف يُنفَّذ؟",d:"تحديد المجتمع والعينة، إعداد أدوات مناسبة، جمع البيانات وتحليلها بصورة منظمة"}],
  extra:[{t:"متى نستخدمه؟",d:"لفهم المشكلات التي تواجه الأفراد، وجمع معلومات عن الممارسات الحالية لتقييمها أو تبريرها. مثال: تحديات المعلمين في الصفوف، مسح الباحثين عن عمل"},{t:"صعوباته",d:"الحاجة إلى بناء أدوات لم يسبق استخدامها (وقت ومهارة)، ونقص ردود أفراد العينة؛ وإذا كان معدل الردود منخفضاً لا يمكن الخروج بنتائج صادقة"}], extraLabel:"الاستخدام والصعوبات",
  key:"التركيز: وصف الواقع كما هو",
  say:["أول أنواع البحوث الوصفية: البحث المسحي.","وهو يقوم على جمع البيانات من جميع أفراد مجتمع البحث، أو من عينة كبيرة منهم، لوصف طبيعة الظاهرة وتحديد مستوى وجودها.","هدفه تحديد الوضع الراهن للظاهرة، دون إثبات الأسباب.","مثال: وزارة التربية والتعليم توزع استبانة على معلمي محافظة الظاهرة لمعرفة التحديات التي يواجهونها في الصفوف. هذا بحث مسحي.","ومن صعوباته: الحاجة إلى بناء أدوات جديدة، وهذا يتطلب وقتاً ومهارة. وأهم صعوبة: نقص ردود أفراد العينة، فإذا كان معدل الردود منخفضاً لا يمكن الخروج بنتائج صادقة."]},

 {chap:"٣ · أنواع البحوث الوصفية", title:"بحوث العلاقات المتبادلة (١): دراسة الحالة", type:"def",
  term:"دراسة الحالة",
  def:"تركز على دراسة فرد أو جماعة أو مؤسسة بصورة معمقة، باستخدام مصادر متعددة للمعلومات مثل المقابلة والملاحظة والاستبانة؛ للحصول على معلومات معمقة حول حالة محددة ولفهم العلاقات بين العوامل المختلفة.",
  parts:["<i>✓</i>تزودنا بمعلومات تفصيلية عن تفاعل العوامل، وتساعد على صياغة فرضيات مستقبلية","<i>✗</i>نتائجها محدودة من حيث إمكانية التعميم","<i>✗</i>تتطلب وقتاً وجهداً، واحتمال تأثر التفسير بذاتية الباحث"], partsLabel:"الأهمية والصعوبات",
  key:"مثال: دراسة العلامات المرتفعة لطلاب مدرسة معينة لفهم دور جودة التعليم ودافعية الطلبة ومتابعة الأهل",
  say:["الاتجاه الثاني: بحوث العلاقات المتبادلة، وهي تهتم بدراسة العلاقات بين المتغيرات للوصول إلى فهم أعمق للظاهرة. وأول أشكالها: دراسة الحالة.","دراسة الحالة تركز على دراسة فرد أو جماعة أو مؤسسة بصورة معمقة، باستخدام مصادر متعددة مثل المقابلة والملاحظة والاستبانة.","مثال: مدرسة في عبري طلابها يحققون نتائج عالية في الرياضيات كل سنة. الباحث يدرس هذه المدرسة بعمق ليفهم دور المعلمين ودافعية الطلبة ومتابعة الأهل.","ميزتها: معلومات تفصيلية عن تفاعل العوامل، وتساعد على صياغة فرضيات مستقبلية.","وعيوبها: نتائجها محدودة التعميم، فما ينطبق على هذه المدرسة قد لا ينطبق على غيرها، وتحتاج وقتاً وجهداً، وقد يتأثر التفسير بذاتية الباحث."]},

 {chap:"٣ · أنواع البحوث الوصفية", title:"بحوث العلاقات المتبادلة (٢): السببية المقارنة والارتباطية", type:"compare",
  cols:[{h:"الدراسة السببية المقارنة",c:"var(--amber)",pts:["تبحث في الفروق القائمة بين مجموعتين أو أكثر","للتعرف على الأسباب المحتملة لهذه الفروق","دون أن يتدخل الباحث تجريبياً في المتغيرات","مثال: مقارنة تحصيل طلاب المدارس الحكومية بطلاب المدارس الخاصة","مثال: أداء العاملين عن بعد مقارنة بالعمل التقليدي"],ex:"تنبيه: وجود فروق لا يثبت أن العامل محل المقارنة هو السبب المباشر؛ فقد توجد متغيرات أخرى"},
        {h:"البحوث الارتباطية",c:"var(--teal)",pts:["تحديد وجود العلاقة بين متغيرين كميين أو أكثر","وتقدير اتجاهها ودرجتها","مثال: العلاقة بين عدد ساعات الدراسة والتحصيل","الغرض ١: تحديد العلاقة (وجودها أو عدم وجودها)","الغرض ٢: التنبؤ (مثال: المعدل الأكاديمي واحتمال الحصول على وظيفة)"],ex:"القاعدة: الارتباط لا يعني السببية"}],
  say:["الشكل الثاني: الدراسة السببية المقارنة. تبحث في الفروق القائمة بين مجموعتين أو أكثر، للتعرف على الأسباب المحتملة لهذه الفروق، دون أن يتدخل الباحث تجريبياً.","مثال: مقارنة تحصيل طلاب المدارس الحكومية بطلاب المدارس الخاصة. الباحث لم يوزع الطلاب، بل وجدهم هكذا.","وتنبيه مهم: وجود فروق لا يثبت أن نوع المدرسة هو السبب المباشر، فقد يكون السبب دخل الأسرة مثلاً.","الشكل الثالث: البحوث الارتباطية، تهدف إلى تحديد وجود العلاقة بين متغيرين كميين أو أكثر، وتقدير اتجاهها ودرجتها، مثل العلاقة بين ساعات الدراسة والتحصيل.","ولها غرضان: تحديد العلاقة، والتنبؤ؛ فإذا ارتبط المعدل الأكاديمي بالتوظيف، يمكن التنبؤ باحتمال حصول الخريج على وظيفة.","والقاعدة الذهبية: الارتباط لا يعني السببية. مثال طريف: مبيعات الآيس كريم في صيف عُمان ترتفع مع ارتفاع استهلاك الكهرباء، لكن الآيس كريم لا يسبب استهلاك الكهرباء؛ السبب الحقيقي هو الحر."]},

 {chap:"٣ · أنواع البحوث الوصفية", title:"تحليل المحتوى وتحديد المتغيرات (نشاطا ٣ و٤)", type:"cases",
  items:[{q:"ما الصعوبات التي تواجه طريقة تحليل المحتوى؟",a:"صعوبات",w:"تحديد فئات التحليل ووحداته بدقة · ذاتية المحلل وتحيزه في التفسير · صعوبة تحقيق الثبات بين المحللين · يستغرق وقتاً وجهداً مع الوثائق الكثيرة · يصف ما في النص ولا يكشف دوافع كاتبه (إجابة اجتهادية؛ غير مفصّلة في الملزمة)",c:"var(--violet)"},
         {q:"علاقة التفكك الأسري بالضعف الدراسي لطلاب المرحلة الثانوية",a:"المتغيرات",w:"المستقل: التفكك الأسري · التابع: الضعف الدراسي",c:"var(--teal)"},
         {q:"دراسة علاقة الذكاء بالتحصيل الدراسي لدى طلبة الصف السابع",a:"المتغيرات",w:"المستقل: الذكاء · التابع: التحصيل الدراسي (والبحث ارتباطي)",c:"var(--amber)"}],
  say:["النشاط الثالث سأل عن صعوبات تحليل المحتوى. الملزمة لم تفصّلها، فهذه إجابة اجتهادية منطقية:","صعوبة تحديد فئات التحليل ووحداته بدقة، وذاتية المحلل وتحيزه، وصعوبة تحقيق الثبات بين أكثر من محلل، ويستغرق وقتاً وجهداً، ويصف ما في النص دون أن يكشف دوافع كاتبه.","مثلاً لو أردت تحليل كتاب الرياضيات للصف الثامن لمعرفة عدد المسائل الحياتية، فسأختلف أنا وزميلي في تحديد: هل هذه المسألة حياتية أم لا؟","النشاط الرابع: حدد المتغيرات. في عنوان: علاقة التفكك الأسري بالضعف الدراسي، المتغير المستقل هو التفكك الأسري، والتابع هو الضعف الدراسي.","وفي عنوان: علاقة الذكاء بالتحصيل الدراسي، المستقل هو الذكاء، والتابع هو التحصيل. وكلاهما بحث ارتباطي لأن العنوان يبدأ بكلمة علاقة."]},

 {chap:"٢ · المنهج الوصفي", title:"مميزات المنهج الوصفي وعيوبه (نشاط ٦)", type:"compare",
  cols:[{h:"المميزات",c:"var(--teal)",pts:["يدرس الظاهرة كما هي في الواقع دون تدخل","واسع الاستخدام في العلوم التربوية والإنسانية","يجمع بيانات كمية وكيفية ويحللها ويفسرها","يكشف العلاقات ويعقد المقارنات بين الظواهر","يمكن استخدامه في الظواهر الإنسانية والطبيعية","العينة كبيرة نسبياً وتسمح بالتعميم في حدود المجتمع"],ex:""},
        {h:"العيوب",c:"var(--coral)",pts:["لا يستطيع إثبات العلاقات السببية (الارتباط لا يعني السببية)","الحاجة إلى بناء أدوات لم يسبق استخدامها يتطلب وقتاً ومهارة","نقص ردود أفراد العينة يضعف صدق النتائج","دراسة الحالة محدودة التعميم ومتأثرة بذاتية الباحث","قد توجد متغيرات أخرى مسؤولة عن الفروق"],ex:""}],
  say:["النشاط السادس: مميزات وعيوب المنهج الوصفي، وهذه مستنتجة من الملزمة.","مميزاته: يدرس الظاهرة كما هي في الواقع، وهو واسع الاستخدام في العلوم التربوية، ويجمع بيانات كمية وكيفية ويحللها.","ويكشف العلاقات ويقارن بين الظواهر، ويصلح للظواهر الإنسانية والطبيعية، وعينته كبيرة تسمح بالتعميم.","وعيوبه: لا يستطيع إثبات السببية، وبناء الأدوات يحتاج وقتاً ومهارة، ونقص الردود يضعف النتائج.","وفي دراسة الحالة: محدودية التعميم والتأثر بذاتية الباحث. وفي السببية المقارنة: قد توجد متغيرات أخرى هي السبب الحقيقي."]},

 {chap:"٤ · البحث التجريبي", title:"البحوث التجريبية", type:"flow", numbered:true,
  intro:"يقوم البحث التجريبي على إحداث تغيير مقصود في متغير مستقل ودراسة أثره في متغير تابع، مع محاولة ضبط العوامل الأخرى.",
  steps:[{t:"التغيير المقصود",d:"تغيير متعمد ومضبوط بشروط واقعة معينة، ثم ملاحظة التغيرات الناتجة وتفسيرها"},{t:"ضبط العوامل الأخرى",d:"المؤثرة في المتغير التابع، مع تغيير المتغير المستقل لتحديد أثره وقياسه"},{t:"دراسة الأثر",d:"يتحكم الباحث في متغير مستقل بالزيادة أو النقصان لدراسة أثره في المتغير التابع"}],
  extra:[{t:"المجموعة التجريبية",d:"تتلقى المعالجة أو البرنامج التدريبي الذي يطبقه الباحث"},{t:"المجموعة الضابطة",d:"تستمر بالإجراءات المعتادة أو تتلقى معالجة مقارنة وفق تصميم الدراسة"},{t:"المعالجة (Treatment)",d:"برنامج أو إجراء محدد يطبقه الباحث لقياس أثره"}], extraLabel:"المصطلحات الأساسية",
  say:["ننتقل الآن إلى البحث التجريبي، وهو عكس الوصفي: الباحث هنا يتدخل.","يقوم البحث التجريبي على إحداث تغيير مقصود في متغير مستقل، ودراسة أثره في متغير تابع، مع محاولة ضبط العوامل الأخرى.","له ثلاثة أركان: التغيير المقصود، وضبط العوامل الأخرى، ودراسة الأثر.","وعادة تتضمن التجربة مجموعتين: المجموعة التجريبية، وهي التي تتلقى المعالجة أو البرنامج. والمجموعة الضابطة، وتستمر بالطريقة المعتادة للمقارنة.","والمعالجة هي البرنامج أو الإجراء الذي يطبقه الباحث لقياس أثره.","مثال من صفك: تدرّس الصف الثامن أ وحدة الكسور باستخدام الألعاب التعليمية، وهي المجموعة التجريبية. والصف الثامن ب بالطريقة المعتادة، وهي الضابطة. ثم تقارن نتائج الاختبار."]},

 {chap:"٤ · البحث التجريبي", title:"متغيرات الموقف التجريبي", type:"grid", c:3,
  items:[{t:"المتغير المستقل",d:"المتغير الذي يراد معرفة تأثيره على متغير آخر هو المتغير التابع، ويسمى أحياناً المتغير التجريبي"},{t:"المتغير التابع",d:"المتغير الذي يتغير بتغير المتغير المستقل، ويتم قياسه قبل وبعد التجربة لتقدير مقدار التغير الذي طرأ عليه"},{t:"المتغيرات الوسيطة (المتدخلة)",d:"بقية المتغيرات التي يمكن أن تؤثر في المتغير التابع بخلاف المستقل؛ يجب ضبطها أثناء التجربة أو عزل تأثيرها، وإذا لم يستطع فيمكن تحييدها بطرق إحصائية"}],
  ex:"مثال: أثر الألعاب التعليمية (مستقل) في تحصيل الكسور (تابع)، والمتدخلة: ذكاء الطلبة، المعلم، وقت الحصة، الدروس الخصوصية.",
  say:["في الموقف التجريبي ثلاثة أنواع من المتغيرات، وتعاريفها مهمة.","المتغير المستقل: المتغير الذي يراد معرفة تأثيره على متغير آخر، ويسمى أحياناً المتغير التجريبي. في مثالنا: الألعاب التعليمية.","المتغير التابع: المتغير الذي يتغير بتغير المتغير المستقل، ويتم قياسه قبل وبعد التجربة. في مثالنا: التحصيل في الكسور.","المتغيرات الوسيطة أو المتدخلة: بقية المتغيرات التي يمكن أن تؤثر في المتغير التابع بخلاف المستقل، مثل ذكاء الطلبة أو الدروس الخصوصية.","وهذه يجب ضبطها أثناء التجربة أو عزل تأثيرها، وإذا لم يستطع الباحث فيمكن تحييدها بطرق إحصائية.","حيلة: المستقل هو السبب الذي أغيّره، والتابع هو النتيجة التي أقيسها."]},

 {chap:"٤ · البحث التجريبي", title:"متى تُعد الدراسة تجريبية؟ وشبه التجريبية", type:"compare",
  cols:[{h:"تجريبية حقيقية",c:"var(--teal)",pts:["يطبق الباحث معالجة تجريبية","ويوزع المشاركين عشوائياً على المجموعات","مع ضبط العوامل المؤثرة"],ex:"التوزيع العشوائي يقلل تحيز الاختيار ويعزز الصدق الداخلي"},
        {h:"شبه تجريبية",c:"var(--amber)",pts:["يدرس الباحث أثر تدخل أو معالجة دون توزيع عشوائي للمشاركين","مع محاولة ضبط العوامل الأخرى","مثال: برنامج لتنمية الانتباه على فصل دراسي قائم، ومقارنته بفصل آخر لا يتلقى البرنامج","حدود التفسير: قد ترجع الفروق إلى عوامل أخرى، فلا تكفي المقارنة وحدها لإثبات السببية"],ex:"مثال مهم: مقارنة انتباه مدخنين وغير مدخنين دون تدخل في التدخين = دراسة سببية مقارنة وليست شبه تجريبية"}],
  extra:[{t:"التوزيع العشوائي",d:"توزيع المشاركين عشوائياً على المجموعات لتقليل تحيز الاختيار"},{t:"المطابقة (Matching)",d:"مضاهاة المشاركين في خصائص مهمة مثل العمر أو التحصيل السابق"},{t:"الضبط الإحصائي",d:"مراعاة الفروق الأولية بين المجموعات عند تحليل النتائج"}], extraLabel:"طرق تحقيق التكافؤ بين المجموعات",
  say:["متى تعد الدراسة تجريبية حقيقية؟ عندما يطبق الباحث معالجة تجريبية، ويوزع المشاركين عشوائياً على المجموعات.","وعندما يغيب التوزيع العشوائي، يكون التصميم غالباً شبه تجريبي. وهذا هو الحال في مدارسنا، لأنك لا تستطيع أن تعيد توزيع الطلاب على الصفوف، فتستخدم الفصول القائمة كما هي.","مثال شبه تجريبي: تطبيق برنامج لتنمية الانتباه على فصل قائم، ومقارنة نتائجه بفصل آخر لا يتلقى البرنامج.","انتبه للمثال الوارد: مقارنة انتباه مدخنين وغير مدخنين دون تدخل في التدخين، تعد دراسة سببية مقارنة، وليست شبه تجريبية، لأن الباحث لم يتدخل.","وطرق تحقيق التكافؤ بين المجموعات ثلاث: التوزيع العشوائي، والمطابقة، والضبط الإحصائي. والمطابقة والضبط الإحصائي يساعدان على التكافؤ، لكنهما لا يحلان محل التوزيع العشوائي."]},

 {chap:"٤ · البحث التجريبي", title:"خطوات البحث التجريبي", type:"flow", numbered:true,
  steps:[{t:"تحديد المشكلة",d:"التعرف على المشكلة وصياغتها بوضوح"},{t:"صياغة الفرضيات",d:"واستنباط ما يترتب عليها"},{t:"إعداد التصميم التجريبي",d:"عينة مناسبة · توزيع أو مطابقة · ضبط المتغيرات · أدوات صادقة · دراسة استطلاعية · المكان والموعد"},{t:"تنفيذ التجربة",d:"تطبيق الإجراءات وفق التصميم المحدد"},{t:"تحليل النتائج",d:"تنظيم البيانات واختيار الاختبار الإحصائي المناسب"}],
  say:["خطوات البحث التجريبي خمس.","أولاً: تحديد المشكلة وصياغتها بوضوح. ثانياً: صياغة الفرضيات واستنباط ما يترتب عليها.","ثالثاً: إعداد التصميم التجريبي، ويشمل ست نقاط: اختيار عينة مناسبة، وتوزيع المشاركين أو المطابقة بينهم، وتحديد المتغيرات الأخرى وضبطها، واختيار أدوات قياس صادقة، وإجراء دراسة استطلاعية لتحسين الأدوات، وتحديد مكان التجربة وموعدها.","رابعاً: تنفيذ التجربة وفق التصميم. خامساً: تحليل النتائج باستخدام الاختبار الإحصائي المناسب."]},

 {chap:"٤ · البحث التجريبي", title:"أنواع التصميمات التجريبية", type:"compare",
  cols:[{h:"أ. تصميم المجموعة الواحدة",c:"var(--teal)",pts:["اختيار مجموعة واحدة من المشاركين","قياس المتغير التابع قبل تطبيق المعالجة وبعدها","مقارنة القياسين لرصد التغير","قياس قبلي ← معالجة ← قياس بعدي"],ex:"تحذير: قد يتأثر التغير بعوامل أخرى، فلا يكفي الفرق وحده لإثبات أثر المعالجة"},
        {h:"ب. تصميم المجموعتين",c:"var(--amber)",pts:["مجموعة تجريبية ومجموعة ضابطة متقاربتان في الخصائص المهمة","التجريبية تتلقى المعالجة (تتعرض للمتغير المستقل)","الضابطة لا تتعرض للمتغير المستقل","قياس قبلي، ثم بعدي على المجموعتين، ثم تتبعي على التجريبية فقط"],ex:"التوزيع العشوائي يعزز التكافؤ ولا يضمن تطابقها التام"}],
  extra:[{t:"تصميم المجموعة الواحدة"},{t:"تصميم المجموعتين"},{t:"تصميمات أكثر من مجموعتين",d:"مجموعة ضابطة وعدة مجموعات تجريبية حسب متغيرات البحث"},{t:"تصميم تدوير المجموعات"}], extraLabel:"الخريطة الذهنية: أربعة تصميمات",
  say:["أنواع التصميمات التجريبية أربعة حسب الخريطة الذهنية: تصميم المجموعة الواحدة، وتصميم المجموعتين، وتصميمات أكثر من مجموعتين، وتصميم تدوير المجموعات.","تصميم المجموعة الواحدة: مجموعة واحدة، تقيس المتغير التابع قبل المعالجة، ثم تطبق المعالجة، ثم تقيس بعدها، وتقارن.","مثل أن تعطي طلاب الثامن اختباراً قبلياً، ثم تدرسهم بالألعاب، ثم اختباراً بعدياً. لكن التحسن قد يكون بسبب عوامل أخرى، مثل نضج الطلاب أو الدروس الخصوصية.","تصميم المجموعتين: تجريبية وضابطة متقاربتان. قياس قبلي للمجموعتين، ثم التجريبية فقط تتعرض للمتغير المستقل، ثم قياس بعدي للمجموعتين، ثم قياس تتبعي على التجريبية فقط.","وتصميمات أكثر من مجموعتين فيها مجموعة ضابطة وعدة مجموعات تجريبية حسب متغيرات البحث."]},

 {chap:"٤ · البحث التجريبي", title:"مميزات المنهج التجريبي وصعوباته", type:"compare",
  cols:[{h:"المميزات",c:"var(--teal)",pts:["إمكانية تكرار التجربة تحت شروط واحدة، مما يساعد في التحقق من ثبات النتائج وصدقها","ضبط المتغيرات ودراسة تأثيرها: تغيير المستقل بقصد وضبط المتغيرات الأخرى","دراسة العلاقات السببية بدقة أكبر مقارنة بالمنهج الوصفي أو التاريخي"],ex:"متطلبات التطبيق: جهد إضافي للتغلب على الصعوبات وتحقيق شروط المنهج"},
        {h:"الصعوبات",c:"var(--coral)",pts:["صعوبات إدارية وتنظيمية: قد تعوق استخدام بعض التصميمات وأساليب الضبط","محدودية التعميم: الحذر عند التعميم ما لم تكن العينة ممثلة","صعوبة ضبط المتغيرات: توزيع الطلبة على الفصول وتداخل العوامل التربوية والنفسية","واقعية ظروف التجربة: ينبغي أن تقترب من الواقع التعليمي المعتاد","جودة أدوات القياس: تتمتع بدرجة مقبولة من الدقة والصدق والثبات"],ex:""}],
  say:["مميزات المنهج التجريبي ثلاث: إمكانية تكرار التجربة تحت شروط واحدة، وضبط المتغيرات ودراسة تأثيرها، ودراسة العلاقات السببية بدقة أكبر من المنهج الوصفي. هذه أهم ميزة: التجريبي هو المنهج الذي يقترب من إثبات السببية.","وصعوباته خمس: صعوبات إدارية وتنظيمية، مثل أن إدارة المدرسة لا تسمح بتغيير الجدول.","ومحدودية التعميم، وصعوبة ضبط المتغيرات بسبب توزيع الطلبة على الفصول وتداخل العوامل.","وواقعية ظروف التجربة، يجب أن تقترب من الواقع التعليمي المعتاد، وجودة أدوات القياس."]},

 {chap:"مراجعة", title:"مصطلحات الجزء الثاني: اقرأ التعريف واذكر المصطلح", type:"terms",
  items:[{t:"البحث الاستكشافي",d:"يلجأ إليه الباحث عندما تكون المشكلة غير واضحة بصورة كافية أو المعلومات المتوافرة عنها محدودة"},{t:"المنهج الوصفي",d:"يدرس الظاهرة كما توجد في الواقع دون التدخل في تغييرها، ويصفها ويحللها ويفسرها"},{t:"البحث المسحي",d:"جمع البيانات من جميع أفراد المجتمع أو عينة كبيرة منهم لوصف طبيعة الظاهرة ومستوى وجودها"},{t:"دراسة الحالة",d:"دراسة فرد أو جماعة أو مؤسسة بصورة معمقة باستخدام مصادر متعددة"},{t:"الدراسة السببية المقارنة",d:"تبحث في الفروق القائمة بين مجموعتين أو أكثر للتعرف على أسبابها المحتملة دون تدخل تجريبي"},{t:"البحوث الارتباطية",d:"تحديد وجود العلاقة بين متغيرين كميين أو أكثر وتقدير اتجاهها ودرجتها"},{t:"البحث التجريبي",d:"إحداث تغيير مقصود في متغير مستقل ودراسة أثره في متغير تابع مع ضبط العوامل الأخرى"},{t:"البحث شبه التجريبي",d:"دراسة أثر تدخل أو معالجة دون توزيع عشوائي للمشاركين على المجموعات"},{t:"المتغير المستقل",d:"المتغير الذي يراد معرفة تأثيره على متغير آخر، ويسمى المتغير التجريبي"},{t:"المتغير التابع",d:"المتغير الذي يتغير بتغير المستقل، ويقاس قبل التجربة وبعدها"},{t:"المتغيرات الوسيطة (المتدخلة)",d:"بقية المتغيرات التي قد تؤثر في التابع بخلاف المستقل، ويجب ضبطها أو عزلها"},{t:"المجموعة الضابطة",d:"تستمر بالإجراءات المعتادة ولا تتعرض للمتغير المستقل، للمقارنة"}],
  say:["مراجعة مصطلحات الجزء الثاني. حاول أن تقول المصطلح قبل أن أقوله.","يلجأ إليه الباحث عندما تكون المشكلة غير واضحة والمعلومات محدودة: البحث الاستكشافي. يدرس الظاهرة كما توجد في الواقع دون التدخل: المنهج الوصفي.","جمع البيانات من جميع أفراد المجتمع أو عينة كبيرة لوصف الظاهرة: البحث المسحي. دراسة فرد أو جماعة أو مؤسسة بعمق: دراسة الحالة.","فروق قائمة بين مجموعات دون تدخل: السببية المقارنة. علاقة بين متغيرين كميين واتجاهها ودرجتها: البحوث الارتباطية.","تغيير مقصود في متغير مستقل ودراسة أثره: البحث التجريبي. دون توزيع عشوائي: شبه التجريبي.","المتغير الذي يراد معرفة تأثيره: المستقل. الذي يتغير بتغيره: التابع. بقية المتغيرات المؤثرة: الوسيطة أو المتدخلة."]},

 {chap:"مراجعة", title:"أرقام الجزء الثاني", type:"nums",
  items:[{n:"٣",t:"اتجاهات البحوث الوصفية: مسحية، علاقات متبادلة، نمائية"},{n:"٥",t:"أنواع البحوث المسحية"},{n:"٣",t:"أشكال بحوث العلاقات المتبادلة"},{n:"٩",t:"خطوات المنهج الوصفي"},{n:"٢",t:"غرضا البحث الارتباطي: العلاقة والتنبؤ"},{n:"٣",t:"أركان البحث التجريبي"},{n:"٣",t:"متغيرات الموقف التجريبي"},{n:"٣",t:"طرق تحقيق التكافؤ"},{n:"٥",t:"خطوات البحث التجريبي"},{n:"٤",t:"أنواع التصميمات التجريبية"},{n:"٣",t:"مميزات المنهج التجريبي"},{n:"٥",t:"صعوبات المنهج التجريبي"}],
  say:["أرقام الجزء الثاني: ثلاثة اتجاهات للبحوث الوصفية، وخمسة أنواع مسحية، وثلاثة أشكال للعلاقات المتبادلة.","تسع خطوات للمنهج الوصفي، وغرضان للبحث الارتباطي.","ثلاثة أركان للتجريبي، وثلاثة متغيرات، وثلاث طرق للتكافؤ، وخمس خطوات، وأربعة تصميمات، وثلاث مميزات، وخمس صعوبات.","انتهى الجزء الثاني. في الجزء الثالث: المجتمع والعينة وأنواعها، والصدق والثبات."]}
]},

{ name:"الجزء ٣ · المجتمع والعينة", week:"الأسبوع السادس", scenes:[
 {chap:"مقدمة", type:"title", h:"مجتمع البحث<br><em>والعينة وأنواعها</em>",
  chips:["مجتمع البحث والعينة","حجم العينة وجدول كريجسي ومورغان","العينات الاحتمالية","العينات غير الاحتمالية","أخطاء المعاينة والتحيز"],
  say:["أهلاً بك في الجزء الثالث والأخير من الوحدة الثانية.","سنتعرف على مجتمع البحث والعينة، وكيف نحدد حجم العينة، ثم أنواع العينات الاحتمالية وغير الاحتمالية، وأخيراً أخطاء المعاينة والتحيز.","وهذا الجزء فيه مسائل حسابية بسيطة، ركّز عليها لأنها سهلة الدرجات."]},

 {chap:"١ · المجتمع والعينة", title:"أسئلة يطرحها الباحث عند دراسة مجتمع", type:"grid", c:2, tight:true, numbered:1,
  items:[{t:"هل يمكن تطبيق الدراسة على مجتمع الدراسة بأكمله؟"},{t:"ما هي الصعوبات التي يمكن أن تواجهني إذا طبقت الدراسة؟"},{t:"هل يمكن التغلب على تلك الصعوبات؟"},{t:"إذا لم أتمكن من التطبيق على المجتمع، هل يمكن تطبيقها على عينة جزئية؟"},{t:"ما هي خصائص المجموعة الجزئية التي يجب أن أختارها؟"},{t:"كيف يمكن أن أختار أفراد تلك المجموعة؟"},{t:"ما العدد المناسب الذي يحقق هدفي من الدراسة؟"}],
  say:["عندما يدرس الباحث مجتمعاً ما، عليه أن يسأل نفسه سبعة أسئلة.","هل يمكن تطبيق الدراسة على المجتمع بأكمله؟ وما الصعوبات؟ وهل يمكن التغلب عليها؟","وإذا لم أتمكن، هل يمكن تطبيقها على عينة جزئية؟ وما خصائص هذه العينة؟","وكيف أختار أفرادها؟ وما العدد المناسب الذي يحقق هدفي؟","وهذه الأسئلة هي فعلياً خطوات اختيار العينة، وهي إجابة النشاط الأول: اشرح خطوات اختيار العينة بأسلوبك."]},

 {chap:"١ · المجتمع والعينة", title:"مجتمع البحث، مجتمع الدراسة، عينة البحث", type:"grid", c:3,
  items:[{t:"مجتمع البحث",d:"جميع مفردات المشكلة التي يدرسها الباحث، ويشمل جميع الفئات المستهدفة في البحث"},{t:"مجتمع الدراسة",d:"جميع عناصر ومفردات المشكلة أو الظاهرة قيد الدراسة. مثال: عند دراسة ضعف طلبة المرحلة الثانوية في الرياضيات، يشمل المجتمع جميع طلبة المرحلة الثانوية في الدولة"},{t:"عينة البحث",d:"مجموعة جزئية من المجتمع تمثله في السمات والخصائص المعرفية والنمائية والوجدانية والثقافية والاقتصادية"}],
  extra:[{t:"البحوث الوصفية والتجريبية",d:"المجتمع: الطلبة، المعلمون، مديرو المدارس، المشرفون"},{t:"البحوث التاريخية والتحليلية",d:"المجتمع: الوثائق، المخطوطات، التسجيلات"}], extraLabel:"يتحدد المجتمع حسب نوع البحث",
  key:"العينة جزء من المجتمع، وتمثّل المجتمع الأصلي وتحقق أغراض البحث",
  say:["ثلاثة مصطلحات مهمة للتعاريف.","مجتمع البحث: جميع مفردات المشكلة التي يدرسها الباحث، ويشمل جميع الفئات المستهدفة في البحث.","مجتمع الدراسة: جميع عناصر ومفردات المشكلة أو الظاهرة قيد الدراسة. مثلاً عند دراسة ضعف طلبة المرحلة الثانوية في الرياضيات، يكون المجتمع جميع طلبة المرحلة الثانوية في سلطنة عُمان.","عينة البحث: مجموعة جزئية من المجتمع، تمثله في السمات والخصائص المعرفية والنمائية والوجدانية والثقافية والاقتصادية.","والمجتمع يتحدد حسب نوع البحث: في البحوث الوصفية والتجريبية يكون أشخاصاً كالطلبة والمعلمين، وفي البحوث التاريخية يكون وثائق ومخطوطات."]},

 {chap:"١ · المجتمع والعينة", title:"أسباب اختيار العينة، وما يراعيه الباحث", type:"compare",
  cols:[{h:"أسباب اختيار العينة",c:"var(--teal)",pts:["الاقتصاد في التكلفة: توفير الوقت والجهد والمال","صعوبة تغطية مجتمع البحث في بعض الحالات","تحقيق أهداف البحث: العينة المختارة تحقق أهدافه"],ex:"خاصة عندما يكون المجتمع كبيراً أو موزعاً جغرافياً"},
        {h:"عند اختيار العينة يراعي الباحث",c:"var(--amber)",pts:["تمثيل المجتمع: أن تمثله تمثيلاً صادقاً من حيث الخصائص والحجم بما يسمح بتعميم النتائج","تجانس المجتمع: مراعاة مدى تجانس أفراده (طلاب السنة الأولى متجانسون؛ طلاب سنوات مختلفة غير متجانسين)","حجم المجتمع والعينة: إذا كان صغيراً يمكن دراسته كاملاً؛ وإذا كان كبيراً تُختار منه عينة"],ex:""}],
  say:["لماذا نختار عينة بدل دراسة المجتمع كاملاً؟ لثلاثة أسباب: الاقتصاد في التكلفة بتوفير الوقت والجهد والمال، وصعوبة تغطية المجتمع، وتحقيق أهداف البحث.","تخيل أنك تريد دراسة اتجاهات جميع طلبة سلطنة عُمان نحو الرياضيات؛ مستحيل أن تصل لكل طالب، فتختار عينة.","وعند اختيار العينة يراعي الباحث ثلاثة أمور: تمثيل المجتمع تمثيلاً صادقاً، وتجانس المجتمع، وحجم المجتمع والعينة.","فإذا كان المجتمع صغيراً، مثل معلمي الرياضيات في مدرستك وهم ستة، تدرسهم كلهم. وإذا كان كبيراً تختار عينة."]},

 {chap:"٢ · حجم العينة", title:"تحديد حجم العينة وجدول كريجسي ومورغان", type:"krejcie",
  items:[{t:"تجانس المجتمع وتباينه",d:"درجة تجانس وتباين وحدات مجتمع الدراسة"},{t:"طبيعة الدراسة",d:"طبيعة المشكلة أو الظاهرة المدروسة"},{t:"مستوى الثقة",d:"مدى الثقة التي يريد الباحث الالتزام بها"},{t:"الموارد المتاحة",d:"الوقت والجهد والكلفة اللازمة"}],
  pairs:[[10,10],[50,44],[100,80],[200,132],[300,169],[500,217],[1000,278],[1400,302],[2000,322],[2800,338],[5000,357],[10000,370],[100000,384]],
  say:["يختلف حجم العينة من باحث لآخر، ويتوقف على أربعة اعتبارات: تجانس المجتمع وتباينه، وطبيعة الدراسة، ومستوى الثقة، والموارد المتاحة من وقت وجهد وكلفة.","ولتقدير حجم العينة نستعين بجدول كريجسي ومورغان، وهو أداة إحصائية مرجعية نُشرت عام ألف وتسعمئة وسبعين.","يربط الجدول بين حجم المجتمع، ويرمز له بحرف N، وحجم العينة اللازم، ويرمز له بحرف S.","ويفترض مستوى دلالة صفر فاصلة صفر خمسة، وهامش خطأ خمسة بالمئة.","طريقة الاستخدام: تبحث عن حجم مجتمعك في الجدول، فتجد أمامه حجم العينة مباشرة، بدلاً من حساب المعادلات.","المثال في المحاضرة: مجتمع ألفان وثمانمئة فرد، يحتاج عينة ثلاثمئة وثمانية وثلاثين شخصاً.","ولاحظ أن العينة لا تزيد بنفس نسبة المجتمع؛ فحتى لو كان المجتمع مليوناً، تكفي عينة ثلاثمئة وأربعة وثمانين."]},

 {chap:"٣ · أنواع العينات", title:"العينات الاحتمالية وغير الاحتمالية", type:"compare",
  cols:[{h:"العينات الاحتمالية (العشوائية)",c:"var(--teal)",pts:["لكل فرد في المجتمع فرصة متساوية (معلومة) للدخول ضمن العينة","تتيح قدرة أكبر على تعميم نتائج الدراسة، وتحد من التحيز","تستخدم في البحوث الكمية عندما يكون حجم المجتمع كبيراً","أنواعها: البسيطة · المنتظمة · الطبقية · العنقودية"],ex:"العشوائية أساس اختيار العينة: تساوي احتمالات الاختيار، والاعتماد على الصدفة بدلاً من تحيز الباحث"},
        {h:"العينات غير الاحتمالية",c:"var(--coral)",pts:["يُستبعد بعض أفراد المجتمع من الاختيار بصورة متعمدة؛ لا تعطي كل فرد فرصة معلومة ومتساوية","يقتصر التعميم على العينة، مع احتمال وجود تحيز","تستخدم في البحوث النوعية عندما يكون المجتمع صغيراً ومعروفاً للباحث","أنواعها: المتيسرة (الملاءمة) · الحصصية · القصدية · كرة الثلج"],ex:"أساسها: التحديد"}],
  key:"خطأ العينة: قد يظهر اختلاف ضئيل بين خصائص العينة وخصائص المجتمع، وهو خطأ غير منتظم يرجع إلى المصادفة",
  say:["تنقسم العينات إلى نوعين كبيرين: احتمالية وغير احتمالية.","العينات الاحتمالية، أو العشوائية: لكل فرد في المجتمع فرصة متساوية للدخول ضمن العينة، وتتيح قدرة أكبر على تعميم النتائج، وتحد من تحيز الباحث. وتستخدم في البحوث الكمية.","وأنواعها أربعة: العشوائية البسيطة، والمنتظمة، والطبقية، والعنقودية.","العينات غير الاحتمالية: يُستبعد فيها بعض الأفراد بصورة متعمدة، فلا يأخذ كل فرد فرصة متساوية. ويقتصر التعميم على العينة، وتستخدم في البحوث النوعية والاستكشافية.","وأنواعها أربعة أيضاً: المتيسرة، والحصصية، والقصدية، وكرة الثلج.","حيلة: الاحتمالية أساسها العشوائية، وغير الاحتمالية أساسها التحديد."]},
