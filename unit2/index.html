  steps:[{t:"ترقيم جميع أفراد المجتمع",d:"شرط: معرفة جميع أفراد المجتمع الأصلي"},{t:"كتابة الأرقام على قصاصات",d:"متشابهة ووضعها في صندوق"},{t:"سحب عدد من القصاصات",d:"يساوي حجم العينة، ويُختار الفرد الذي يحمل الرقم المسحوب"}],
  extra:[{t:"شروط استخدامها",d:"معرفة جميع أفراد المجتمع الأصلي + وجود تجانس بين أفراد المجتمع"},{t:"طريقة أخرى",d:"مولّد الأرقام العشوائية (Random number generator)"},{t:"مثال",d:"مجتمع ٥٠٠ طالب ونريد ١٠٠: نعطي كل طالب رقماً ثم نختار ١٠٠ رقم عشوائياً"},{t:"عيبها",d:"يصعب تطبيقها عندما يكون المجتمع كبيراً جداً أو لا تتوافر قائمة كاملة بأفراده"}], extraLabel:"تفاصيل",
  say:["أول العينات الاحتمالية: العينة العشوائية البسيطة.","تعريفها: طريقة يتم فيها اختيار أفراد العينة بصورة عشوائية، بحيث تتاح لأفراد المجتمع فرص متكافئة للاختيار.","وشروط استخدامها: معرفة جميع أفراد المجتمع الأصلي، ووجود تجانس بينهم.","وأبسط طريقة لتطبيقها هي القرعة، بثلاث خطوات: ترقيم جميع أفراد المجتمع، ثم كتابة الأرقام على قصاصات ووضعها في صندوق، ثم سحب عدد من القصاصات يساوي حجم العينة.","وهذه إجابة النشاط الثالث: اشرح أحد أساليب اختيار العينات العشوائية، مثل طريقة الترقيم.","وهناك طريقة أسهل وهي مولّد الأرقام العشوائية في الحاسوب أو الآلة الحاسبة.","مثال المحاضرة: لدراسة عادات القلق الشائعة لدى طلبة كلية التربية والآداب في جامعة صحار، يجب أن تتاح لكل طالب في الكلية فرصة أن يصبح من أفراد العينة دون استثناء."]},

 {chap:"٣ · العينات الاحتمالية", title:"العينة المنتظمة (Systematic Sample)", type:"calc",
  def:"تقوم على اختيار أفراد المجتمع وفق فاصل منتظم بعد تحديد نقطة بداية عشوائية؛ تُستخدم عندما يكون ترتيب أفراد المجتمع عشوائياً.",
  formula:"طول الدورة = حجم المجتمع ÷ حجم العينة",
  work:["المجتمع = ٧٨٥ فرداً ، العينة = ١٠٠","طول الدورة = ٧٨٥ ÷ ١٠٠ ≈ ٨","نختار رقماً عشوائياً أقل من ٨ كنقطة بداية، مثل ٦","نضيف ٨ كل مرة: ٦ ← ١٤ ← ٢٢ ← ٣٠ ← … حتى يكتمل حجم العينة"],
  key:"تنبيه منهجي: نقطة البداية تحدد بقية العناصر فهي غير مستقلة؛ ولا يُنصح بها عند وجود ترتيب دوري في قائمة المجتمع يتوافق مع فاصل المعاينة",
  say:["العينة المنتظمة: تقوم على اختيار أفراد المجتمع وفق فاصل منتظم بعد تحديد نقطة بداية عشوائية.","خطواتها ثلاث: حساب طول الدورة، ثم تحديد نقطة البداية، ثم اختيار العناصر دورياً.","طول الدورة يساوي حجم المجتمع مقسوماً على حجم العينة.","مثال: مجتمع سبعمئة وخمسة وثمانون فرداً، والمطلوب مئة. طول الدورة يساوي سبعمئة وخمسة وثمانين على مئة، أي ثمانية تقريباً.","نختار رقماً عشوائياً أقل من ثمانية، مثل ستة، ثم نضيف ثمانية كل مرة: ستة، أربعة عشر، اثنان وعشرون، ثلاثون، وهكذا.","ميزتها سهولة التطبيق. وتنبيه: إذا كانت القائمة مرتبة بنمط دوري، مثلاً كل ثامن اسم في القائمة هو عريف الصف، فستكون العينة كلها عرفاء، وهذا تحيز."]},

 {chap:"٣ · العينات الاحتمالية", title:"العينة العشوائية الطبقية (Stratified)", type:"strata",
  def:"تستخدم عندما يتكون المجتمع من فئات أو طبقات تختلف فيما بينها في خصائص مرتبطة بالدراسة (الجنس، المستوى التعليمي، المنطقة الجغرافية)؛ يُقسم المجتمع إلى طبقات، ثم تُختار عينة عشوائية من كل طبقة.",
  formula:"حجم عينة الطبقة = (عدد أفراد الطبقة ÷ حجم المجتمع) × حجم العينة",
  rows:[["الأولى",500,50],["الثانية",400,40],["الثالثة",300,30],["الرابعة",200,20]], N:1400, n:140,
  act:{q:"نشاط ٢: مجتمع ١٠٠ فرد: ٦٠ ذكراً و٤٠ إناثاً، ونريد عينة ٢٥",l:["الذكور = (٦٠ ÷ ١٠٠) × ٢٥ = ١٥","الإناث = (٤٠ ÷ ١٠٠) × ٢٥ = ١٠","المجموع = ١٥ + ١٠ = ٢٥ ✓"]},
  say:["العينة العشوائية الطبقية: تستخدم عندما يتكون المجتمع من فئات أو طبقات تختلف فيما بينها، مثل الجنس أو المستوى التعليمي أو المنطقة الجغرافية.","يقسم الباحث المجتمع إلى طبقات، ثم يختار عينة عشوائية من كل طبقة.","وشروطها: معرفة جميع أفراد المجتمع، وتباين المجتمع، أي يتكون من طبقات متباينة.","والفرق عن العشوائية البسيطة: البسيطة تناسب المجتمع المتجانس، والطبقية تناسب المجتمع غير المتجانس.","المعادلة: حجم عينة الطبقة يساوي عدد أفراد الطبقة مقسوماً على حجم المجتمع، مضروباً في حجم العينة.","مثال المحاضرة: ألف وأربعمئة طالب في أربع سنوات، ونريد مئة وأربعين. السنة الأولى خمسمئة طالب، فنصيبها خمسمئة على ألف وأربعمئة، ضرب مئة وأربعين، يساوي خمسين. وبنفس الطريقة: أربعون، وثلاثون، وعشرون.","والنشاط الثاني: مئة فرد، ستون ذكراً وأربعون أنثى، والعينة خمسة وعشرون. الذكور: ستون على مئة ضرب خمسة وعشرين يساوي خمسة عشر. والإناث: أربعون على مئة ضرب خمسة وعشرين يساوي عشرة. والمجموع خمسة وعشرون.","وطريقة سريعة: نسبة العينة إلى المجتمع هنا الربع، فخذ ربع كل طبقة."]},

 {chap:"٣ · العينات الاحتمالية", title:"العينة العشوائية العنقودية (Cluster)", type:"calc",
  def:"لا تكون وحدة الاختيار الأساسية هي الفرد، وإنما مجموعة طبيعية من الأفراد (مدرسة، صف، شعبة دراسية) تُسمى عنقوداً؛ ويتم الاختيار عشوائياً للمجموعة وليس للفرد. تستخدم عندما يكون المجتمع كبيراً وممتداً جغرافياً.",
  formula:"العينة = عدد العناقيد المختارة × عدد الأفراد في كل عنقود",
  work:["المجتمع: ٢٠٠٠ طالب موزعين على ٥٠ شعبة × ٤٠ طالباً","اختيار ١٠ شعب عشوائياً","دراسة جميع الطلبة في الشعب المختارة","العينة = ١٠ × ٤٠ = ٤٠٠ طالب"],
  key:"تساعد على توفير الوقت والتكلفة، لكن خطأ المعاينة قد يكون أكبر إذا كانت العناقيد المختارة لا تمثل تنوع المجتمع بصورة جيدة",
  say:["العينة العنقودية: هنا وحدة الاختيار ليست الفرد، بل مجموعة طبيعية من الأفراد، مثل مدرسة أو صف أو شعبة، تسمى عنقوداً.","وتستخدم عندما يكون المجتمع كبيراً وممتداً جغرافياً، مما يجعل اختيار الأفراد مباشرة مكلفاً أو صعباً.","مثال: ألفا طالب في خمسين شعبة، في كل شعبة أربعون طالباً. نختار عشر شعب عشوائياً، وندرس جميع الطلبة فيها. فيصبح حجم العينة عشرة ضرب أربعين، أي أربعمئة طالب.","مثال عُماني: لو أردت دراسة طلاب الصف الثامن في محافظة الظاهرة، تختار عشوائياً بعض المدارس، وتدرس كل طلاب الثامن فيها.","ميزتها توفير الوقت والتكلفة، وعيبها أن خطأ المعاينة قد يكون أكبر إذا كانت العناقيد المختارة لا تمثل تنوع المجتمع، وقد يتم تجاهل بعض المجموعات."]},

 {chap:"٣ · العينات الاحتمالية", title:"خلاصة الفرق بين العينات الاحتمالية الأربع", type:"grid", c:2,
  items:[{t:"العشوائية البسيطة",d:"تختار الأفراد مباشرة بالقرعة أو مولّد الأرقام · المجتمع متجانس"},{t:"المنتظمة",d:"تختارهم وفق فاصل ثابت بعد بداية عشوائية · طول الدورة = المجتمع ÷ العينة"},{t:"الطبقية",d:"تقسم المجتمع إلى فئات ثم تأخذ عينة عشوائية من كل فئة · المجتمع غير متجانس"},{t:"العنقودية",d:"تختار مجموعات كاملة من المجتمع (شعب، مدارس) · المجتمع كبير وممتد جغرافياً"}],
  key:"يتحدد الأسلوب الأنسب وفق طبيعة المجتمع وأهداف الدراسة وإمكانات الباحث",
  say:["خلاصة الفرق بين العينات الاحتمالية الأربع، وهذه الجملة وردت في الملزمة بنصها:","العشوائية البسيطة تختار الأفراد مباشرة.","والمنتظمة تختارهم وفق فاصل ثابت بعد بداية عشوائية.","والطبقية تقسم المجتمع إلى فئات ثم تأخذ عينة عشوائية من كل فئة.","بينما العنقودية تختار مجموعات كاملة من المجتمع.","ويتحدد الأسلوب الأنسب وفق طبيعة المجتمع وأهداف الدراسة وإمكانات الباحث."]},

 {chap:"٤ · العينات غير الاحتمالية", title:"العينة المتيسرة (عينة الصدفة / سهلة المنال)", type:"def",
  term:"التعريف",
  def:"عينة يختار فيها الباحث المشاركين الذين يسهل الوصول إليهم والمتاحين وقت إجراء الدراسة، بدلاً من اختيارهم عشوائياً من جميع أفراد المجتمع.",
  parts:["<i>✓</i>سهلة وسريعة التنفيذ، ومنخفضة التكلفة","<i>✓</i>مناسبة للدراسات الاستطلاعية، وتُستخدم بكثرة في البحوث النفسية والتربوية","<i>✗</i>احتمال عدم تمثيلها للمجتمع الأصلي؛ فالمتاحون قد يختلفون عن بقية الأفراد","<i>✗</i>إمكانية تعميم النتائج محدودة، وينتج عنها خطأ في التمثيل"], partsLabel:"مزاياها وعيوبها",
  key:"مثال: طلبة موجودون في مكتبة الجامعة وقت جمع البيانات، أو الموجودون في سوق أو موقف السيارات",
  say:["ننتقل إلى العينات غير الاحتمالية، وأولها العينة المتيسرة، وتسمى عينة الصدفة، أو سهلة المنال، وهذا سؤال النشاط الرابع.","تعريفها: عينة يختار فيها الباحث المشاركين الذين يسهل الوصول إليهم والمتاحين وقت إجراء الدراسة، بدلاً من اختيارهم عشوائياً.","العامل الرئيسي في الاختيار هنا هو سهولة الوصول.","مثال: باحث يريد معرفة اتجاهات طلبة جامعة صحار نحو الذكاء الاصطناعي، فيذهب إلى المكتبة ويوزع الاستبانة على الموجودين فقط. هذه عينة متيسرة، لأنهم اختيروا لسهولة الوصول إليهم.","ميزاتها: سهلة وسريعة ومنخفضة التكلفة، ومناسبة للدراسات الاستطلاعية.","وعيبها الأهم: قد لا تمثل المجتمع؛ فالطلبة الموجودون في المكتبة قد يكونون الأكثر اجتهاداً، فلا يمثلون كل الطلبة."]},

 {chap:"٤ · العينات غير الاحتمالية", title:"العينة الحصصية (Quota)", type:"compare",
  intro:"تقوم على تقسيم مجتمع الدراسة إلى فئات وفق خصائص محددة، ثم تحديد عدد أو حصة مطلوبة من كل فئة، إلا أن اختيار الأشخاص داخل كل فئة لا يتم بالضرورة بطريقة عشوائية. الهدف: ضمان وجود الفئات المهمة في العينة.",
  cols:[{h:"الطبقية (احتمالية)",c:"var(--teal)",pts:["تقسم المجتمع إلى فئات","الاختيار داخل كل طبقة عشوائي","توفر أساساً أقوى للتعميم الإحصائي"],ex:""},
        {h:"الحصصية (غير احتمالية)",c:"var(--coral)",pts:["تقسم المجتمع إلى فئات","لا يشترط الاختيار العشوائي داخل الفئات","تدخل الباحث في اختيار الأفراد قد يؤدي إلى تحيز الاختيار"],ex:""}],
  key:"مثال: ١٠٠ موظف (٦٠٪ ذكور و٤٠٪ إناث) ← حصة ٦٠ ذكراً و٤٠ أنثى، ثم يختار الأشخاص المتاحين حتى يكتمل العدد",
  say:["العينة الحصصية: تقوم على تقسيم المجتمع إلى فئات وفق خصائص محددة، ثم تحديد عدد أو حصة مطلوبة من كل فئة، لكن اختيار الأشخاص داخل كل فئة لا يتم بالضرورة بطريقة عشوائية.","مثال: باحث يدرس اتجاهات مئة موظف، ستون بالمئة ذكور وأربعون إناث. يحدد حصته: ستون ذكراً وأربعون أنثى، ثم يختار الأشخاص المتاحين حتى يكتمل العدد.","وهنا سؤال الاختبار المتوقع: ما الفرق بين الحصصية والطبقية؟","كلتاهما تقسم المجتمع إلى فئات، لكن الفرق في طريقة اختيار الأفراد: في الطبقية يتم الاختيار عشوائياً داخل كل طبقة، بينما في الحصصية لا يشترط ذلك.","ولهذا الطبقية احتمالية وأقوى للتعميم، والحصصية غير احتمالية وقد يقع فيها تحيز الاختيار."]},

 {chap:"٤ · العينات غير الاحتمالية", title:"العينة القصدية (العمدية / Purposive)", type:"def",
  term:"التعريف",
  def:"لا يختار الباحث المشاركين بسبب سهولة الوصول إليهم، وإنما يختارهم عن قصد لأنهم يمتلكون معلومات أو خبرات أو خصائص مرتبطة مباشرة بموضوع الدراسة؛ ويعتمد الاختيار على معايير يحددها الباحث وفق مشكلة البحث وأهدافه.",
  parts:["<i>١</i>مثال: دراسة خبرات مديري المدارس في إدارة الأزمات التعليمية ← مديرون سبق لهم التعامل مع أزمات","<i>٢</i>مثال: دراسة أوضاع المدارس من ١٩٧٠ إلى ١٩٩٠ ← أشخاص عاشوا أو عملوا في المدارس خلال تلك الفترة","<i>٣</i>أساس الاختيار: دليل سابق على تمثيل العينة، مثل اختيار ولاية تُعد ممثلة لبقية الولايات"], partsLabel:"أمثلة وأساس الاختيار",
  key:"شروط ومخاطر: تتطلب معلومات سابقة كافية؛ اعتماد الاختيار على تقدير الباحث قد يؤدي إلى التحيز إذا لم تكن المعايير واضحة ومبررة",
  say:["العينة القصدية، وتسمى العمدية: لا يختار فيها الباحث المشاركين لسهولة الوصول إليهم، بل يختارهم عن قصد لأنهم يمتلكون معلومات أو خبرات مرتبطة مباشرة بموضوع الدراسة.","مثال: لدراسة خبرات مديري المدارس في إدارة الأزمات التعليمية، يختار الباحث عمداً مديرين سبق لهم التعامل مع أزمات، مثل أزمة كورونا أو إعصار شاهين في الباطنة.","والهدف ليس أكبر عدد من المشاركين، بل الوصول إلى الأشخاص الأكثر صلة بالظاهرة.","ومثال الملزمة: لدراسة أوضاع المدارس بين عامي ألف وتسعمئة وسبعين وألف وتسعمئة وتسعين، يختار الباحث أشخاصاً عاشوا أو عملوا في المدارس خلال تلك الفترة.","ومخاطرها: اعتمادها على تقدير الباحث قد يؤدي إلى التحيز إذا لم تكن معايير الاختيار واضحة ومبررة."]},

 {chap:"٤ · العينات غير الاحتمالية", title:"عينة كرة الثلج (العينة المتدحرجة)", type:"flow", numbered:true,
  intro:"تستخدم عندما يصعب على الباحث تحديد أفراد المجتمع أو الوصول إليهم مباشرة؛ وتعتمد على ترشيح المشاركين لأشخاص آخرين بالمواصفات نفسها، فتتوسع العينة تدريجياً كما يزداد حجم كرة الثلج.",
  steps:[{t:"اختيار المشاركين الأوائل",d:"أفراد يستوفون المواصفات المحددة (Seeds)"},{t:"طلب الترشيحات",d:"يُطلب منهم الإشارة إلى أشخاص آخرين بالمواصفات نفسها"},{t:"توسيع العينة",d:"التواصل مع المرشحين للحصول على معلومات وترشيحات إضافية"}],
  extra:[{t:"المميزات",d:"مناسبة للوصول إلى أفراد المجتمع · فعالة في الشبكات الاجتماعية خاصة عند وجود ثقة بين الأفراد · تحتاج إلى موارد أقل من الطرق الأخرى"},{t:"الملاحظات (القيود)",d:"قد لا تكون ممثلة للمجتمع (المشاركون متشابهون) · يصعب ضمان دقتها · أنسب للبحوث النوعية والاستكشافية · غير ملائمة للدراسات التي تتطلب تعميماً إحصائياً"},{t:"أمثلة",d:"المدمنون، والمشاركون في أنشطة رياضية مختلفة"}], extraLabel:"المميزات والملاحظات",
  say:["آخر العينات غير الاحتمالية: عينة كرة الثلج، وتسمى العينة المتدحرجة.","تستخدم عندما يصعب على الباحث تحديد أفراد المجتمع أو الوصول إليهم، وتعتمد على ترشيح المشاركين لأشخاص آخرين بالمواصفات نفسها.","وتتم في ثلاث مراحل: اختيار المشاركين الأوائل، ثم طلب الترشيحات منهم، ثم توسيع العينة.","مثال: باحث يريد دراسة معلمين عُمانيين يستخدمون الذكاء الاصطناعي في التحضير. لا توجد قائمة بهم، فيبدأ بمعلمَين يعرفهما، وكل واحد يقول: أعرف فلاناً في مدرسة ثانية يستخدمه، فتكبر العينة مثل كرة الثلج.","ميزاتها: مناسبة للوصول لفئات يصعب حصرها، وفعالة في الشبكات الاجتماعية، وتحتاج موارد أقل.","وقيودها: قد لا تمثل المجتمع، لأن الناس يرشحون من يشبهونهم، ولهذا هي أنسب للبحوث النوعية والاستكشافية."]},

 {chap:"٥ · أخطاء المعاينة", title:"خطأ المعاينة العشوائي وخطأ التحيّز", type:"compare",
  cols:[{h:"خطأ المعاينة العشوائي",c:"var(--teal)",pts:["ينشأ عندما لا تُدخل الصدفة بعض وحدات المجتمع ضمن العينة","الاختلاف أو التشتت (Variation): اختلاف قيم الوحدات التي تتكون منها العينة","يعتمد حجمه على: حجم العينة، مدى تشتت مفرداتها، طريقة اختيار الوحدات","يقل بزيادة حجم العينة","يُقدَّر بالخطأ المعياري (Standard Error)"],ex:"تقليله: زيادة حجم العينة + اختيار الطريقة المناسبة (الطبقية أو المنتظمة)"},
        {h:"خطأ التحيّز (Bias Error)",c:"var(--coral)",pts:["يتصف بأنه ثابت القيمة، ويصعب التقليل منه أو التخلص منه","لا يقل بزيادة حجم العينة","أنواعه: التحيز في الاختيار · التحيز في التقدير · التعريف الخاطئ لوحدة المعاينة","التحيز في الاختيار: اختيار غير عشوائي، الاعتماد على خاصية (مثل دليل الهاتف لدراسة الدخل)، تعمد إدخال وحدات، الاستبدال، عدم وصول الاستمارات"],ex:"يحتاج معالجته تحسين إجراءات الاختيار والقياس وجمع البيانات"}],
  key:"زيادة حجم العينة تقلل الخطأ العشوائي، لكنها لا تزيل التحيز المنهجي",
  say:["قد تتأثر نتائج البحث بنوعين من الأخطاء.","الأول: خطأ المعاينة العشوائي، وينشأ عندما لا تُدخل الصدفة بعض وحدات المجتمع ضمن العينة. ويعتمد حجمه على حجم العينة، ومدى تشتت مفرداتها، وطريقة الاختيار.","وهذا الخطأ يقل بزيادة حجم العينة، ويُقدّر بالخطأ المعياري.","الثاني: خطأ التحيز، ويتصف بأنه ثابت القيمة، ويصعب التقليل منه أو التخلص منه، والأهم: لا يقل بزيادة حجم العينة.","مثال: لو وزعت استبانة إلكترونية عن استخدام الإنترنت، فقط من لديهم إنترنت سيجيبون. حتى لو جاءتك عشرة آلاف إجابة، التحيز باقٍ.","وأنواع التحيز ثلاثة: التحيز في الاختيار، والتحيز في التقدير، والتعريف الخاطئ لوحدة المعاينة.","ومثال التحيز في التقدير: تقدير متوسط الأطوال اعتماداً على الأطوال التي يذكرها الأفراد في الاستبانات."]},

 {chap:"٥ · أخطاء المعاينة", title:"التقليل من أخطاء التحيّز الناتجة عن الاختيار", type:"grid", c:3, tight:true, numbered:1,
  items:[{t:"الاختيار العشوائي",d:"اختيار جميع وحدات العينة عشوائياً باستخدام إحدى طرق الاختيار العشوائي"},{t:"عدم الاستبدال",d:"عدم استبدال أي وحدة تم اختيارها بوحدة أخرى"},{t:"اكتمال الإجابات",d:"استكمال الإجابات عن جميع الأسئلة"},{t:"الدراسة الاستطلاعية",d:"إجراء بحث تجريبي (عينة استطلاعية) لكشف التحيز المقصود وغير المقصود"},{t:"تدريب الباحثين",d:"تدريب الباحثين جيداً على جمع البيانات والتقيد بالتعليمات"}],
  extra:[{t:"أخطاء أخرى شائعة في العينات",d:"عدم الاستجابة وعدم تحديث الإطار · التبويب ومعالجة البيانات · الطباعة · تفسير النتائج رغم صحة طرق التقدير والتحليل"}], extraLabel:"",
  say:["للتقليل من أخطاء التحيز الناتجة عن الاختيار، هناك خمسة إجراءات.","أولاً: الاختيار العشوائي لجميع وحدات العينة.","ثانياً: عدم الاستبدال، أي لا تستبدل وحدة اخترتها بوحدة أخرى لأنها أسهل في الوصول.","ثالثاً: اكتمال الإجابات عن جميع الأسئلة. رابعاً: الدراسة الاستطلاعية، أي تجربة الأداة على عينة صغيرة أولاً لكشف التحيز.","خامساً: تدريب الباحثين جيداً على جمع البيانات والتقيد بالتعليمات.","وهناك أخطاء أخرى شائعة: عدم الاستجابة، وأخطاء التبويب ومعالجة البيانات، والطباعة، وتفسير النتائج."]},

 {chap:"مراجعة", title:"مصطلحات الجزء الثالث: اقرأ التعريف واذكر المصطلح", type:"terms",
  items:[{t:"مجتمع البحث",d:"جميع مفردات المشكلة التي يدرسها الباحث، ويشمل جميع الفئات المستهدفة في البحث"},{t:"عينة البحث",d:"مجموعة جزئية من المجتمع تمثله في السمات والخصائص"},{t:"العينة العشوائية البسيطة",d:"اختيار أفراد العينة عشوائياً بحيث تتاح لأفراد المجتمع فرص متكافئة للاختيار"},{t:"العينة المنتظمة",d:"اختيار أفراد المجتمع وفق فاصل منتظم بعد تحديد نقطة بداية عشوائية"},{t:"العينة الطبقية",d:"تقسيم المجتمع إلى طبقات مختلفة في خصائصها، ثم اختيار عينة عشوائية من كل طبقة"},{t:"العينة العنقودية",d:"وحدة الاختيار مجموعة طبيعية من الأفراد (مدرسة، صف، شعبة) لا الفرد"},{t:"العينة المتيسرة",d:"اختيار المشاركين الذين يسهل الوصول إليهم والمتاحين وقت إجراء الدراسة"},{t:"العينة الحصصية",d:"تقسيم المجتمع إلى فئات وتحديد حصة من كل فئة دون اشتراط الاختيار العشوائي داخلها"},{t:"العينة القصدية",d:"اختيار المشاركين عن قصد لامتلاكهم معلومات أو خبرات مرتبطة مباشرة بموضوع الدراسة"},{t:"عينة كرة الثلج",d:"تعتمد على ترشيح المشاركين لأشخاص آخرين بالمواصفات نفسها فتتوسع تدريجياً"},{t:"خطأ التحيز",d:"خطأ ثابت القيمة يصعب التقليل منه، ولا يقل بزيادة حجم العينة"},{t:"خطأ المعاينة العشوائي",d:"ينشأ عندما لا تُدخل الصدفة بعض وحدات المجتمع ضمن العينة، ويقل بزيادة حجم العينة"}],
  say:["مراجعة مصطلحات الجزء الثالث.","جميع مفردات المشكلة التي يدرسها الباحث: مجتمع البحث. مجموعة جزئية من المجتمع تمثله: العينة.","فرص متكافئة للاختيار: العشوائية البسيطة. فاصل منتظم بعد بداية عشوائية: المنتظمة. طبقات ثم عينة عشوائية من كل طبقة: الطبقية. وحدة الاختيار مجموعة طبيعية: العنقودية.","سهولة الوصول: المتيسرة. حصة من كل فئة دون عشوائية: الحصصية. عن قصد لامتلاكهم خبرات: القصدية. ترشيح المشاركين لآخرين: كرة الثلج.","خطأ ثابت لا يقل بزيادة العينة: خطأ التحيز. ينشأ عندما لا تدخل الصدفة بعض الوحدات ويقل بزيادة العينة: خطأ المعاينة العشوائي."]},

<script>
const $=id=>document.getElementById(id);
const stage=$('stage'), cap=$('cap').firstElementChild;
const ar=["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
const toAr=n=>String(n).replace(/\d/g,d=>ar[d]);
const fmt=n=>toAr(n);
let P=0, S=PARTS[0].scenes, si=0, sj=0, playing=false, voiceOn=false, rate=1, timer=null, token=0, sentStart=0, sentDur=1, safety=null;
const rates=[1,1.25,1.5,0.85];
function estimate(s){return (s.length/13+1.1)*1000/rate}
const sceneDur=i=>S[i].say.reduce((a,s)=>a+estimate(s),0);
function total(){let t=0;for(let i=0;i<S.length;i++)t+=sceneDur(i);return t}

const pop=(k,h,cls='pop')=>`<div class="${cls}" style="--i:${k}">${h}</div>`;
function xrow(d,k){
  if(!d.extra) return ['',k];
  let h=(d.extraLabel?`<div class="lbl pop" style="--i:${k++}">${d.extraLabel}</div>`:'')+`<div class="xrow">${d.extra.map(x=>`<div class="xcell pop" style="--i:${k++}"><b>${x.t}</b>${x.d?`<span>${x.d}</span>`:''}</div>`).join('')}</div>`;
  return [h,k];
}
function target(type){
  const rings=[44,33,22,11].map((r,i)=>`<circle cx="50" cy="50" r="${r}" fill="${i%2?'var(--stage2)':'#1d3a50'}" stroke="var(--teal)" stroke-width="1"/>`).join('');
  const pts={vr:[[50,50],[47,48],[53,52],[49,54],[52,46],[46,53]],v:[[50,24],[76,50],[50,77],[24,50],[34,30],[68,70]],r:[[74,26],[78,24],[76,30],[71,29],[79,28],[74,22]]}[type];
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${rings}${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.4" fill="var(--amber)" stroke="#10161b" stroke-width=".8"/>`).join('')}</svg>`;
}

function render(i){
  const d=S[i]; let b='', k=0;
  stage.style.setProperty('--k',1);
  if(d.type==='title'){
    stage.innerHTML=`<div class="scene"><div class="hero">
      <span class="code pop" style="--i:0">EDUC4101 · ${PARTS[P].week}</span>
      <div class="chap pop" style="--i:0">الوحدة التعليمية الثانية · المنهجية في البحث العلمي والتربوي</div>
      <h2 class="pop" style="--i:1">${d.h}</h2>
      <div class="chips">${d.chips.map((c,x)=>`<span class="pop" style="--i:${x+2}">${c}</span>`).join('')}</div>
    </div></div>`; return;
  }
  if(d.intro) b+=`<div class="intro pop" style="--i:${k++}">${d.intro}</div>`;
  if(d.type==='compare'){
    b+=`<div class="cmp" style="--n:${d.n||2}">${d.cols.map(c=>`<div class="col pop" style="--i:${k++};--c:${c.c}"><h3>${c.h}</h3><ul>${c.pts.map(p=>`<li>${p}</li>`).join('')}</ul>${c.ex?`<div class="ex">${c.ex}</div>`:''}</div>`).join('')}</div>`;
  } else if(d.type==='grid'){
    const st=d.numbered||0;
    b+=`<div class="grid${d.tight?' tight':''}" style="--c:${d.c}">${d.items.map((it,x)=>`<div class="cell pop" style="--i:${k++}">${st?`<span class="num">${toAr(st+x)}</span>`:''}<div><b>${it.t}</b>${it.d?`<small>${it.d}</small>`:''}</div></div>`).join('')}</div>`;
  } else if(d.type==='flow'){
    const st=d.numbered===true?1:(d.numbered||0);
    b+=`<div class="flow">${d.steps.map((s,x)=>`${x?`<span class="arrow pop" style="--i:${k}">←</span>`:''}<div class="step pop" style="--i:${k++}">${st?`<span class="sn">${toAr(st+x)}</span>`:''}<b>${s.t}</b><small>${s.d}</small></div>`).join('')}</div>`;
  } else if(d.type==='def'){
    b+=`<div class="def pop" style="--i:${k++}"><div class="term">${d.term}</div><div class="t">${d.def}</div></div>
       <div class="lbl pop" style="--i:${k++}">${d.partsLabel}</div>
       <div class="pl">${d.parts.map(p=>`<span class="pop" style="--i:${k++}">${p}</span>`).join('')}</div>`;
  } else if(d.type==='cases'){
    b+=`<div class="cases" style="--n:${d.items.length}">${d.items.map(c=>`<div class="case pop" style="--i:${k++};--c:${c.c}"><div class="q">${c.q}</div><div class="a rev" style="--i:${k+2}">${c.a}</div><div class="w rev" style="--i:${k+2.5}">${c.w}</div></div>`).join('')}</div>`; k+=3;
  } else if(d.type==='table'){
    b+=`<div class="tblw pop" style="--i:${k++}"><table class="tbl"><thead><tr>${d.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${d.rows.map((r,x)=>`<tr class="pop" style="--i:${k++}">${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  } else if(d.type==='terms'){
    const c=d.items.length>12?3:2;
    b+=`<div class="terms" style="--c:${c}">${d.items.map((t,x)=>`<div class="term-i pop" style="--i:${x*.25}"><span class="d">${t.d}</span><span class="tt rev" style="--i:${4+x*1.1}">${t.t}</span></div>`).join('')}</div>`;
  } else if(d.type==='nums'){
    const c=d.items.length>9?4:3;
    b+=`<div class="nums" style="--c:${c}">${d.items.map(it=>`<div class="nb pop" style="--i:${(k++)*.5}"><span class="big">${it.n}</span><span>${it.t}</span></div>`).join('')}</div>`;
  } else if(d.type==='krejcie'){
    b+=`<div class="calc"><div style="display:grid;gap:calc(var(--u)*.8)">
      <div class="lbl pop" style="--i:${k++}">يتوقف حجم العينة على أربعة اعتبارات</div>
      <div class="grid tight" style="--c:2">${d.items.map(it=>`<div class="cell pop" style="--i:${k++}"><div><b>${it.t}</b><small>${it.d}</small></div></div>`).join('')}</div>
      <div class="intro pop" style="--i:${k++}">جدول <b>كريجسي ومورغان (Krejcie &amp; Morgan, 1970)</b>: يربط بين حجم المجتمع <b>(N)</b> وحجم العينة اللازم <b>(S)</b>؛ بمستوى دلالة ٠٫٠٥ وهامش خطأ ٥٪. تبحث عن حجم مجتمعك فتجد العينة أمامه مباشرة بدلاً من حساب المعادلات.</div>
      </div><div class="pop" style="--i:${k++}"><table class="mini"><thead><tr><th>حجم المجتمع N</th><th>حجم العينة S</th></tr></thead><tbody>${d.pairs.map(([n,s])=>`<tr class="${n===2800?'hl':''}"><td>${fmt(n)}</td><td>${fmt(s)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="key pop" style="--i:${k++}">مثال المحاضرة: مجتمع ٢٨٠٠ فرد ← عينة ٣٣٨ شخصاً</div>`;
  } else if(d.type==='calc'){
    b+=`<div class="def pop" style="--i:${k++}"><div class="t" style="font-size:calc(var(--u)*1.5)">${d.def}</div></div>
      <div class="calc"><div class="formula pop" style="--i:${k++}">${d.formula}</div>
      <div class="work">${d.work.map((w,x,a)=>`<div class="pop ${x===a.length-1?'res':''}" style="--i:${k++}">${w}</div>`).join('')}</div></div>`;
  } else if(d.type==='strata'){
    b+=`<div class="def pop" style="--i:${k++}"><div class="t" style="font-size:calc(var(--u)*1.38)">${d.def}</div></div>
      <div class="formula pop" style="--i:${k++}">${d.formula}</div>
      <div class="calc"><div class="pop" style="--i:${k++}"><table class="mini"><thead><tr><th>السنة الدراسية</th><th>عدد الطلبة في المجتمع</th><th>الحساب</th><th>في العينة</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${r[0]}</td><td>${fmt(r[1])}</td><td>(${fmt(r[1])} ÷ ${fmt(d.N)}) × ${fmt(d.n)}</td><td>${fmt(r[2])}</td></tr>`).join('')}<tr class="tot"><td>المجموع</td><td>${fmt(d.N)}</td><td></td><td>${fmt(d.n)}</td></tr></tbody></table></div>
      <div class="act pop" style="--i:${k++}"><b>${d.act.q}</b>${d.act.l.map(l=>`<span>${l}</span>`).join('')}</div></div>`;
  } else if(d.type==='targets'){
    b+=`<div class="tg">${[['vr','صادق وثابت','Valid and reliable'],['v','صادق وغير ثابت','Valid but not reliable'],['r','ثابت وغير صادق','Reliable but not valid']].map(([t,a,e])=>`<figure class="pop" style="--i:${k++}">${target(t)}<figcaption>${a}<small>${e}</small></figcaption></figure>`).join('')}</div>`;
  }
  if(d.ex) b+=`<div class="exbox pop" style="--i:${k++}">${d.ex}</div>`;
  const [xh,k2]=xrow(d,k); b+=xh; k=k2;
  if(d.key) b+=`<div class="key pop" style="--i:${k+.5}">${d.key}</div>`;
  stage.innerHTML=`<div class="scene"><div class="head"><div class="chap">${d.chap}</div><h2 class="ttl">${d.title}</h2></div><div class="body">${b}</div></div>`;
  fit();
}
function fit(){
  const sc=stage.querySelector('.scene'); if(!sc) return;
  if(getComputedStyle(sc).position!=='absolute') return;
  let k=1.5; stage.style.setProperty('--k',k);
  const bd=sc.querySelector('.body')||sc.querySelector('.hero');
  const over=()=>{const cs=getComputedStyle(bd);const g=parseFloat(cs.rowGap)||0;const kids=[...bd.children];
    const h=kids.reduce((a,c)=>a+c.getBoundingClientRect().height,0)+g*Math.max(0,kids.length-1);
    return h>bd.clientHeight-2||sc.scrollWidth>sc.clientWidth+1};
  while(over()&&k>0.6){k-=0.025;stage.style.setProperty('--k',k.toFixed(2))}
}
window.addEventListener('resize',()=>fit());

function buildParts(){
  $('parts').innerHTML=PARTS.map((p,i)=>`<button data-p="${i}" aria-pressed="${i===P}">${p.name}<small>${p.week} · ${toAr(p.scenes.length)} مشهداً</small></button>`).join('');
  $('parts').onclick=e=>{const b=e.target.closest('button');if(b)setPart(+b.dataset.p)};
}
function buildIdx(){
  const idx=$('idx'); let last='', h='';
  S.forEach((d,i)=>{ if(d.chap!==last){h+=`<h4>${d.chap}</h4>`;last=d.chap}
    h+=`<button data-i="${i}">${d.title||'البداية'}</button>`});
  idx.innerHTML=h;
  idx.onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
}
function setPart(p){
  stopTimers(); playing=false; P=p; S=PARTS[p].scenes; si=0; sj=0;
  document.querySelectorAll('#parts button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.p===p));
  try{history.replaceState(null,'','#p'+(p+1))}catch(e){}
  buildIdx(); render(0); ui();
}
function ui(){
  $('count').textContent=`المشهد ${toAr(si+1)} من ${toAr(S.length)}`;
  $('play').textContent=playing?'❚❚ إيقاف':'▶ تشغيل';
  document.querySelectorAll('#idx button').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===si));
  cap.textContent=S[si].say[sj]||'';
}
function stopTimers(){clearTimeout(timer);clearTimeout(safety);token++;try{speechSynthesis.cancel()}catch(e){}}
function go(i,keepPlay=true){
  stopTimers(); si=Math.max(0,Math.min(S.length-1,i)); sj=0;
  render(si); ui(); if(playing&&keepPlay) runSentence(); else progress();
}
function runSentence(){
  const my=++token; const s=S[si].say[sj]; cap.textContent=s;
  sentStart=performance.now(); sentDur=estimate(s);
  if(voiceOn && arVoice()){
    const u=new SpeechSynthesisUtterance(s); u.lang='ar-SA'; u.voice=arVoice(); u.rate=rate;
    u.onend=()=>{if(my===token&&playing)advance()};
    u.onerror=()=>{if(my===token&&playing){timer=setTimeout(()=>my===token&&advance(),600)}};
    speechSynthesis.speak(u);
    safety=setTimeout(()=>{if(my===token&&playing){speechSynthesis.cancel();advance()}},sentDur*2.6+4000);
  } else timer=setTimeout(()=>{if(my===token&&playing)advance()},sentDur);
}
function advance(){
  clearTimeout(safety); sj++;
  if(sj<S[si].say.length){ui();runSentence();return}
  if(si<S.length-1){go(si+1)} else {playing=false;stopTimers();sj=S[si].say.length-1;ui()}
}
function progress(){
  const T=total(); let acc=0; for(let i=0;i<si;i++)acc+=sceneDur(i);
  for(let j=0;j<sj;j++)acc+=estimate(S[si].say[j]);
  if(playing) acc+=Math.min(sentDur,performance.now()-sentStart);
  $('fill').style.width=Math.min(100,acc/T*100)+'%';
}
(function loop(){progress();requestAnimationFrame(loop)})();
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}catch(e){voices=[]}}
function arVoice(){return voices.find(v=>/SA|OM|AE/i.test(v.lang))||voices[0]||null}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
$('play').onclick=()=>{
  if(playing){playing=false;stopTimers();ui()}
  else{ if(si===S.length-1&&sj>=S[si].say.length-1){si=0;sj=0;render(0)} playing=true;ui();runSentence()}
};
$('next').onclick=()=>go(si+1);
$('prev').onclick=()=>go(si-1);
$('voice').onclick=()=>{
  if(!('speechSynthesis' in window)){$('vnote').textContent='متصفحك لا يدعم القراءة الصوتية، تابع الترجمة المكتوبة.';return}
  loadVoices();
  if(!voiceOn && !arVoice()){$('vnote').textContent='لا يوجد صوت عربي في هذا المتصفح. جرّب Chrome أو Edge، أو تابع الترجمة المكتوبة.';return}
  voiceOn=!voiceOn; $('voice').textContent=voiceOn?'🔊 الصوت: مفتوح':'🔈 الصوت: مغلق'; $('voice').classList.toggle('on',voiceOn);
  if(playing){stopTimers();runSentence()}
};
$('speed').onclick=()=>{rate=rates[(rates.indexOf(rate)+1)%rates.length];$('speed').textContent=`السرعة ${rate}×`;if(playing){stopTimers();runSentence()}};
$('bar').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect(); const f=(r.right-e.clientX)/r.width; const T=total()*f;
  let acc=0; for(let i=0;i<S.length;i++){acc+=sceneDur(i); if(acc>=T){go(i);return}}
};
document.addEventListener('keydown',e=>{
  if(e.target.closest('button')&&e.key===' ')return;
  if(e.key===' '){e.preventDefault();$('play').click()}
  else if(e.key==='ArrowLeft')go(si+1);
  else if(e.key==='ArrowRight')go(si-1);
});
const m=/^#p([123])$/.exec(location.hash);
buildParts(); setPart(m?+m[1]-1:0);
</script>
</body></html>
