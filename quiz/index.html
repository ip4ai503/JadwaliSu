<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بنك أسئلة الوحدة الأولى</title>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#1c2a2e; --muted:#5d6f73; --line:#dde4e2;
  --accent:#1f6f78; --accent-soft:#e3f0f0; --ok:#1f8a4c; --ok-soft:#e5f5eb; --bad:#c2452d; --bad-soft:#fbeae6; --gold:#b7791f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --card:#172226; --ink:#e7eeee; --muted:#9bb0b3; --line:#27363a;
  --accent:#5cc2c9; --accent-soft:#1b3337; --ok:#5fcf8c; --ok-soft:#173226; --bad:#f08a72; --bad-soft:#3a211b; --gold:#e8b45a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1719; --card:#172226; --ink:#e7eeee; --muted:#9bb0b3; --line:#27363a;
  --accent:#5cc2c9; --accent-soft:#1b3337; --ok:#5fcf8c; --ok-soft:#173226; --bad:#f08a72; --bad-soft:#3a211b; --gold:#e8b45a; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;direction:rtl;padding-inline:16px;padding-block:20px 60px;line-height:1.7}
.wrap{max-width:820px;margin-inline:auto;display:grid;gap:16px}
h1{font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.stats{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.stats .ok{color:var(--ok)} .stats .bad{color:var(--bad)}
.tools{display:flex;gap:6px;margin-inline-start:auto}
.tools button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--bad);color:var(--bad)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.q .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.q .num{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.q .tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.q p.prompt{margin:0;font-size:16.5px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:start;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:15px;line-height:1.6}
.opt .l{flex:none;font-weight:700;color:var(--muted);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.correct .l{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .l{color:var(--bad)}
.exp{border-inline-start:3px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:8px 12px;font-size:14.5px}
.exp b{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:30px}
.note{font-size:13px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <h1>بنك أسئلة الوحدة الأولى: مناهج البحث</h1>

  </header>
  <div class="bar">
    <div class="tabs" id="tabs" role="toolbar" aria-label="الأقسام"></div>
    <div class="stats" id="stats"></div>
  </div>
  <main id="list" class="wrap" style="gap:12px"></main>
  <p class="note">يُحفظ تقدمك في هذا المتصفح فقط، وزر «إعادة» يمسح إجاباتك في القسم الحالي.</p>
</div>

["n","يستخدم البحث التربوي «أخلاقيات البحث» أداةً تدريبية لـ:",["إعداد الأعمال الكتابية مثل البحوث وأوراق العمل بنزاهة علمية","إقناع المجتمع بزيادة الميزانية","ضمان التزام المعلمين بساعات العمل","تقليل عدد الباحثين"],0,"التدريب على أخلاقيات البحث التربوي في أثناء إعداد الأعمال الكتابية من مثل البحوث وأوراق العمل."],
["n","تتميز الظواهر الطبيعية بأنها «واحدة وثابتة»، ومثال ذلك:",["القوانين الاقتصادية تطبق بالدقة نفسها على كل المجتمعات","كل النظريات تظل صحيحة للأبد","الحديد له نفس الخصائص الفيزيائية سواء كان في مصر أو أمريكا","الطلاب في كل الدول يفضلون العلوم"],2,"الشريحة: «فالحديد مثلاً هو نفسه في مصر وأمريكا وجنوب أفريقيا»."],
["n","ما المقصود بأن العلم «قياس كمي وكيفي دقيق»؟",["استخدام أدوات قديمة","التركيز على كمية المعلومات دون جودتها","استخدام لغة الأرقام (كمي) والأوصاف الدقيقة (كيفي) للوصول للنتائج","الاهتمام بما يوزن أو يقاس بالمتر فقط"],2,"الكمي: الأرقام والمؤشرات والتحليل الإحصائي. الكيفي: فهم المعاني والخبرات والسياقات."],
["n","عندما يستخدم الباحث استبياناً أو مقابلة لجمع البيانات، فإنه غالباً يعمل في مجال:",["الرياضيات والمنطق","العلوم الطبيعية البحتة","العلوم الاجتماعية والتربوية","الفلك"],2,"العلوم الاجتماعية تستعين بالاستبانات والمقابلات والاختبارات والملاحظة وتحليل الوثائق."],
["n","تُعد خاصية «التحمل والصبر» ضرورية للباحث الجيد لأنه:",["العلم لا يتطور إلا بموت الأجيال القديمة","يجب أن ينتظر سنوات قبل النشر","سيواجه مشاق في البحث المستمر والاستقصاء عن مصادر المعلومات","يحتاج للصبر على زملائه"],2,"الشريحة: «الباحث يتميز بتحمل المشاق في البحث المستمر والاستقصاء عن مصادر المعلومات المناسبة». صفات الباحث مرتبطة بطبيعة البحث نفسه."],

// ===== العلم والمعرفة =====
["s","أي مما يلي ليس من أسباب دراسة مقرر مناهج البحث والمعالجة الإحصائية؟",["أساس لا غنى عنه لمشروع التخرج","تفكير نقدي لتمييز البحث الموثوق من المضلِّل","بوابة للدراسات العليا","يغنيك عن التخصص في مجالك"],3,"الأسباب الخمسة: مشروع التخرج، التفكير النقدي تجاه ما تقرأ، مهارة مطلوبة في سوق العمل، بوابة للدراسات العليا، حل مشكلات حقيقية في تخصصك."],
["s","أظهرت دراسة أن الطلبة الذين يشربون القهوة أثناء المذاكرة حصلوا على درجات أعلى. ما الاستنتاج العلمي الصحيح؟",["القهوة ترفع التحصيل لأن الفرق واضح","يمكن الجزم بالسببية إذا كانت العينة كبيرة","وجود علاقة لا يعني أن القهوة هي السبب، فقد تتدخل متغيرات أخرى مثل الاجتهاد","لا يمكن دراسة الموضوع تربوياً"],2,"العلاقة لا تعني السببية. قد يكون المجتهدون هم من يسهرون ويشربون القهوة."],
["s","يشبه الفرق بين العلم والمعرفة الفرق بين:",["الشجرة والثمرة","الغابة وشجرة بعينها","البحر والنهر","الكتاب والمكتبة"],1,"ملف الوحدة: «الفرق بينهما جوهري ويشبه الفرق بين الغابة وشجرة بعينها». المعرفة = الغابة (أوسع)، والعلم = شجرة منظمة داخلها."],
["s","«معرفة أن الأرض تدور حول الشمس» و«معرفة تقاليد مجتمع معين» هما على الترتيب:",["ثقافية، علمية","علمية، ثقافية","كلاهما علمية","كلاهما ليس معرفة"],1,"الأولى معرفة علمية، والثانية معرفة ثقافية لا تعتمد بالضرورة على المنهج العلمي."],
["s","ما الفارق الأساسي بين العلم والمعرفة؟",["المعرفة بالحواس فقط والعلم بالعقل فقط","العلم يشترط التنظيم والمنهجية والاستناد إلى أدلة قابلة للتحقق","العلم أوسع من المعرفة","لا فرق"],1,"كل علم معرفة، وليس كل معرفة علماً. الفارق: التنظيم والمنهجية والأدلة القابلة للتحقق."],
["s","المعرفة قد تكون «ذاتية». ماذا يعني ذلك؟",["تستند إلى أدلة يمكن التحقق منها","تتأثر بخبرات الفرد وآرائه ومشاعره وبيئته الثقافية","ناتجة عن تجارب مخبرية","لا يمتلكها إلا العلماء"],1,"الموضوعية تستند إلى أدلة يمكن التحقق منها، والذاتية تتأثر بخبرات الفرد ومشاعره."],
["s","أي مما يلي ليس من مصادر المعرفة المذكورة في الوحدة؟",["الحواس والعقل","التجربة والتعليم المنظم","الثقافة والدين","الصدفة والحظ"],3,"المصادر الستة: الحواس، العقل، التجربة، التعليم المنظم، الثقافة، الدين."],
["s","أي مصادر المعرفة «يساعد على تفسير المعلومات وربطها والاستدلال منها»؟",["الحواس","العقل","التجربة","الثقافة"],1,"الحواس: ملاحظة العالم. العقل: التفسير والربط والاستدلال. التجربة: كشف نتائج الأفعال."],
["s","ما الترتيب الصحيح لنشأة العلم؟",["فرضيات ← ملاحظة ← أسئلة ← تجارب ← نشر","ملاحظة ← أسئلة ← فرضيات ← تجارب وبيانات ← تحليل ← نشر","نشر ← ملاحظة ← تجارب ← فرضيات","أسئلة ← نشر ← ملاحظة ← تحليل"],1,"يبدأ بالملاحظة ورصد الظواهر، ثم الأسئلة، ثم الفرضيات، ثم التجارب، ثم التحليل، ثم النشر للمراجعة والنقد."],
["s","لماذا يُعد العلم «عملية مستمرة ومتجددة»؟",["لأن العلماء لا يتفقون","لأن تكرار المراحل وتراكم الأدلة قد يغيّر التفسيرات السابقة عند ظهور أدلة جديدة","لأن كل عالم يبدأ من الصفر","لأن النتائج غير موثوقة"],1,"العلم ليس مجموعة ثابتة ونهائية من المعلومات."],
["s","يُعرّف العلم بأنه «مجموعة المعارف المدعومة بالأدلة، وجملة القوانين المكتشفة لـ…»",["إقناع الناس","تفسير حوادث الطبيعة","حفظ التراث","تطوير الأجهزة"],1,"تعريف جيدير (٢٠١٥)."],
["s","أهداف العلم الثلاثة بالترتيب الصحيح:",["التوقع ← التفسير ← الضبط","الضبط ← التوقع ← التفسير","الاكتشاف والتفسير ← التوقع ← الضبط والتحكم","التفسير ← الضبط ← التوقع"],2,"مراحل متدرجة: فهم الظاهرة، ثم توقع حدوثها، ثم توجيهها والتأثير فيها."],
["s","باحث يلاحظ انخفاض تحصيل الطلبة فيدرس العوامل المرتبطة به (أساليب التدريس، الدافعية، البيئة الأسرية). أي هدف يحققه؟",["الضبط والتحكم","التوقع","الاكتشاف والتفسير","التعميم"],2,"لا يكتفي العلم بوصف انخفاض التحصيل، بل يفسّر العوامل التي أدت إليه."],
["s","لماذا يُعد التفسير أساساً ضرورياً للهدفين الآخرين؟",["لأنه أسهل","لأن التوقع والتحكم لا يكونان دقيقين دون فهم الظاهرة أولاً","لأنه آخر مرحلة","لأنه يغني عن البيانات"],1,"نفسّر ← نتوقع ← نتحكم."],
["s","«التوقع العلمي بكيفية عمل وتطور وسير الأحداث والظواهر الطبيعية وغير الطبيعية المنظمة بالقوانين العلمية». هذا تعريف:",["الاكتشاف والتفسير","التوقع","الضبط والتحكم","التجريب"],1,"تعريف هدف التوقع كما في شريحة «أهداف العلم»."],
["s","على ماذا يعتمد التوقع العلمي؟",["التخمين","بيانات سابقة وأدلة موضوعية وعلاقات ثبتت صحتها نسبياً","آراء الخبراء فقط","الصدفة"],1,"مثال: توقع التحصيل في ضوء الدافعية أو الحضور، أو توقع الطقس."],
["s","لماذا تكون التوقعات في الظواهر الإنسانية «احتمالية وليست يقينية»؟",["لأن العلماء لا يهتمون بها","لأن الظواهر الإنسانية تتأثر بعوامل متداخلة يصعب ضبطها بالكامل","لأنها لا تُقاس","لأنها ظواهر طبيعية"],1,"الظواهر الطبيعية قد تكون أكثر انتظاماً، والإنسانية تتأثر بعوامل متداخلة."],
["s","يُستخدم ما ثبتت فاعليته من استراتيجية تعليمية لتحسين تعلم الطلبة وتطوير المناهج ومعالجة صعوبات التعلم. هذا هدف:",["الاكتشاف والتفسير","التوقع","الضبط والتحكم","الوصف"],2,"الضبط والتحكم: المرحلة التطبيقية المتقدمة، توظيف المعرفة للتأثير في الظواهر."],
["s","حسب ملف الوحدة، الضبط والتحكم:",["يعني السيطرة المطلقة","تدخّل منظم قائم على الأدلة مع مراعاة الاعتبارات الأخلاقية ومصلحة الإنسان","يسبق التفسير","يخص العلوم الطبيعية فقط"],1,"الشريحة تقول «السيطرة عليها وتوجيهها… لخدمة الإنسانية»، لكن ملف الوحدة يوضح أنها ليست سيطرة مطلقة."],
["s","طالب يحفظ القوانين العلمية لكنه لا يعرف كيف توصّل العلماء إليها. أي جانب من جانبي العلم ينقصه؟",["المادة","الطريقة","كلاهما","لا شيء"],1,"العلم لا يتمثل في حفظ المعلومات فقط، بل في معرفة كيفية إنتاجها والتحقق منها."],
["s","خاصية «حقائق العلم قابلة للتعديل» تعكس:",["ضعف موثوقية العلم","مرونة العلم وانفتاحه على التصحيح","تغيير الآراء بلا سبب","أن الحقائق مطلقة"],1,"قد يؤدي ظهور أدلة حديثة أو تطور أدوات القياس إلى تعديل تفسير سابق، ولا يعني ذلك عدم موثوقيته."],
["s","«المعرفة العلمية ملك إنساني مشترك، ويشارك العلماء من مختلف أنحاء العالم في إنتاجها وتبادلها من خلال المؤتمرات والمجلات». هذه خاصية:",["العلم تراكمي","العلم نشاط عالمي","العلم تكاملي","العلم مدقق"],1,"كما تخضع النتائج لمعايير عامة تسمح للباحثين بفحصها بصرف النظر عن خلفياتهم الثقافية أو الجغرافية."],
["s","تستفيد العلوم التربوية من علم النفس والإحصاء، والعلوم الطبية من الكيمياء والأحياء. هذا يعبّر عن:",["العلم تراكمي البناء","العلم تكاملي","العلم نشاط عالمي","العلم قابل للتعديل"],1,"تراكمي = عبر الزمن (اللاحق يبني على السابق). تكاملي = بين الفروع."],
["s","باحث يجري مقابلات مع الطلبة لفهم مشاعرهم وخبراتهم تجاه الرياضيات. أي نوع من القياس يستخدم؟",["كمي","كيفي","مخبري","فلكي"],1,"الكيفي يهتم بفهم المعاني والخبرات والسياقات."],
["s","أداة أعطت نتائج متسقة عند تكرار استخدامها في ظروف متشابهة. هذه الأداة:",["صادقة","ثابتة","كيفية","غير موضوعية"],1,"الثبات: الاتساق عند التكرار. الصدق: تقيس ما وُضعت لقياسه."],
["s","ماذا يؤدي ضعف صدق الأداة أو ثباتها؟",["نتائج أدق","نتائج غير دقيقة","لا يؤثر","يسرّع البحث"],1,"ملف الوحدة: «يؤدي ضعف صدق الأداة أو ثباتها إلى نتائج غير دقيقة». ومن الأدوات: الاختبارات، والاستبانات، والمقابلات، وبطاقات الملاحظة."],
["s","أي مما يلي من فروع العلوم الطبيعية؟",["التربية وعلم النفس","الاقتصاد والعلوم السياسية","الفيزياء والكيمياء والأحياء وعلوم الأرض","علم الاجتماع"],2,"الطبيعية: الفيزياء، الكيمياء، الأحياء، علوم الأرض والبيئة. الاجتماعية: التربية، علم النفس، علم الاجتماع، الاقتصاد، العلوم السياسية."],
["s","دراسة تأثير درجة الحرارة في سرعة التفاعل الكيميائي، أو أثر مادة معينة في نمو النباتات، أمثلة على:",["العلوم الاجتماعية","العلوم الطبيعية","البحث التربوي","العلوم السياسية"],1,"العلوم الطبيعية تعتمد الملاحظة الدقيقة والقياس والتجريب المنظم، وضبط الظروف لزيادة دقة النتائج."],
["s","إلامَ أدى ثبات الظواهر الطبيعية واستقرارها؟",["توقف تطور العلوم","تراكم المعرفة العلمية والتطور السريع وظهور اكتشافات ونظريات جديدة","صعوبة التنبؤ","الاعتماد على المقابلات"],1,"الشريحة: «أدى هذا الثبات إلى تراكم المعرفة العلمية… مما ساهم في التطور السريع»."],
["s","القوانين الطبيعية والكيميائية وقوانين علم الحيوان:",["تختلف من بلد لآخر","واحدة في الزمن الواحد وفي أكثر من مكان","تتغير كل سنة","لا يمكن قياسها"],1,"من شريحة البحث العلمي في العلوم الطبيعية."],
["s","لماذا توصف الظاهرة في العلوم الاجتماعية بأنها «متغيرة وغير مستقرة»؟",["لأنها تدرس الجمادات","لأنها تركز على الإنسان وسلوكه وأنماط تفكيره، وهي تتغير باستمرار من طور إلى آخر","لأنها لا تستخدم المنهج العلمي","لقلة خبرة الباحثين"],1,"من شريحة البحث العلمي في العلوم الاجتماعية."],
["s","تسعى البحوث في العلوم الاجتماعية إلى الوصول إلى درجة عالية من:",["الحدس","التكميم والتعميم، كما هو الحال في العلوم الطبيعية","الابتعاد عن الأرقام","السيطرة المطلقة"],1,"«تسعى إلى» = تحاول، لم تصل بشكل مطلق."],
["s","مناهج العلوم الاجتماعية حسب ملف الوحدة:",["الوصفي، والتحليلي، والمقارن، والارتباطي، والتجريبي","التجريبي المخبري فقط","الرياضي البحت","لا مناهج محددة"],0,"وتعتمد على البيانات الكمية والكيفية معاً."],
["s","أي مما يلي من أوجه الاختلاف بين العلوم الطبيعية والاجتماعية؟",["الطبيعية تعتمد المنهج العلمي والاجتماعية لا","الطبيعية تهدف إلى التنبؤ والسيطرة على الظواهر، والاجتماعية إلى فهم الظواهر وتفسيرها","الطبيعية تخدم المجتمع والاجتماعية لا","الطبيعية تتطور والاجتماعية ثابتة"],1,"الخيارات الأخرى أوجه تشابه. ومن الاختلاف أيضاً: الطبيعية تستخدم المنهج التجريبي والبيانات الكمية، والاجتماعية الوصفي والتحليلي والمقارن مع بيانات نوعية وكمية."],
["s","أكمل: بين العلوم الطبيعية والاجتماعية «الاختلاف في … والتشابه في …»",["الهدف / الموضوع","الموضوع / الهدف","المنهج / الأدوات","الأدوات / النتائج"],1,"كل علم يكمل الآخر، ومعاً يقدمان صورة أشمل عن العالم."],
["s","دراسة مشكلات مثل الصحة والبيئة والتعليم تتطلب:",["العلوم الطبيعية فقط","العلوم الاجتماعية فقط","الجمع بين المعرفة الطبيعية والاجتماعية لتكوين صورة أشمل","لا تحتاج بحثاً"],2,"ملف الوحدة: المجالان يتكاملان ولا يتعارضان."],

// ===== البحث العلمي والباحث =====
["r","كلمة «البحث» لغوياً تعني:",["التجريب في المختبر","الطلب أو التفتيش أو التقصي عن حقيقة أو أمر من الأمور","الحفظ","إدراك الشيء على حقيقته"],1,"«إدراك الشيء على حقيقته» معنى كلمة «علم» لغةً، وهذا فخ متوقع."],
["r","أي مما يلي ليس من أهداف البحث العلمي حسب تعريفه في الوحدة؟",["حل فعّال لمشكلة معينة","اكتشاف معلومات وعلاقات جديدة","التحقق من صحة نتائج ومعارف سابقة","إثبات رأي الباحث الشخصي"],3,"التعريف: الاستخدام المنظم للأساليب والإجراءات بهدف حل مشكلة، أو اكتشاف معلومات وعلاقات جديدة، أو التحقق من نتائج سابقة."],
["r","يشير تعريف البحث العلمي إلى أربعة عناصر. أي مما يلي ليس منها؟",["مشكلة واضحة قابلة للدراسة","اتباع منهج منظم","أدوات مناسبة لجمع المعلومات","عينة أكثر من ١٠٠٠ مشارك"],3,"العنصر الرابع: تحليل النتائج وتفسيرها بموضوعية."],
["r","طالب جمع معلومات من مواقع مختلفة بشكل عشوائي دون خطة. هل يُعد ذلك بحثاً علمياً؟",["نعم","نعم إذا كانت المواقع كثيرة","لا، لأن البحث العلمي يتم وفق إجراءات واضحة ومنضبطة","لا، لأنه استخدم الإنترنت"],2,"جمع المعلومات بصورة عشوائية لا يُعد بحثاً علمياً."],
["r","«مراحل مخططة مترابطة: تحديد المشكلة، مراجعة الدراسات، صياغة الأسئلة، اختيار المنهج والعينة، جمع البيانات، عرض النتائج؛ مما يقلل العشوائية». هذه سمة:",["تطبيق منظم لمنهجية علمية","وجود محددات","الاعتماد على التجريب","الالتزام بالأخلاقيات"],0,"السمات الأربع لماهية البحث: تطبيق منظم لمنهجية علمية، الالتزام بإجراءات وقواعد منهجية، الاعتماد على الملاحظة والتجريب، وجود محددات."],
["r","«يوضح الباحث إجراءاته ويوثق مصادره ويلتزم بالموضوعية، حتى يتمكن الآخرون من تقويم الدراسة أو تكرارها». هذه سمة:",["الالتزام بإجراءات وقواعد منهجية","وجود محددات","الاعتماد على التجريب","الرغبة في الموضوع"],0,"القواعد المنهجية تهدف إلى وصف الظواهر وتفسيرها والتنبؤ بها."],
["r","التجريب في البحث العلمي:",["يقتصر على المختبر","لا يعني الاقتصار على المختبر؛ فقد يستخدم الاستبانة أو المقابلة أو الاختبار أو تحليل الوثائق","ممنوع في البحث التربوي","يعني المقابلات فقط"],1,"سمة «الاعتماد على الملاحظة والتجريب»: الأدلة الواقعية تُجمع بالملاحظة أو القياس أو التجربة وفقاً لطبيعة المشكلة."],
["r","«لا يستطيع البحث الإجابة عن جميع الأسئلة، وقد تتأثر نتائجه بأخطاء القياس أو تحيز المشاركين، ولذلك يجب الإفصاح عن حدود الدراسة». هذه سمة:",["تطبيق منظم","الالتزام بالقواعد","الاعتماد على التجريب","وجود محددات للبحث العلمي"],3,"ولذلك تُختار عينة تمثل المجتمع، ولا تُعمم النتائج خارج المجتمع والظروف التي تسمح بها."],
["r","خلاصة ماهية البحث العلمي أنه:",["وسيلة لإثبات الآراء","وسيلة منهجية قائمة على الأدلة، تهدف إلى بناء معرفة موثوقة نسبياً، مع الاعتراف بأن نتائجها تخضع للمراجعة","معرفة نهائية لا تتغير","جمع معلومات من الكتب"],1,"من ملف الوحدة، صفحة ٩."],
["r","خصائص البحث العلمي السبع هي:",["الموضوعية، وضوح المتغيرات، التجريب، الصرامة والتماسك، الصدق، الاستناد إلى الأدلة، قابلية الاختبار والتكرار","الرغبة، الصبر، التواضع، التركيز، الإنجاز، التنظيم، الموضوعية","مادة، تعديل، عالمي، تراكمي، تكاملي، مدقق، قياس","المقدمة، المشكلة، الأهداف، الفرضيات، الطريقة، النتائج، المراجع"],0,"انتبه: الخيار الثاني صفات الباحث الجيد، والثالث خصائص العلم، والرابع محتويات التقرير."],
["r","في خاصية الموضوعية، ماذا يُقصد بـ«ثبات الإجابات»؟",["بقاء النتائج نهائية","اتساق النتائج عند تكرار الدراسة في الظروف نفسها","عدد إجابات ثابت","إجابة الجميع الإجابة نفسها"],1,"ليس بقاءها نهائية، لأن المعرفة العلمية قابلة للمراجعة إذا ظهرت أدلة جديدة."],
["r","باحث توقّع أن طريقته ستنجح، لكن النتائج أظهرت عدم وجود فرق، فكتب النتيجة كما هي. هذا يمثل:",["التواضع","الرغبة في الموضوع","الموضوعية","الصبر"],2,"الموضوعية: عرض النتائج كما توصلت إليها الدراسة حتى لو خالفت توقعات الباحث."],
["r","ما الفرق بين التعريف المفاهيمي والتعريف الإجرائي للمتغير؟",["المفاهيمي يحدد المقصود بالمتغير، والإجرائي يبيّن كيفية قياسه","المفاهيمي للتابع والإجرائي للمستقل","لا فرق","الإجرائي في المقدمة والمفاهيمي في النتائج"],0,"مثال: التحصيل إجرائياً = درجة الطالب في اختبار من ٤٠. المتغيرات قد تكون مستقلة أو تابعة أو ضابطة."],
["r","في سؤال «ما أثر الألعاب التعليمية في تحصيل الرياضيات؟»، المتغير المستقل هو:",["التحصيل","الألعاب التعليمية","الرياضيات","الطلبة"],1,"المستقل = السبب الذي ندرس أثره. التابع = النتيجة التي نقيسها (التحصيل)."],
["r","«اتساق أسئلة البحث وفرضياته مع المنهج والعينة والأدوات وأساليب التحليل، وضبط المتغيرات الدخيلة وتقليل التحيز». هذه خاصية:",["الصدق","الصرامة والتماسك","التكرار","الأدلة"],1,"مع الالتزام بأخلاقيات البحث."],
["r","ترتبط خاصية «الصدق» في البحث العلمي بـ:",["عدد الصفحات","جودة التصميم، وسلامة اختيار العينة، وكفاءة أدوات القياس، ودقة التحليل","شهرة الباحث","سرعة الإنجاز"],1,"الصدق أن تقيس الأداة ما أُعدت لقياسه وأن تعبّر النتائج بدقة عن الظاهرة."],
["r","«أظن أن الطلاب يحبون الطريقة» مقابل «٧٨٪ من الطلبة اختاروا موافق بشدة». الثانية تحقق خاصية:",["الاستناد إلى أدلة علمية كافية","التواضع","التكرار","الصرامة"],0,"الأدلة قد تكون كمية (درجات، نسب) أو كيفية (ملاحظات، مقابلات، نصوص)، ويجب أن تكون ذات صلة وكافية."],
["r","أعاد باحث دراسة سابقة فحصل على نتائج مختلفة. ماذا يعني ذلك؟",["الدراسة الأولى مزورة","هناك عوامل جديدة تحتاج إلى مزيد من الدراسة","البحث بلا فائدة","يجب حذف الأولى"],1,"تكرار النتائج يعزز الثقة، واختلافها قد يكشف عوامل جديدة."],
["r","مهارة تمكّن الباحث من مراجعة الأدبيات وفهم النظريات وتحديد الفجوة البحثية:",["التحليل الإحصائي","الاطلاع والتفسير","التواصل","التنظيم"],1,"ثم تفسير النتائج وربطها بالإطار النظري."],
["r","في مهارة التحليل الإحصائي، ما الذي لا يكفي وحده؟",["فهم مدلولات النتائج","إجراء العمليات الإحصائية دون فهم مدلولاتها","اختيار الأسلوب المناسب","تجنب الاستنتاجات التي تتجاوز البيانات"],1,"يجب فهم المدلولات وتجنب استنتاجات تتجاوز ما تسمح به البيانات."],
["r","«يحتاج الباحث إلى الاستعداد النفسي والعلمي من خلال الرغبة والدافعية وتوفير الوقت والجهد». هذا من مهارات الباحث في ملف الوحدة، ويقابله في الشريحة:",["توفر الرغبة في موضوع البحث","التواضع","التنظيم","الإنجاز"],0,"الشريحة: «رغبة الباحث في مجال البحث وميله نحوه عامل ودافع في نجاح عمله البحثي»."],
["r","باحث لم يذكر أسماء الطلبة المشاركين، ووثّق كل فكرة أخذها من غيره. هذا يمثل:",["الأمانة العلمية والالتزام بالسرية","التحليل الإحصائي","الإنجاز","قوة الملاحظة"],0,"يتجنب السرقة والانتحال وتحريف البيانات، ويحمي معلومات المشاركين."],
["r","مهارة طلب المشورة والنصيحة من المشرفين والخبراء عند مواجهة صعوبات منهجية أو فنية:",["التواصل","التنظيم","الإنجاز","الموضوعية"],0,"مهارة التواصل مع المشاركين والمشرفين والخبراء والزملاء، وعرض الأفكار والنتائج بوضوح."],
["r","صفات الباحث الجيد السبع حسب شريحة جيدير:",["الرغبة، التحمل والصبر، التواضع، التركيز وقوة الملاحظة، الإنجاز، التنظيم، الموضوعية","الموضوعية، الصدق، الثبات، التكرار، الأدلة، الصرامة، التجريب","الأمانة، الدقة، الفضول، النقد، المرونة، التنظيم، الصبر","المادة، الطريقة، التعديل، العالمية، التراكم، التكامل، التدقيق"],0,"الخيار الثالث من نشاط الـ١٠٠ نقطة، وليس القائمة الرسمية."],
["r","باحث متمكن يكتب «توصّل الباحث إلى…» بدلاً من «توصلتُ أنا…». أي صفة يجسّد؟",["الموضوعية","التواضع","التنظيم","الإنجاز"],1,"التواضع: لا يستخدم صيغة «الأنا» في الكتابة."],
["r","باحثة تقسّم وقتها بجدول واضح، وترتّب المعلومات التي جمعتها ترتيباً منطقياً وعملياً:",["الإنجاز","التنظيم","التركيز","الموضوعية"],1,"التنظيم: تنظيم الأوقات وترتيب المعلومات المجمعة بشكل منطقي وعملي."],

["r","حسب الشريحة، «التركيز وقوة الملاحظة» تعني:",["الإنجاز في الوقت","قدرة الباحث على تحليل معلوماته وتفسيرها","عدم استخدام الأنا","الابتعاد عن العاطفة"],1,"من شريحة «الباحث الجيد»."],

["e","البحث التربوي حسب ملف الوحدة:",["دراسة منظمة للمشكلات والظواهر المرتبطة بالتعليم والتعلّم، يبدأ بمشكلة أو سؤال تربوي ثم يجمع البيانات ويحللها وفق منهج مناسب","تأليف كتب مدرسية","تدريب المعلمين فقط","دراسة الظواهر الطبيعية"],0,"وقد يتناول المتعلمين أو المعلمين أو المناهج أو أساليب التدريس أو البيئة المدرسية."],
["e","يُعرّف البحث التربوي بأنه «جهد علمي منظم وموجه… للمشكلات التربوية التي تشكل العملية التربوية كنظام في…»",["أهدافها وفلسفتها","مدخلاتها ومخرجاتها وعملياتها","مناهجها فقط","معلميها فقط"],1,"تعريف المنسي (١٩٩٩، ص١٢)."],
["e","«واحد من ميادين البحث العلمي المختلفة، يسعى بحكم تسميته إلى التعرف على المشكلات التربوية وإيجاد الحلول المناسبة لها». هذا تعريف:",["العلم","البحث التربوي (عبيدات، ١٩٩٨)","خطة البحث","المنهج العلمي"],1,"للبحث التربوي تعريفان في الشرائح: المنسي وعبيدات."],
["e","أي مما يلي لا يُعد من موضوعات البحث التربوي؟",["المتعلمون والمعلمون","المناهج وأساليب التدريس","البيئة المدرسية","سرعة التفاعلات الكيميائية"],3,"التفاعلات الكيميائية من موضوعات العلوم الطبيعية."],
["e","أي هدف من أهداف البحث التربوي يسعى إلى «زيادة الكفاءة الداخلية والخارجية»؟",["التدريب على الأخلاقيات","دراسة واقع النظم التربوية لمعرفة خصائصها ومشكلاتها وتقديم الحلول","معرفة الطبيعة الإنسانية","تحديد فاعلية طرق التدريس"],1,"أهداف البحث التربوي الخمسة: الكشف عن المعرفة الجديدة، دراسة واقع النظم التربوية، تحديد فاعلية طرق التدريس وتطويرها، التدريب على الأخلاقيات، معرفة الطبيعة الإنسانية."],
["e","هدف «مساعدة التربويين على معرفة الطبيعة الإنسانية» يؤدي إلى:",["تسهيل التعامل الاجتماعي معها بصورة أفضل","زيادة المدارس","تقليل المواد","الترقيات"],0,"وفي ملف الوحدة: فهم خصائص المتعلمين وسلوكهم وحاجاتهم لتعامل أفضل."],
["e","«المساعدة في تحديد فاعلية الطرق والأساليب المستخدمة في حجرة الدراسة، والعمل على تطويرها» من:",["أهداف البحث التربوي","صفات الباحث","خصائص العنوان","خصائص العلم"],0,"أحد الأهداف الخمسة للبحث التربوي."],
["e","البحث التربوي «يحوّل المشكلات التعليمية من … إلى …»",["أسئلة / ملاحظات","ملاحظات عامة إلى أسئلة قابلة للدراسة، ومن التخمين إلى قرارات قائمة على الأدلة","أدلة / انطباعات","قرارات / تخمين"],1,"من شريحة «أهمية البحث التربوي»."],
["e","جوانب أهمية البحث التربوي السبعة:",["فهم المشكلات، تحسين التعليم والتعلم، دعم القرار، تطوير المناهج، تقويم الممارسات والسياسات، التنبؤ بالتحديات المستقبلية، إثراء المعرفة التربوية","الكشف عن المعرفة، دراسة الواقع، فاعلية الطرق، الأخلاقيات، الطبيعة الإنسانية","المناهج، المعلم، علم النفس، الفلسفة، الاقتصاد، الإدارة","الرغبة، الصبر، التواضع، التركيز، الإنجاز، التنظيم، الموضوعية"],0,"الخيار الثاني أهداف البحث التربوي، والثالث مجالاته، والرابع صفات الباحث."],
["e","«فهم المشكلات التربوية وتشخيص أسبابها بصورة علمية»، أي يحدد طبيعة المشكلة وأبعادها ويفحص العوامل المرتبطة بها قبل اقتراح الحلول. هذا جانب أهمية:",["فهم المشكلات التربوية","تحسين التعليم","إثراء المعرفة","تقويم السياسات"],0,"أول جوانب الأهمية السبعة."],
["e","«تحسين عمليتي التعليم والتعلّم» يتم من خلال:",["اختبار فاعلية الأساليب والاستراتيجيات المختلفة ومدى ملاءمتها للمتعلمين","زيادة الواجبات","تقليل الحصص","فرض العقوبات"],0,"يقوّم طرائق التدريس واستراتيجيات التعلم."],
["e","وزارة تعمّم برنامجاً بعد أن أثبت البحث نجاحه، أي تزوّد المعلمين والإدارات وصنّاع القرار ببيانات تساعدهم على اختيار الإجراءات. هذا جانب:",["دعم اتخاذ القرار التربوي","إثراء المعرفة","تطوير المناهج","فهم المشكلات"],0,"بالبيانات والأدلة بدلاً من الانطباعات الشخصية."],
["e","«يكشف احتياجات المتعلمين ويقوّم محتوى البرامج وأساليب تنفيذها بما يدعم تعديلها». هذا جانب:",["تطوير المناهج والبرامج التعليمية","تقويم السياسات","تحسين التعليم","إثراء المعرفة"],0,"بما يتناسب مع احتياجات المتعلمين والمجتمع."],
["e","بحث لمعرفة جوانب القوة ومجالات التحسين في سياسة منع الهواتف داخل المدارس، ومتابعة هل حققت الإجراءات أهدافها. هذا جانب:",["تطوير المناهج","تقويم الممارسات والسياسات التربوية","التنبؤ بالتحديات","إثراء المعرفة"],1,"يوضح جوانب القوة ومجالات التحسين، ويتابع ما إذا كانت الإجراءات تحقق أهدافها."],

const $=id=>document.getElementById(id);
let sec="all", onlyWrong=false, ans={};
try{ans=JSON.parse(localStorage.getItem("u1quiz")||"{}")}catch(e){ans={}}
const save=()=>{try{localStorage.setItem("u1quiz",JSON.stringify(ans))}catch(e){}};
const L=["أ","ب","ج","د"];
const secName=k=>SECS.find(s=>s[0]===k)[1];

function renderTabs(){
  $("tabs").innerHTML=SECS.map(([k,n])=>{const c=k==="all"?Q.length:Q.filter(q=>q[0]===k).length;return `<button data-k="${k}" aria-pressed="${k===sec}">${n} (${c})</button>`}).join("");
}
function stats(){
  const ids=Q.map((q,i)=>i).filter(i=>sec==="all"||Q[i][0]===sec);
  let done=0,ok=0;ids.forEach(i=>{if(ans[i]!==undefined){done++;if(ans[i]===Q[i][3])ok++}});
  $("stats").innerHTML=`<span>أجبت: <b>${done}</b> من ${ids.length}</span><span class="ok">صح: <b>${ok}</b></span><span class="bad">خطأ: <b>${done-ok}</b></span>
  <span class="tools"><button id="wrongBtn" aria-pressed="${onlyWrong}">الأخطاء فقط</button><button id="reset">إعادة</button></span>`;
  $("wrongBtn").onclick=()=>{onlyWrong=!onlyWrong;render()};
  $("reset").onclick=()=>{ids.forEach(i=>delete ans[i]);save();onlyWrong=false;render()};
}
function card(i,n){
  const [s,p,o,c,e]=Q[i];const a=ans[i];const done=a!==undefined;
  return `<article class="q" id="q${i}"><div class="meta"><span class="num">${n}</span>${sec==="all"?`<span class="tag">${secName(s)}</span>`:""}</div>
  <p class="prompt">${p}</p><div class="opts">${o.map((t,j)=>{let cls="";if(done){if(j===c)cls="correct";else if(j===a)cls="wrong"}
  return `<button class="opt ${cls}" data-i="${i}" data-j="${j}" ${done?"disabled":""}><span class="l">${L[j]}</span><span>${t}</span></button>`}).join("")}</div>
  ${done?`<div class="exp"><b>${a===c?"✓ صحيح.":"✗ الإجابة الصحيحة: "+L[c]+"."}</b> ${e}</div>`:""}</article>`;
}
function render(){
  renderTabs();stats();
  let ids=Q.map((q,i)=>i).filter(i=>sec==="all"||Q[i][0]===sec);
  if(onlyWrong) ids=ids.filter(i=>ans[i]!==undefined&&ans[i]!==Q[i][3]);
  $("list").innerHTML=ids.length?ids.map((i,n)=>card(i,n+1)).join(""):`<p class="empty">${onlyWrong?"ما عندك أخطاء في هذا القسم 👏":"لا توجد أسئلة"}</p>`;
}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;sec=b.dataset.k;onlyWrong=false;render();window.scrollTo({top:0})};
$("list").onclick=e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const i=+b.dataset.i;ans[i]=+b.dataset.j;save();
  const el=$("q"+i);const n=el.querySelector(".num").textContent;el.outerHTML=card(i,n);stats();};
render();
</script>
