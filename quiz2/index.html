<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>بنك أسئلة الوحدة الثانية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: one focused question card, filters above, score rail; same palette as the unit videos. */
:root{
  color-scheme: dark;
  --ground:#0c1720; --card:#132535; --card2:#182d40; --line:#26435c;
  --ink:#eaf1f3; --muted:#9bb0bc; --teal:#4cc3bd; --amber:#f2b43e; --coral:#ee7c62; --good:#5ccf8a; --bad:#ef6b6b;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--body);direction:rtl;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;font-size:16px}
.wrap{max-width:780px;margin-inline:auto;display:grid;gap:16px}
header{display:grid;gap:4px}
h1{margin:0;font-size:24px;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px}
.filters{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lab{color:var(--muted);font-size:13px;min-width:56px}
.chip{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#062320;font-weight:700}
.chip small{opacity:.75;font-weight:400;margin-inline-start:4px}
select{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;max-width:100%}
.btn{font-family:var(--body);font-size:15px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1b1405;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
:is(.btn,.chip,.opt,select):focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.rail{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--muted)}
.rail b{color:var(--ink);font-variant-numeric:tabular-nums}
.rail .g b{color:var(--good)} .rail .r b{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px}
.tag{border-radius:6px;padding:3px 9px;font-weight:700}
.tag.m{background:#20425a;color:var(--teal)} .tag.tf{background:#4a3a14;color:var(--amber)} .tag.d{background:#4b2a24;color:var(--coral)}
.meta .sec{color:var(--muted)}
.qtext{font-size:19px;line-height:1.75;margin:0;font-weight:500}
.qtext.def{font-size:18px;border-inline-start:4px solid var(--coral);padding-inline-start:14px}
.ask{color:var(--muted);font-size:13.5px;margin:-4px 0 0}
.opts{display:grid;gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:center;text-align:start;font-family:var(--body);font-size:16px;line-height:1.6;color:var(--ink);background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--ground);color:var(--muted);font-size:13px;font-weight:700}
.opts.tf .opt{justify-content:center;font-size:19px;font-weight:700;min-height:64px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:#173a2a}
.opt.ok .k{background:var(--good);color:#06210f}
.opt.no{border-color:var(--bad);background:#3d1d1f}
.opt.no .k{background:var(--bad);color:#2a0607}
.opt.dim{opacity:.5}
.fb{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7;display:grid;gap:4px}
.fb.ok{background:#173a2a;border:1px solid #2c6b4a}
.fb.no{background:#3d1d1f;border:1px solid #74363a}
.fb strong{font-size:16px}
.fb .ans{color:var(--amber);font-weight:700}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.end{text-align:center;display:grid;gap:12px;justify-items:center}
.big{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.persec{width:100%;display:grid;gap:6px;text-align:start}
.ps{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:14px}
.ps .b{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.ps .b i{display:block;height:100%;background:var(--teal)}
.ps span:last-child{text-align:end;font-variant-numeric:tabular-nums;color:var(--muted)}
.wrong{width:100%;display:grid;gap:8px;text-align:start}
.wr{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.65}
.wr .ans{color:var(--good);font-weight:700}
.hint{color:var(--muted);font-size:12.5px}
@media (max-width:520px){.opts.tf{grid-template-columns:1fr 1fr}.qtext{font-size:17.5px}.ps{grid-template-columns:minmax(0,1fr) 70px 40px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>بنك أسئلة الوحدة الثانية</h1>
    <div class="sub">مناهج البحث EDUC4101 · الأسابيع ٤ و٥ و٦ · اختيار من متعدد، وصح وخطأ، وتعاريف تختار مصطلحها</div>
  </header>

  <section class="filters" aria-label="اختيار الأسئلة">
    <div class="row" id="types"><span class="lab">النوع</span></div>
    <div class="row"><span class="lab">الموضوع</span><select id="sec"></select></div>
    <div class="row">
      <button class="btn primary" id="start">ابدأ</button>
      <button class="btn" id="retry" hidden>أعد الأسئلة اللي أخطأت فيها</button>
      <span class="hint" id="pool"></span>
    </div>
  </section>

  <div class="rail">
    <span>السؤال <b id="pos">٠</b> من <b id="tot">٠</b></span>
    <span class="g">صح <b id="ok">٠</b></span>
    <span class="r">خطأ <b id="no">٠</b></span>
  </div>
  <div class="bar"><i id="fill"></i></div>

  <main class="card" id="card" aria-live="polite"></main>
  <p class="hint">اختصارات لوحة المفاتيح: ١–٤ للاختيار (أو ص/خ في صح وخطأ)، و Enter للسؤال التالي.</p>
</div>

<script>
const SECTIONS=["أنواع البحوث","المقابلة","الاستبانة","الملاحظة","الاختبارات والمقاييس","البحث الاستكشافي","المنهج الوصفي وأنواعه","البحث التجريبي","المجتمع والعينة","العينات الاحتمالية","العينات غير الاحتمالية","أخطاء المعاينة"];
/* t: m = اختيار من متعدد ، tf = صح وخطأ ، d = تعريف (اختر المصطلح) */
const Q=[
/* ================= 0 أنواع البحوث ================= */
{s:0,t:"d",q:"يدرس الظواهر بطريقة موضوعية ومنظمة من خلال جمع البيانات الرقمية وتحليلها باستخدام الأساليب الإحصائية المناسبة.",a:"البحث الكمي"},
{s:0,t:"d",q:"يركز على الفهم العميق للظواهر الإنسانية والاجتماعية والتربوية من خلال دراسة الخبرات والتجارب والمعاني والتصورات التي يحملها الأفراد تجاه الظاهرة.",a:"البحث النوعي"},
{s:0,t:"d",q:"اتجاه منهجي يجمع بين البحث الكمي والبحث النوعي ضمن دراسة علمية واحدة، بهدف الاستفادة من مميزات كلا الاتجاهين.",a:"البحث المزجي (المختلط)"},
{s:0,t:"m",q:"البحث الذي يهدف إلى قياس المتغيرات واختبار الفرضيات والكشف عن العلاقات والفروق بينها هو:",o:["البحث الكمي","البحث النوعي","البحث الاستكشافي","دراسة الحالة"],a:0,e:"القياس واختبار الفرضيات والعلاقات الرقمية من سمات البحث الكمي."},
{s:0,t:"m",q:"من الأدوات المقننة التي يتميز البحث الكمي باستخدامها:",o:["الاستبانات والاختبارات والمقاييس","المقابلات المتعمقة","تحليل الوثائق","الملاحظة المباشرة غير المقننة"],a:0,e:"البحث الكمي يستخدم أدوات مقننة كالاستبانات والاختبارات والمقاييس، مما يعزز دقة القياس."},
{s:0,t:"m",q:"من أبرز أدوات البحث النوعي:",o:["المقابلات المتعمقة والملاحظة المباشرة وتحليل الوثائق","الاختبارات التحصيلية المقننة","المقاييس الإحصائية","الاستبانات المغلقة فقط"],a:0,e:"البحث النوعي يجمع بيانات وصفية غنية بالتفاصيل عبر المقابلات المتعمقة والملاحظة المباشرة وتحليل الوثائق."},
{s:0,t:"m",q:"دراسة «العلاقة بين استخدام التقنيات التعليمية والتحصيل الدراسي لدى طلبة الجامعات» مثال على:",o:["البحث الكمي","البحث النوعي","البحث المزجي","البحث الاستكشافي"],a:0,e:"علاقة بين متغيرين تُقاس وتُحلل إحصائياً، فهو بحث كمي."},
{s:0,t:"m",q:"فهم التحديات التي يواجهها المعلمون عند تطبيق استراتيجيات التدريس الحديثة من خلال مقابلات معهم مثال على:",o:["البحث النوعي","البحث الكمي","البحث التجريبي","البحث الارتباطي"],a:0,e:"فهم التجارب والآراء بعمق عبر مقابلات، فهو بحث نوعي."},
{s:0,t:"m",q:"استبانة لقياس مستوى رضا الطلبة عن التعليم الإلكتروني، ثم مقابلات مع مجموعة منهم لفهم أسباب ارتفاع الرضا أو انخفاضه، مثال على:",o:["البحث المزجي","البحث الكمي","البحث النوعي","البحث التجريبي"],a:0,e:"أداة كمية ثم أداة نوعية في دراسة واحدة = بحث مزجي."},
{s:0,t:"m",q:"«قياس العلاقة بين ساعات الدراسة والتحصيل الدراسي» يصنف بحثاً:",o:["كمياً","نوعياً","مزجياً","استكشافياً"],a:0,e:"قياس علاقة بين متغيرين رقميين = بحث كمي."},
{s:0,t:"m",q:"«استكشاف تجارب المعلمين في التعامل مع صعوبات التعلم من خلال المقابلات» يصنف بحثاً:",o:["نوعياً","كمياً","مزجياً","تجريبياً"],a:0,e:"استكشاف تجارب عبر مقابلات = بحث نوعي."},
{s:0,t:"m",q:"في البحث المزجي، تسهم البيانات الكمية في ............ بينما تساعد البيانات النوعية على ............",o:["تحديد حجم الظاهرة / تفسير النتائج وفهم الأسباب","تفسير الأسباب / تحديد حجم الظاهرة","جمع الآراء / تعميم النتائج","فهم المعاني / اختبار الفرضيات"],a:0,e:"الكمي يحدد حجم الظاهرة وقياس العلاقات، والنوعي يفسر النتائج والأسباب والسياقات."},
{s:0,t:"m",q:"يتحدد اختيار نوع البحث العلمي وفقاً لـ:",o:["طبيعة المشكلة البحثية وأهداف الدراسة وأسئلتها ونوعية البيانات المطلوبة","التفضيلات الشخصية للباحث","سهولة تطبيق الأداة","عدد المشاركين المتاحين فقط"],a:0,e:"اختيار نوع البحث لا يعتمد على تفضيلات الباحث، بل على طبيعة المشكلة وأهدافها وأسئلتها ونوعية البيانات."},
{s:0,t:"m",q:"البحث الذي يتيح للباحث تفسير الظواهر في سياقاتها الطبيعية ويناسب الدراسات الاستكشافية التي تسعى إلى فهم الظواهر بعمق:",o:["البحث النوعي","البحث الكمي","البحث التجريبي","البحث المسحي"],a:0,e:"البحث النوعي يستكشف المعاني ويفسر الظواهر في سياقاتها الطبيعية."},
{s:0,t:"tf",q:"يعتمد البحث النوعي بصورة أساسية على القياس العددي.",a:false,e:"البحث النوعي لا يركز بصورة أساسية على القياس العددي، بل على بيانات وصفية غنية بالتفاصيل."},
{s:0,t:"tf",q:"يساعد البحث الكمي على الوصول إلى نتائج دقيقة يمكن تعميمها على مجتمع الدراسة.",a:true,e:"من أهداف البحث الكمي الوصول إلى نتائج دقيقة قابلة للتعميم."},
{s:0,t:"tf",q:"يمكن تنفيذ البحث المزجي بجمع البيانات الكمية والنوعية في الوقت نفسه، أو جمع أحدهما أولاً ثم استخدام الآخر.",a:true,e:"كلا الطريقتين ممكنة في البحث المزجي."},
{s:0,t:"tf",q:"يعتمد اختيار نوع البحث العلمي على التفضيلات الشخصية للباحث.",a:false,e:"لا ينبغي أن يعتمد على التفضيلات الشخصية، بل على طبيعة المشكلة وأهداف الدراسة."},
{s:0,t:"tf",q:"يرى كريسويل (2018) أن البحث المزجي يوفر فهماً أكثر اكتمالاً للمشكلة البحثية مقارنة باستخدام أحد الاتجاهين بصورة منفردة.",a:true,e:"هذا ما يؤكده كريسويل (2018)."},
{s:0,t:"tf",q:"يساعد البحث النوعي على تفسير السلوك الإنساني وفهم العوامل الاجتماعية والثقافية والنفسية المرتبطة به.",a:true,e:"صحيح، مع مراعاة السياق الطبيعي الذي تحدث فيه الظاهرة."},

/* ================= أدوات البحث عامة + 1 المقابلة ================= */
{s:1,t:"m",q:"أبرز أدوات جمع البيانات المستخدمة في البحوث التربوية والاجتماعية:",o:["المقابلة والاستبانة والملاحظة والاختبارات والمقاييس","التجربة والعينة والمجتمع والفرضية","المسح ودراسة الحالة والارتباط","التحليل والتفسير والتعميم"],a:0,e:"الأدوات الأربع: المقابلة، الاستبانة، الملاحظة، الاختبارات والمقاييس."},
{s:1,t:"m",q:"يعتمد اختيار أداة البحث المناسبة على كل ما يلي ما عدا:",o:["سهولة الأداة أو كونها الأكثر شيوعاً","طبيعة المشكلة البحثية","نوع المنهج المستخدم","خصائص مجتمع الدراسة وعينتها"],a:0,e:"لا ينبغي اختيار الأداة لأنها الأسهل أو الأكثر شيوعاً، بل لأنها الأقدر على إنتاج البيانات اللازمة."},
{s:1,t:"tf",q:"توجد أداة واحدة يمكن اعتبارها الأفضل لجميع الدراسات.",a:false,e:"لا توجد أداة واحدة أفضل لجميع الدراسات؛ فلكل أداة مزايا وحدود."},
{s:1,t:"tf",q:"يمكن للباحث استخدام أكثر من أداة لجمع البيانات عندما تقتضي طبيعة الدراسة ذلك.",a:true,e:"الجمع بين الأدوات يعطي معلومات أكثر شمولاً."},
{s:1,t:"d",q:"محادثة موجهة بين الباحث والمبحوث للوصول إلى حقيقة أو موقف ما، وذلك لتحقيق أهداف الدراسة.",a:"المقابلة"},
{s:1,t:"m",q:"الأداة التي تقوم على التفاعل المباشر بين الباحث والمبحوث وتتيح الفرصة للاستفسار والتوضيح:",o:["المقابلة","الاستبانة","الملاحظة","الاختبار"],a:0,e:"المقابلة تقوم على التفاعل المباشر بين الباحث والمبحوث."},
{s:1,t:"m",q:"تكون المقابلة ذات قيمة خاصة في الدراسات التي تهدف إلى:",o:["فهم تجارب الأفراد ومواقفهم وتفسيراتهم بصورة متعمقة","جمع بيانات من عدد كبير في أماكن متباعدة","قياس قدرات محددة بطريقة منظمة","تسجيل السلوك الفعلي لحظة حدوثه"],a:0,e:"المقابلة مناسبة للتعمق وفهم التجارب والمواقف."},
{s:1,t:"m",q:"من الأمور الواجب مراعاتها أثناء إجراء المقابلة:",o:["ألا يترك للمبحوث إدارة المقابلة والسيطرة على مجرياتها","أن يوحي الباحث للمشارك بالإجابة المناسبة","أن تُجرى في مكان مزدحم ليشعر المبحوث بالراحة","تجنب تسجيل الإجابات"],a:0,e:"من شروط المقابلة ألا يترك الباحث للمبحوث إدارتها، مع خلق جو ودي."},
{s:1,t:"m",q:"لماذا يجب تدريب الأشخاص القائمين بإجراء المقابلات؟",o:["لأن اختلاف أسلوب الباحثين قد يؤدي إلى اختلاف طبيعة البيانات","لزيادة عدد المشاركين","لتقليل عدد الأسئلة","لأن المقابلة لا تحتاج إلى تسجيل"],a:0,e:"اختلاف أسلوب الباحثين قد يغير البيانات، لذا يجب تدريبهم والتأكد من كفاءتهم."},
{s:1,t:"m",q:"من مزايا المقابلة:",o:["ارتفاع نسبة الردود مقارنة بالاستبانة","توفير الوقت والجهد مع الأعداد الكبيرة","عدم تأثرها بالحالة النفسية","سهولة الوصول إلى جميع الأفراد"],a:0,e:"ارتفاع نسبة الردود من مزايا المقابلة."},
{s:1,t:"m",q:"وسيلة ممكنة للتطبيق في مجتمعات الأمية والأطفال:",o:["المقابلة","الاستبانة","الاختبار المكتوب","تحليل الوثائق"],a:0,e:"المقابلة لا تتطلب القراءة والكتابة، فتناسب الأميين والأطفال."},
{s:1,t:"m",q:"من عيوب المقابلة:",o:["تحتاج إلى وقت وجهد كبيرين في حالة الأعداد الكبيرة","انخفاض نسبة الردود","لا تسمح بتوضيح الأسئلة","لا تناسب الظواهر الشخصية"],a:0,e:"من عيوبها الحاجة لوقت وجهد كبيرين، وصعوبة الوصول لبعض الأفراد."},
{s:1,t:"m",q:"«قد يقدم المشارك إجابات يعتقد أنها أكثر قبولاً بدلاً من التعبير عن موقفه الحقيقي» يشير هذا إلى:",o:["مشكلة الاستحسان الاجتماعي (تحيز المبحوث) في المقابلة","ضعف ثبات الاختبار","خطأ المعاينة العشوائي","انخفاض نسبة الردود في الاستبانة"],a:0,e:"إمكانية التحيز من قبل المبحوث للظهور بشكل لائق أمام الباحث من عيوب المقابلة."},
{s:1,t:"m",q:"أهم ما يميز المقابلة:",o:["العمق والمرونة","السرعة وانخفاض التكلفة","تغطية أماكن متباعدة","البعد التام عن التحيز"],a:0,e:"أهم ما يميز المقابلة العمق والمرونة، وأبرز تحدياتها التكلفة الزمنية واحتمالات التحيز."},
{s:1,t:"m",q:"أنسب أداة لدراسة «أسباب الغياب» لأنها شخصية وتحتاج إلى تعمق واستفسار:",o:["المقابلة","الملاحظة","الاختبار","الاستبانة المغلقة"],a:0,e:"الأسباب الشخصية تحتاج تعمقاً واستفساراً، فالأنسب المقابلة."},
{s:1,t:"tf",q:"المقابلة مجرد حوار عادي بين الباحث والمبحوث.",a:false,e:"لا ينبغي النظر إليها كحوار عادي؛ فهي عملية بحثية مخططة لها أهداف وأسئلة محددة."},
{s:1,t:"tf",q:"العلاقة الودية في المقابلة لا تعني فقدان الباحث السيطرة المنهجية عليها.",a:true,e:"يجب توجيه الحوار نحو أهداف الدراسة دون مقاطعة غير ضرورية."},
{s:1,t:"tf",q:"يجب على الباحث في المقابلة أن يوحي للمشارك بالإجابة الصحيحة حتى يوفر الوقت.",a:false,e:"يجب ألا يوحي للمشارك بإجابة معينة أو يفرض عليه وجهة نظره."},
{s:1,t:"tf",q:"من الأمور الواجب مراعاتها في المقابلة مناسبة مظهر الباحث وهندامه.",a:true,e:"هذا الأمر الرابع من الأمور الثمانية."},
{s:1,t:"tf",q:"من عيوب المقابلة أنها قد تتأثر بالحالة النفسية للباحث والمبحوث.",a:true,e:"صحيح، وهذا من عيوبها."},
{s:1,t:"tf",q:"يجب تحديد طريقة تسجيل بيانات المقابلة مسبقاً، سواء بالكتابة المنظمة أو التسجيل الصوتي بعد الحصول على الموافقات.",a:true,e:"اختيار الطريقة المناسبة لتسجيل الإجابات من الأمور الثمانية."},

/* ================= 2 الاستبانة ================= */
{s:2,t:"d",q:"مجموعة من الأسئلة والعبارات المكتوبة بغرض الحصول على معلومات أو آراء المبحوثين حول ظاهرة ما أو موقف معين.",a:"الاستبانة"},
{s:2,t:"m",q:"من أكثر أدوات جمع البيانات استخداماً:",o:["الاستبانة","المقابلة","الملاحظة","دراسة الحالة"],a:0,e:"تعد الاستبانة من أكثر أدوات جمع البيانات استخداماً."},
{s:2,t:"m",q:"أقسام الاستبانة الثلاثة بالترتيب:",o:["المقدمة، إرشادات التعبئة، متن الاستبانة","المتن، المقدمة، الخاتمة","الأسئلة المغلقة، المفتوحة، المزدوجة","العنوان، الأهداف، النتائج"],a:0,e:"تقسيم الاستبانة إلى المقدمة، وإرشادات التعبئة، ومتن الاستبانة."},
{s:2,t:"m",q:"الأسئلة التي تتطلب الاختيار من بدائل محددة في الاستبانة تسمى:",o:["أسئلة مغلقة","أسئلة مفتوحة","أسئلة مزدوجة","أسئلة إسقاطية"],a:0,e:"الأسئلة المغلقة تتطلب الاختيار من بدائل محددة."},
{s:2,t:"m",q:"الأسئلة التي تسمح للمشارك بصياغة إجابته بنفسه:",o:["الأسئلة المفتوحة","الأسئلة المغلقة","الأسئلة المزدوجة","أسئلة الصور"],a:0,e:"الأسئلة المفتوحة تسمح بصياغة الإجابة."},
{s:2,t:"m",q:"الأسئلة التي تجمع بين النوع المغلق والمفتوح:",o:["المزدوجة","المركبة","المقننة","المتدرجة"],a:0,e:"المزدوجة من المغلقة والمفتوحة."},
{s:2,t:"m",q:"تزداد فائدة الاستبانة عندما:",o:["يحتاج الباحث إلى جمع بيانات موحدة من عدد كبير من الأفراد موزعين في مواقع جغرافية مختلفة","يريد الباحث فهم الانفعالات بعمق","تكون العينة من الأطفال الأميين","يريد تسجيل السلوك لحظة حدوثه"],a:0,e:"الاستبانة مناسبة للأعداد الكبيرة والمواقع المتباعدة."},
{s:2,t:"m",q:"أكثر مراحل بناء الاستبانة حساسية:",o:["صياغة الأسئلة","كتابة المقدمة","الطباعة","توزيع الاستبانة"],a:0,e:"صياغة الأسئلة من أكثر مراحل بناء الاستبانة حساسية."},
{s:2,t:"m",q:"من الأمور الواجب مراعاتها عند صياغة أسئلة الاستبانة:",o:["التدرج بالأسئلة من السهل إلى الصعب","البدء بالأسئلة الخاصة ثم العامة","استخدام مصطلحات تحتمل أكثر من تفسير","إطالة السؤال لزيادة الدقة"],a:0,e:"التدرج من السهل إلى الصعب، والانتقال من العامة إلى الخاصة."},
{s:2,t:"m",q:"إذا كانت الاستبانة تغطي أكثر من موضوع فرعي، فالأفضل:",o:["ترتيب الأسئلة حسب الموضوعات الفرعية","خلط الأسئلة عشوائياً","حذف الموضوعات الفرعية","تحويلها إلى مقابلة"],a:0,e:"ترتيب الأسئلة حسب المحاور يحقق الترابط المنطقي."},
{s:2,t:"m",q:"من مزايا الاستبانة:",o:["توفر الكثير من الجهد والوقت في جمع البيانات","ارتفاع نسبة الردود","توضح الأمور العاطفية والانفعالية","تسمح بتوضيح السؤال للمستجيب"],a:0,e:"توفير الجهد والوقت، وتغطية أماكن متباعدة، وترك حرية التفكير، وتقليل التحيز."},
{s:2,t:"m",q:"من عيوب الاستبانة:",o:["انخفاض نسبة الردود","ارتفاع تكلفتها مقارنة بالمقابلة","التحيز الكبير من الباحث","صعوبة تطبيقها في أماكن متباعدة"],a:0,e:"انخفاض نسبة الردود من أهم عيوب الاستبانة."},
{s:2,t:"m",q:"الأداة التي تترك الحرية للمبحوث في التفكير واختيار الوقت المناسب للإجابة:",o:["الاستبانة","المقابلة","الملاحظة","دراسة الحالة"],a:0,e:"من مزايا الاستبانة."},
{s:2,t:"m",q:"«قد يجيب المستجيب إجابة مغايرة للمطلوب» من عيوب الاستبانة، ويحدث ذلك في حالة:",o:["الأسئلة غير المفهومة","الأسئلة المغلقة","زيادة حجم العينة","وجود الباحث"],a:0,e:"غياب الباحث لتوضيح السؤال يجعل الأسئلة غير المفهومة تؤدي لإجابات مغايرة."},
{s:2,t:"m",q:"أنسب أداة لدراسة «رضا الطلبة عن الخدمات الجامعية»:",o:["الاستبانة","الملاحظة","الاختبار","دراسة الحالة"],a:0,e:"عدد كبير وبيانات موحدة = استبانة."},
{s:2,t:"tf",q:"نجاح الاستبانة يقاس بعدد أسئلتها.",a:false,e:"نجاحها لا يقاس بعدد الأسئلة، بل بمدى وضوحها وارتباط بنودها بأهداف الدراسة وجودة الاستجابة."},
{s:2,t:"tf",q:"الاستبانة أقل قدرة من المقابلة على الكشف المباشر عن الانفعالات أو التعمق في الأسباب الكامنة وراء الإجابات.",a:true,e:"صحيح، وهذا من قيودها."},
{s:2,t:"tf",q:"يمكن أن تتضمن الاستبانة صوراً ورسومات إذا كانت طبيعة المشاركين أو الموضوع تتطلب ذلك.",a:true,e:"قد تكون الأسئلة عبارة عن صور ورسومات."},
{s:2,t:"tf",q:"من الأمور الواجب مراعاتها عند صياغة أسئلة الاستبانة الانتقال من الأسئلة الخاصة إلى العامة.",a:false,e:"العكس: الانتقال من العامة إلى الخاصة."},
{s:2,t:"tf",q:"من مزايا الاستبانة أنها تقلل من مسألة التحيز.",a:true,e:"تحد من بعض أشكال تأثير الباحث المباشر."},
{s:2,t:"tf",q:"يجب أن تكون أسئلة الاستبانة واضحة ومحددة وبلغة تتناسب مع المبحوثين.",a:true,e:"هذا أول الأمور الثمانية في صياغة الأسئلة."},
{s:2,t:"tf",q:"ينبغي أن يكون السؤال في الاستبانة طويلاً حتى يكون شاملاً.",a:false,e:"يجب ألا يكون السؤال طويلاً بدرجة تسبب الارتباك؛ بل طوله مناسب."},
{s:2,t:"tf",q:"من الأمور العامة في الاستبانة أن تكون مطبوعة بشكل أنيق وواضح وبطريقة جذابة.",a:true,e:"من المبادئ العامة للاستبانة."},

/* ================= 3 الملاحظة ================= */
{s:3,t:"d",q:"مراقبة أو مشاهدة لسلوك الظواهر والمشكلات والأحداث ومكوناتها المادية والبيئية ومتابعة سيرها واتجاهاتها وعلاقاتها بأسلوب علمي منظم ومخطط وهادف، بقصد التفسير وتحديد العلاقة بين المتغيرات والتنبؤ بسلوك الظاهرة.",a:"الملاحظة"},
{s:3,t:"m",q:"الأداة التي تعتمد على مشاهدة الباحث للسلوك أو الظاهرة وتسجيلها بصورة منظمة أثناء حدوثها:",o:["الملاحظة","المقابلة","الاستبانة","الاختبار"],a:0,e:"الملاحظة تسجل السلوك أثناء حدوثه."},
{s:3,t:"m",q:"تختلف الملاحظة العلمية عن المشاهدة اليومية في أن الباحث:",o:["يحدد مسبقاً ما الذي يريد ملاحظته وكيف سيسجله وفي أي سياق","يعتمد على ذاكرته","لا يحتاج إلى أهداف","يشاهد الأحداث بالصدفة"],a:0,e:"الملاحظة العلمية مخططة: يحدد الباحث مسبقاً ماذا يلاحظ وكيف يسجل وفي أي سياق."},
{s:3,t:"m",q:"تكون الملاحظة مناسبة بصورة خاصة عندما يكون الباحث مهتماً بـ:",o:["ما يفعله الأفراد فعلياً وليس بما يقولون إنهم يفعلونه","آراء الأفراد واتجاهاتهم المكتوبة","جمع بيانات من عدد كبير بسرعة","قياس التحصيل الدراسي"],a:0,e:"الملاحظة تهتم بالسلوك الفعلي."},
{s:3,t:"m",q:"من الأمور الواجب مراعاتها أثناء إجراء الملاحظة:",o:["جمع معلومات أساسية مسبقة عن الشيء المراد ملاحظته","ترك تحديد الأهداف إلى ما بعد الملاحظة","الاعتماد على الذاكرة في التسجيل","إخبار المشاركين بكل ما سيلاحظ لتعديل سلوكهم"],a:0,e:"أول الأمور الأربعة: جمع معلومات أساسية مسبقة."},
{s:3,t:"m",q:"التدريب على تسجيل الملاحظات ضروري خاصة عندما:",o:["يشارك أكثر من باحث في عملية الملاحظة","تكون الظاهرة بسيطة","يكون عدد المشاركين قليلاً","تكون الملاحظة قصيرة"],a:0,e:"التدريب يقلل الاختلاف في تفسير الأحداث، خاصة مع تعدد الملاحظين."},
{s:3,t:"m",q:"من مزايا الملاحظة:",o:["تسمح بالتعرف على ظواهر عارضة لا يفكر فيها الباحث مسبقاً","قليلة التكلفة والجهد","تناسب دراسة العلاقات الزوجية","لا يقع فيها تحيز"],a:0,e:"قد تكشف أحداثاً أو أنماطاً لم يتوقعها الباحث."},
{s:3,t:"m",q:"المصدر الرئيسي للمعلومات عن السلوك الطبيعي للمبحوثين، وعدم الاعتماد على ما يدليه المبحوث:",o:["الملاحظة","المقابلة","الاستبانة","الاختبار"],a:0,e:"من مزايا الملاحظة."},
{s:3,t:"m",q:"«قد يتغير سلوك المشاركين عندما يعلمون أنهم يخضعون للملاحظة» يسمى ذلك:",o:["تحيز المبحوثين باصطناع السلوك","تحيز الباحث","خطأ المعاينة العشوائي","ضعف الصدق"],a:0,e:"اصطناع السلوك من عيوب الملاحظة، ويقلل من طبيعية السلوك."},
{s:3,t:"m",q:"من عيوب الملاحظة:",o:["يصعب استخدامها في خصوصيات الأفراد مثل العلاقات الزوجية","انخفاض نسبة الردود","لا تسجل السلوك أثناء حدوثه","تعتمد على ما يقوله المبحوث"],a:0,e:"صعوبة استخدامها في الموضوعات شديدة الخصوصية."},
{s:3,t:"m",q:"«قد يكون الباحث عرضة للخطر» من عيوب الملاحظة، ومثاله:",o:["دراسة سلوك بعض القبائل البدائية","دراسة التفاعل الصفي","تحليل كتاب مدرسي","مقابلة معلم"],a:0,e:"مثال الملزمة: دراسة سلوك بعض القبائل البدائية."},
{s:3,t:"m",q:"أنسب أداة لدراسة «التفاعل داخل الصف»:",o:["الملاحظة","الاستبانة","الاختبار التحصيلي","تحليل الوثائق"],a:0,e:"التفاعل سلوك فعلي يرصد لحظة حدوثه."},
{s:3,t:"m",q:"طبق طالبان بطاقة الملاحظة نفسها على المشهد نفسه فاختلفت تسجيلاتهما. أقرب تفسير لذلك:",o:["غموض مؤشرات البطاقة أو ضعف التدريب أو تحيز الملاحظ","زيادة حجم العينة","ارتفاع نسبة الردود","استخدام أسئلة مغلقة"],a:0,e:"التدريب وتحديد المؤشرات بوضوح يقلل الاختلاف في التسجيل والتفسير."},
{s:3,t:"tf",q:"الملاحظة أكثر ملاءمة في دراسة سلوك ما أو ظواهر طبيعية مقارنة بأسلوبي المقابلة والاستبانة.",a:true,e:"من مزايا الملاحظة."},
{s:3,t:"tf",q:"الملاحظة قليلة التكلفة ولا تحتاج إلى وقت طويل.",a:false,e:"تحتاج من الباحث جهداً كبيراً ووقتاً طويلاً وتكلفة مرتفعة."},
{s:3,t:"tf",q:"قد يقع في الملاحظة تحيز من الباحث سواء كان مقصوداً أو غير مقصود.",a:true,e:"من عيوب الملاحظة؛ إذ قد تؤثر توقعاته في تفسير ما يشاهده."},
{s:3,t:"tf",q:"تتطلب الملاحظة تحديداً واضحاً لما سيلاحظ، وتسجيلاً منظماً، وفصلاً قدر الإمكان بين وصف السلوك وتفسيره.",a:true,e:"هكذا تختم الملزمة قسم الملاحظة."},
{s:3,t:"tf",q:"يمكن أن تتم عملية تسجيل الملاحظة باستخدام قوائم أو نماذج أو مذكرات ميدانية.",a:true,e:"وفق تصميم الدراسة."},

{s:4,t:"d",q:"أدوات وضعت لوصف وقياس عينة في جوانب سلوكية معينة وتحديد مقدارها.",a:"الاختبارات والمقاييس"},
{s:4,t:"d",q:"مدى دقة الاختبار واتساقه؛ أي أن يعطي نفس النتائج إذا ما تم استخدامه أكثر من مرة تحت ظروف مماثلة.",a:"الثبات"},

{s:4,t:"d",q:"اتصاف أسئلة أو عبارات الاختبار ببعد التحيز.",a:"الموضوعية"},
{s:4,t:"m",q:"تستخدم الاختبارات والمقاييس في مقارنة أربع حالات، ليس من بينها:",o:["الفرد والمجتمع الأصلي كاملاً","الفرد أو المجموعة قبل وبعد","جماعة وأخرى","فرد وآخر"],a:0,e:"الحالات: فرد أو مجموعة قبل وبعد، جماعة وأخرى، فرد وجماعة (مرجعية)، فرد وآخر."},
{s:4,t:"m",q:"تكتسب الاختبارات والمقاييس أهمية خاصة عندما يحتاج الباحث إلى:",o:["تحويل الخاصية محل الدراسة إلى درجات أو مؤشرات يمكن تحليلها ومقارنتها","فهم الانفعالات بعمق","معرفة آراء المشاركين المفتوحة","تسجيل السلوك الطبيعي"],a:0,e:"تحوّل الخاصية إلى درجات قابلة للتحليل والمقارنة."},
{s:4,t:"m",q:"شروط الاختبار الجيد الثلاثة:",o:["الثبات والصدق والموضوعية","السهولة والقصر والوضوح","المرونة والعمق والسرعة","التجانس والتمثيل والحجم"],a:0,e:"الثبات، الصدق، الموضوعية."},
{s:4,t:"m",q:"يبدأ إعداد الاختبار أو المقياس بـ:",o:["تحديد المجال المراد قياسه","كتابة التعليمات","تحديد الزمن","تطبيقه على العينة"],a:0,e:"أول الأمور الستة: تحديد المجال الذي يراد قياسه."},
{s:4,t:"m",q:"«أن تقيس بنود الاختبار ما وضعت لقياسه وأن تنسجم مع أهدافه وتكون عباراتها دقيقة وواضحة» يندرج ضمن:",o:["الصياغة العلمية لبنود الاختبار","وضوح التعليمات","تحديد الفترة الزمنية","تمثيل العناصر"],a:0,e:"هذا هو الأمر الثالث: الصياغة العلمية لبنود الاختبار."},
{s:4,t:"m",q:"اختبار لقياس التفكير الناقد يتكون من أسئلة حفظ فقط. المشكلة في هذا الاختبار:",o:["ضعف الصدق","ضعف الثبات","ضعف الموضوعية","انخفاض نسبة الردود"],a:0,e:"لا يقيس ما وضع لقياسه."},
{s:4,t:"m",q:"اختبار يعطي نتائج متباينة جداً عند تكراره في ظروف متشابهة. المشكلة:",o:["ضعف الثبات","ضعف الصدق","ضعف الموضوعية","خطأ التحيز"],a:0,e:"عدم الاتساق عند التكرار = ضعف الثبات."},
{s:4,t:"m",q:"إجابة واحدة يمنحها مصححان درجتين مختلفتين لغياب معايير تصحيح واضحة. المشكلة:",o:["ضعف الموضوعية","ضعف الثبات","ضعف الصدق","خطأ المعاينة"],a:0,e:"تأثر التصحيح بالأحكام الشخصية = ضعف الموضوعية."},
{s:4,t:"m",q:"أنسب أداة لدراسة «أثر برنامج تعليمي في التحصيل»:",o:["الاختبار","الملاحظة","المقابلة","الاستبانة المفتوحة"],a:0,e:"التحصيل يقاس بالدرجات قبل البرنامج وبعده."},
{s:4,t:"m",q:"من مزايا الاختبارات والمقاييس:",o:["ارتفاع نسبة الردود","توضح الأمور العاطفية والانفعالية","لا تحتاج إلى وقت وجهد","لا تتأثر بالحالة النفسية"],a:0,e:"ارتفاع نسبة الردود، تغطية أماكن متباعدة، حرية التفكير، تقليل التحيز."},
{s:4,t:"m",q:"من عيوب الاختبارات والمقاييس:",o:["قد تتأثر بالحالة النفسية للباحث والمبحوث","انخفاض نسبة الردود","لا تغطي أماكن متباعدة","تزيد من مسألة التحيز"],a:0,e:"من عيوبها التأثر بالحالة النفسية، والحاجة لوقت وجهد، ووجود أسئلة غير مجاب عنها."},
{s:4,t:"tf",q:"سهولة تطبيق الاختبار كافية للحكم على جودته.",a:false,e:"لا تكفي؛ فالأولوية لوجود أدلة على الثبات والصدق والموضوعية وملاءمة الأداة للمجتمع."},
{s:4,t:"tf",q:"لا يكفي أن يبدو الاختبار منظماً أو سهل التطبيق، بل ينبغي التأكد من خصائصه العلمية.",a:true,e:"كما ورد في المادة العلمية."},
{s:4,t:"tf",q:"تنظر أدبيات القياس الحديثة إلى الصدق والثبات بوصفهما مجرد صفات شكلية للأداة.",a:false,e:"لا ينبغي التعامل معهما كمجرد صفات شكلية؛ بل يجب جمع الأدلة التي تدعم استخدام الدرجات في السياق المحدد."},
{s:4,t:"tf",q:"ترتبط الموضوعية بتقليل أثر الأحكام الشخصية والتحيز في تطبيق الأداة وتصحيحها وتفسير نتائجها.",a:true,e:"هذا معنى الموضوعية."},
{s:4,t:"tf",q:"من الأمور الواجب مراعاتها في الاختبارات أن تمثل عناصر الاختبار جميع عناصر المجال.",a:true,e:"الأمر الثاني من الأمور الستة."},
{s:4,t:"tf",q:"إعداد أدوات قياس جيدة لا يحتاج إلى وقت وخبرة.",a:false,e:"يحتاج إلى وقت وخبرة، وقد تتأثر استجابات المشاركين بعوامل نفسية أو ظروف التطبيق."},
{s:4,t:"tf",q:"مقارنة طالب بمتوسط مجموعة مرجعية من حالات مقارنة «فرد وجماعة».",a:true,e:"إحدى الحالات الأربع."},

/* ================= 5 البحث الاستكشافي ================= */
{s:5,t:"d",q:"مدخل بحثي يلجأ إليه الباحث عندما تكون المشكلة أو الظاهرة غير واضحة بصورة كافية، أو تكون المعلومات المتوافرة عنها محدودة ولا تسمح منذ البداية بصياغة أسئلة دقيقة أو فرضيات محددة.",a:"البحث الاستكشافي"},
{s:5,t:"m",q:"يمكن تشبيه الباحث الاستكشافي بـ:",o:["المسافر أو المستكشف","القاضي","المهندس","المحاسب"],a:0,e:"يبدأ رحلته ولديه هدف عام دون معرفة كل التفاصيل مسبقاً."},
{s:5,t:"m",q:"تتسم البحوث الاستكشافية بدرجة مرتفعة من:",o:["المرونة والانفتاح على تعديل مسار الدراسة","التقيد بخطوات محددة مسبقاً","الدقة الإحصائية","قابلية التعميم"],a:0,e:"المرونة والانفتاح سمة أساسية."},
{s:5,t:"m",q:"المقصود بمرونة البحث الاستكشافي:",o:["أن تصميمه لا يكون مقيداً منذ البداية بجميع التفاصيل","أنه بحث عشوائي","أنه يفتقر إلى الأسس العلمية","أنه لا يحتاج إلى بيانات"],a:0,e:"المرونة لا تعني العشوائية."},
{s:5,t:"m",q:"تبرز أهمية البحث الاستكشافي بصورة خاصة في:",o:["المراحل الأولى من دراسة المشكلات الجديدة أو قليلة الدراسة","المراحل النهائية لتعميم النتائج","اختبار العلاقات السببية","قياس التحصيل"],a:0,e:"يساعد على تكوين فهم أولي وتحديد المفاهيم والكشف عن المتغيرات."},
{s:5,t:"m",q:"النتائج التي يقدمها البحث الاستكشافي غالباً:",o:["أولية وتمهيدية","نهائية وقابلة للتعميم","سببية مؤكدة","إحصائية دقيقة"],a:0,e:"لا يكون هدفه أحكاماً نهائية، بل فتح المجال لدراسات أكثر تحديداً."},
{s:5,t:"m",q:"العينة في البحث الاستكشافي:",o:["صغيرة نسبياً في كثير من الحالات","كبيرة جداً لضمان التعميم","تشمل المجتمع كاملاً","عشوائية طبقية دائماً"],a:0,e:"لأن الغرض فهم أولي لا تقدير خصائص مجتمع كبير بدقة إحصائية."},
{s:5,t:"m",q:"من الخصائص المهمة للبحث الاستكشافي أن مصادر الحصول على البيانات:",o:["قد لا تكون محددة بالكامل منذ بداية الدراسة","محددة جيداً منذ البداية","تقتصر على الاستبانة","تقتصر على الاختبارات"],a:0,e:"قد يبدأ بمراجعة الدراسات ثم مقابلات ثم تحليل وثائق أو ملاحظات ميدانية."},
{s:5,t:"m",q:"من المهارات الأساسية في البحث الاستكشافي:",o:["قدرة الباحث على التكيف مع البيانات الجديدة","الالتزام الحرفي بالخطة","استخدام عينة كبيرة","اختبار الفرضيات إحصائياً"],a:0,e:"قدرة الباحث على التكيف مع البيانات الجديدة."},
{s:5,t:"m",q:"باحث يريد دراسة استخدام طلبة الجامعات لأدوات الذكاء الاصطناعي والمعلومات محدودة، فيبدأ بمقابلات مع عدد محدود من الطلبة والأساتذة. نوع هذه الدراسة:",o:["استكشافية","تجريبية","مسحية","ارتباطية"],a:0,e:"هذا مثال الملزمة على البحث الاستكشافي."},
{s:5,t:"tf",q:"البحث الاستكشافي بحث عشوائي يفتقر إلى الأسس العلمية لأنه مرن.",a:false,e:"المرونة لا تعني العشوائية؛ بل التصميم لا يكون مقيداً منذ البداية بكل التفاصيل."},
{s:5,t:"tf",q:"البحوث الاستكشافية ليس لها منهجية محددة ولا إطار مقيد بخطوات بعينها.",a:true,e:"بطبيعتها مرنة وقابلة للتغير."},
{s:5,t:"tf",q:"ينبغي للباحث أن يتعامل مع النتائج الاستكشافية باعتبارها حقائق نهائية تنطبق على جميع أفراد المجتمع.",a:false,e:"إمكانية تعميمها محدودة؛ هي أساس معرفي يمهد لدراسة وصفية أو ارتباطية أو تجريبية لاحقة."},
{s:5,t:"tf",q:"يمكن أن تساعد نتائج البحث الاستكشافي في تطوير أسئلة بحث أكثر تحديداً أو صياغة فرضيات يمكن اختبارها لاحقاً.",a:true,e:"من أهميته."},
{s:5,t:"tf",q:"الباحث في البحث الاستكشافي يجب أن يكون مرناً وقابلاً لتغيير اتجاهاته عند ظهور بيانات ومشاهدات جديدة.",a:true,e:"كما في عروض الأسبوع الخامس."},

/* ================= 6 المنهج الوصفي وأنواعه ================= */
{s:6,t:"d",q:"منهج علمي يدرس الظاهرة كما توجد في الواقع دون التدخل في تغييرها، ويعتمد على جمع البيانات لوصف خصائصها، ثم يحللها ويفسرها للكشف عن علاقاتها.",a:"المنهج الوصفي"},
{s:6,t:"d",q:"يقوم على جمع البيانات من جميع أفراد مجتمع البحث أو من عينة كبيرة منهم؛ لوصف طبيعة الظاهرة وتحديد مستوى وجودها.",a:"البحث المسحي"},
{s:6,t:"d",q:"تركز على دراسة فرد أو جماعة أو مؤسسة بصورة معمقة، باستخدام مصادر متعددة للمعلومات مثل المقابلة والملاحظة والاستبانة.",a:"دراسة الحالة"},
{s:6,t:"d",q:"تبحث في الفروق القائمة بين مجموعتين أو أكثر من أجل التعرف على الأسباب المحتملة لهذه الفروق دون أن يتدخل الباحث تجريبياً في المتغيرات.",a:"الدراسة السببية المقارنة"},
{s:6,t:"d",q:"تهدف إلى تحديد وجود العلاقة بين متغيرين كميين أو أكثر، وتقدير اتجاهها ودرجتها.",a:"البحوث الارتباطية"},
{s:6,t:"d",q:"تهتم بدراسة العلاقات بين المتغيرات من أجل الوصول إلى فهم أعمق للظاهرة، ومن أشكالها دراسة الحالة.",a:"بحوث العلاقات المتبادلة"},
{s:6,t:"d",q:"البحوث الوصفية التي تهتم بدراسة التغير والتطور، وتتضمن الدراسات الطولية والمستعرضة.",a:"البحوث النمائية"},
{s:6,t:"m",q:"ما يميز المنهج الوصفي عن المنهج التجريبي أن الباحث في الوصفي:",o:["يدرس الظاهرة كما هي دون التدخل في تغييرها","يغير المتغير المستقل بقصد","يوزع المشاركين عشوائياً","يضبط المتغيرات الدخيلة"],a:0,e:"الوصفي لا يتدخل، والتجريبي يحدث تغييراً مقصوداً."},
{s:6,t:"m",q:"يُعد المنهج الوصفي شائع الاستخدام في البحوث التربوية مقارنة بالمنهجين التاريخي والتجريبي؛ لأن:",o:["الظواهر الإنسانية تتسم عادة بالتبدل أو التحول","الظواهر الإنسانية ثابتة","تطبيقه لا يحتاج إلى أدوات","نتائجه سببية دائماً"],a:0,e:"لارتباطه بالظواهر الإنسانية المتبدلة."},
{s:6,t:"m",q:"الهدف من الوصف في المنهج الوصفي هو:",o:["التحليل والتفسير","التبويب والجدولة فقط","جمع البيانات فقط","إثبات السببية"],a:0,e:"الباحثون ليسوا مجرد مبوبين أو مجدولين للبيانات."},
{s:6,t:"m",q:"السؤال المركزي في البحث الاستكشافي:",o:["ما الذي يحدث هنا؟ وما الجوانب التي ينبغي أن أدرسها؟","ما خصائص هذه الظاهرة؟ وما مستوى وجودها؟","ما أثر المتغير المستقل في التابع؟","ما العلاقة بين متغيرين؟"],a:0,e:"أما في الوصفي: ما خصائص هذه الظاهرة؟"},
{s:6,t:"m",q:"السؤال المركزي في البحث الوصفي:",o:["ما خصائص هذه الظاهرة؟ وما مستوى وجودها؟ وكيف يمكن وصفها بصورة منظمة؟","ما الذي يحدث هنا؟","هل يمكن تكرار التجربة؟","من هم المشاركون الأوائل؟"],a:0,e:"الوصفي يصف خصائص الظاهرة ومستوى وجودها."},
{s:6,t:"m",q:"وجه المقارنة الصحيح بين الاستكشافي والوصفي من حيث «هدف البحث»:",o:["الاستكشافي عام والوصفي محدد","الاستكشافي محدد والوصفي عام","كلاهما عام","كلاهما محدد"],a:0,e:"الاستكشافي: تكوين رؤية أولية. الوصفي: دراسة رؤى محددة."},
{s:6,t:"m",q:"من حيث «عينة البحث» في المقارنة بين الاستكشافي والوصفي:",o:["الاستكشافي صغيرة والتعميم محدود جداً، والوصفي كبيرة وتمكن من التعميم","الاستكشافي كبيرة والوصفي صغيرة","كلاهما يستخدم المجتمع كاملاً","لا فرق بينهما"],a:0,e:"كما في جدول المقارنة."},
{s:6,t:"m",q:"من حيث «القدرة على الاستنتاج»:",o:["الاستكشافي استنتاجات أولية عامة، والوصفي استنتاجات محددة","الاستكشافي محددة، والوصفي عامة","كلاهما سببية","لا يقدم أي منهما استنتاجات"],a:0,e:"كما في جدول المقارنة."},
{s:6,t:"m",q:"العلاقة بين البحث الاستكشافي والبحث الوصفي:",o:["متكاملان؛ فالاستكشافي قد يكون مرحلة تمهيدية تقود إلى الوصفي","متعارضان تماماً","لا يمكن استخدامهما في موضوع واحد","الوصفي يسبق الاستكشافي دائماً"],a:0,e:"ليسا متعارضين بل مرحلتان متكاملتان في بناء المعرفة."},
{s:6,t:"m",q:"تنقسم البحوث الوصفية إلى ثلاثة اتجاهات رئيسية هي:",o:["المسحية، العلاقات المتبادلة، النمائية","الكمية، النوعية، المزجية","الاستكشافية، الوصفية، التجريبية","الطولية، المستعرضة، الاتجاهية"],a:0,e:"الاتجاهات الثلاثة."},
{s:6,t:"m",q:"جميع ما يلي من أنواع البحوث المسحية ما عدا:",o:["دراسة الحالة","المسح المدرسي","دراسات الرأي العام","تحليل المضمون"],a:0,e:"دراسة الحالة من بحوث العلاقات المتبادلة."},
{s:6,t:"m",q:"جميع ما يلي من بحوث العلاقات المتبادلة ما عدا:",o:["تحليل العمل","دراسة الحالة","الدراسة السببية المقارنة","الدراسات الارتباطية"],a:0,e:"تحليل العمل من البحوث المسحية."},
{s:6,t:"m",q:"الدراسات الطولية والمستعرضة تنتمي إلى:",o:["البحوث النمائية (النمط النمائي)","البحوث المسحية","بحوث العلاقات المتبادلة","البحوث التجريبية"],a:0,e:"النمط النمائي يشمل الدراسات الطولية والمستعرضة."},
{s:6,t:"m",q:"أول خطوات المنهج الوصفي:",o:["فهم المشكلة","تحديد أدوات جمع البيانات","تحليل النتائج","اختيار المشاركين"],a:0,e:"فهم المشكلة: التعرف على الظاهرة وجمع معلومات أولية."},
{s:6,t:"m",q:"آخر خطوات المنهج الوصفي:",o:["تحليل النتائج وتفسيرها","جمع البيانات بدقة وموضوعية","التحقق من جودة الأدوات","تنظيم البيانات وتصنيفها"],a:0,e:"الخطوة التاسعة: تحليل النتائج وتفسيرها وربطها بأسئلة البحث."},
{s:6,t:"m",q:"خطوة «كتابة الأفكار التي يستند إليها الباحث في صياغة فرضياته واختيار إجراءاته» في المنهج الوصفي هي:",o:["توضيح الافتراضات","تحديد المشكلة","فهم المشكلة","تنظيم البيانات"],a:0,e:"الخطوة الثالثة: توضيح الافتراضات."},
{s:6,t:"m",q:"خطوة «التأكد من صدق الأدوات وثباتها وتوحيد تعليمات تطبيقها» في المنهج الوصفي:",o:["التحقق من جودة الأدوات","تحديد أدوات جمع البيانات","جمع البيانات بدقة","تحليل النتائج"],a:0,e:"الخطوة السابعة."},
{s:6,t:"m",q:"عدد خطوات المنهج الوصفي كما وردت في المحاضرة:",o:["تسع خطوات","خمس خطوات","سبع خطوات","ثلاث خطوات"],a:0,e:"تسع خطوات."},
{s:6,t:"m",q:"هدف البحث المسحي:",o:["تحديد الوضع الراهن للظاهرة والإجابة عن أسئلة الدراسة دون إثبات الأسباب","إثبات العلاقات السببية","دراسة حالة واحدة بعمق","التنبؤ بالنتائج المستقبلية فقط"],a:0,e:"التركيز: وصف الواقع كما هو."},
{s:6,t:"m",q:"تحديات المعلمين في الصفوف، واتجاهات الأفراد نحو قضية معينة، أمثلة على:",o:["الدراسات المسحية","الدراسات التجريبية","دراسة الحالة","الدراسات الطولية"],a:0,e:"أمثلة الدراسات المسحية."},

{s:7,t:"d",q:"يقوم على إحداث تغيير مقصود في متغير مستقل ودراسة أثره في متغير تابع، مع محاولة ضبط العوامل الأخرى.",a:"البحث التجريبي"},

{s:7,t:"m",q:"من صعوبات المنهج التجريبي:",o:["صعوبة ضبط المتغيرات بسبب توزيع الطلبة على الفصول وتداخل العوامل التربوية والنفسية","انخفاض نسبة الردود","محدودية العمق","عدم إمكانية التكرار"],a:0,e:"من الصعوبات الخمس."},

{s:7,t:"m",q:"في دراسة «أثر الألعاب التعليمية في تحصيل الكسور»، ذكاء الطلبة والدروس الخصوصية تعد:",o:["متغيرات وسيطة (متدخلة)","متغيرات مستقلة","متغيرات تابعة","معالجة"],a:0,e:"متغيرات أخرى قد تؤثر في التابع ويجب ضبطها."},
{s:7,t:"tf",q:"المجموعة الضابطة تتعرض للمتغير المستقل.",a:false,e:"المجموعة الضابطة لا تتعرض للمتغير المستقل."},
{s:7,t:"tf",q:"المطابقة والضبط الإحصائي يحلان محل التوزيع العشوائي.",a:false,e:"يساعدان على التكافؤ، لكنهما لا يحلان محل التوزيع العشوائي."},

{s:7,t:"tf",q:"في البحث شبه التجريبي قد ترجع الفروق إلى عوامل أخرى أو متغيرات متداخلة، لذلك لا تكفي المقارنة وحدها لإثبات السببية.",a:true,e:"حدود تفسير النتائج في شبه التجريبي."},
{s:7,t:"tf",q:"يمكن أن تشمل الدراسة التجريبية أكثر من مجموعة تجريبية أو ضابطة.",a:true,e:"كما في تصميمات أكثر من مجموعتين."},
{s:7,t:"tf",q:"إذا لم يستطع الباحث عزل تأثير المتغيرات الوسيطة، فيمكن تحييدها بطرق إحصائية معينة.",a:true,e:"كما في شريحة متغيرات الموقف التجريبي."},
{s:7,t:"tf",q:"يحاول الباحث في البحث التجريبي ضبط العوامل المؤثرة في المتغير التابع، مع تغيير المتغير المستقل لتحديد أثره.",a:true,e:"ضبط العوامل الأخرى."},
{s:7,t:"tf",q:"يتطلب التطبيق الميداني للمنهج التجريبي جهداً إضافياً للتغلب على الصعوبات وتحقيق شروطه.",a:true,e:"متطلبات التطبيق."},
{s:7,t:"tf",q:"يجب الحذر عند تعميم نتائج البحث التجريبي ما لم تكن العينة ممثلة للمجتمع المستهدف.",a:true,e:"محدودية التعميم."},
{s:7,t:"tf",q:"المتغير التابع يقاس قبل التجربة فقط.",a:false,e:"يقاس قبل وبعد التجربة لتقدير مقدار التغير."},
{s:7,t:"tf",q:"يوفر التصميم التجريبي قدرة أقوى على دراسة أثر تدخل معين عندما تتوافر شروط الضبط المناسبة.",a:true,e:"كما في خلاصة المادة العلمية."},

/* ================= 8 المجتمع والعينة ================= */
{s:8,t:"d",q:"جميع مفردات المشكلة التي يدرسها الباحث، ويشمل جميع الفئات المستهدفة في البحث.",a:"مجتمع البحث"},
{s:8,t:"d",q:"جميع عناصر ومفردات المشكلة أو الظاهرة قيد الدراسة.",a:"مجتمع الدراسة"},
{s:8,t:"d",q:"مجموعة جزئية من المجتمع تمثله في السمات والخصائص المعرفية والنمائية والوجدانية والثقافية والاقتصادية.",a:"عينة البحث"},
{s:8,t:"m",q:"عند دراسة ضعف طلبة المرحلة الثانوية في الرياضيات، يشمل مجتمع الدراسة:",o:["جميع طلبة المرحلة الثانوية في الدولة","طلبة مدرسة واحدة","معلمي الرياضيات","الطلبة الضعفاء فقط"],a:0,e:"مثال الملزمة."},
{s:8,t:"m",q:"في البحوث الوصفية والتجريبية يتكون المجتمع من:",o:["الطلبة أو المعلمين أو مديري المدارس أو المشرفين","الوثائق والمخطوطات","التسجيلات فقط","الكتب المدرسية"],a:0,e:"أما في البحوث التاريخية والتحليلية فالوثائق والمخطوطات والتسجيلات."},
{s:8,t:"m",q:"في البحوث التاريخية والتحليلية يتكون المجتمع من:",o:["الوثائق أو المخطوطات أو التسجيلات","الطلبة","المعلمين","المديرين"],a:0,e:"يتحدد المجتمع حسب نوع البحث."},
{s:8,t:"m",q:"أسباب اختيار العينة بدلاً من المجتمع:",o:["الاقتصاد في التكلفة، صعوبة تغطية المجتمع، تحقيق أهداف البحث","زيادة التحيز، تقليل الدقة، سهولة التعميم","التجانس، التمثيل، الحجم","العشوائية، الانتظام، الطبقية"],a:0,e:"الأسباب الثلاثة."},
{s:8,t:"m",q:"عند اختيار العينة يراعي الباحث:",o:["تمثيل المجتمع، تجانس المجتمع، حجم المجتمع والعينة","الاقتصاد في التكلفة فقط","سهولة الوصول فقط","رأيه الشخصي"],a:0,e:"ثلاثة أمور يراعيها الباحث."},
{s:8,t:"m",q:"«طلاب السنة الأولى» مقارنة بـ «طلاب سنوات مختلفة» مثال على مراعاة:",o:["تجانس المجتمع","حجم العينة","مستوى الثقة","الموارد المتاحة"],a:0,e:"طلاب السنة الأولى مجتمع متجانس، وطلاب سنوات مختلفة غير متجانس."},
{s:8,t:"m",q:"إذا كان المجتمع صغيراً:",o:["يمكن دراسته كاملاً","يجب اختيار عينة عنقودية","يجب استخدام كرة الثلج","لا يمكن دراسته"],a:0,e:"وإذا كان كبيراً تختار منه عينة."},
{s:8,t:"m",q:"اعتبارات تحديد حجم العينة:",o:["تجانس المجتمع وتباينه، طبيعة الدراسة، مستوى الثقة، الموارد المتاحة","لون الأداة وطولها","عدد الباحثين فقط","رغبة المشاركين"],a:0,e:"أربعة اعتبارات."},
{s:8,t:"m",q:"جدول كريجسي ومورغان (1970) يستخدم لـ:",o:["تقدير حجم العينة المناسب بناء على حجم المجتمع الأصلي","حساب معامل الثبات","اختيار نوع البحث","تحديد المتغير المستقل"],a:0,e:"أداة إحصائية مرجعية لتحديد حجم العينة."},
{s:8,t:"m",q:"في جدول كريجسي ومورغان، يرمز (N) إلى ............ ويرمز (S) إلى ............",o:["حجم المجتمع / حجم العينة","حجم العينة / حجم المجتمع","الصدق / الثبات","المستقل / التابع"],a:0,e:"N = Population Size ، S = Sample Size."},
{s:8,t:"m",q:"يفترض جدول كريجسي ومورغان:",o:["مستوى دلالة 0.05 وهامش خطأ 5٪","مستوى دلالة 0.01 وهامش خطأ 1٪","عينة غير احتمالية","مجتمعاً مجهول الحجم"],a:0,e:"بحسب شريحة الأسبوع السادس."},
{s:8,t:"m",q:"يشيع استخدام جدول كريجسي ومورغان في:",o:["البحوث التنظيمية والتعليمية والاجتماعية (الدراسات المسحية)","البحوث التاريخية","دراسة الحالة","البحوث النوعية"],a:0,e:"لتحديد حجم العينة."},
{s:8,t:"tf",q:"العينة جزء من المجتمع، تمثل المجتمع الأصلي وتحقق أغراض البحث.",a:true,e:"كما في شريحة أسباب اختيار العينة."},
{s:8,t:"tf",q:"يتحدد مجتمع البحث بحسب نوع البحث.",a:true,e:"بشرياً في الوصفي والتجريبي، ووثائق في التاريخي."},
{s:8,t:"tf",q:"يجب على الباحث أن يراعي مدى تمثيل العينة للمجتمع الأصلي ودرجة تجانسه وطبيعة المشكلة البحثية.",a:true,e:"قنديلجي (2024)."},
{s:8,t:"tf",q:"يفضل دائماً استخدام عينات كبيرة في جميع الحالات.",a:false,e:"في بعض الحالات يكون استخدام عينات صغيرة أفضل من استخدام عينات كبيرة."},
{s:8,t:"tf",q:"يساعد الاختيار المناسب للعينة على الوصول إلى نتائج دقيقة يمكن تعميمها ضمن حدود التصميم البحثي.",a:true,e:"كما في المادة العلمية."},
{s:8,t:"tf",q:"يلجأ الباحث إلى العينة بهدف توفير الوقت والجهد والتكلفة، خاصة عندما يكون المجتمع كبيراً أو موزعاً جغرافياً.",a:true,e:"أسباب اختيار العينة."},
{s:8,t:"tf",q:"جدول كريجسي ومورغان يتطلب من الباحث حساب المعادلات للحصول على حجم العينة.",a:false,e:"يبحث عن حجم مجتمعه في الجدول ليجد حجم العينة المقابل مباشرة بدلاً من حساب المعادلات."},

/* ================= 9 العينات الاحتمالية ================= */
{s:9,t:"d",q:"عينات تعتمد على الاختيار العشوائي، بما يتيح لكل فرد في المجتمع فرصة متساوية (معلومة) للدخول ضمن العينة.",a:"العينات الاحتمالية"},
{s:9,t:"d",q:"طريقة يتم فيها اختيار أفراد العينة بصورة عشوائية، بحيث تتاح لأفراد المجتمع فرص متكافئة للاختيار.",a:"العينة العشوائية البسيطة"},
{s:9,t:"d",q:"تقوم على اختيار أفراد المجتمع وفق فاصل منتظم بعد تحديد نقطة بداية عشوائية.",a:"العينة المنتظمة"},
{s:9,t:"d",q:"تستخدم عندما يتكون المجتمع من فئات تختلف فيما بينها في خصائص مرتبطة بالدراسة؛ فيقسم المجتمع إلى فئات ثم تختار عينة عشوائية من كل فئة.",a:"العينة العشوائية الطبقية"},
{s:9,t:"d",q:"لا تكون وحدة الاختيار الأساسية فيها هي الفرد، وإنما مجموعة طبيعية من الأفراد مثل مدرسة أو صف أو شعبة دراسية.",a:"العينة العشوائية العنقودية"},
{s:9,t:"m",q:"أنواع العينات الاحتمالية:",o:["البسيطة، المنتظمة، الطبقية، العنقودية","المتيسرة، الحصصية، القصدية، كرة الثلج","الكمية، النوعية، المزجية","المسحية، الارتباطية، التجريبية"],a:0,e:"أربعة أنواع."},
{s:9,t:"m",q:"أساس اختيار العينات الاحتمالية:",o:["العشوائية","التحديد","سهولة الوصول","الترشيح"],a:0,e:"العشوائية تعني تساوي احتمالات الاختيار والاعتماد على الصدفة بدلاً من تحيز الباحث."},
{s:9,t:"m",q:"تستخدم العينات الاحتمالية (الاختيار العشوائي) في:",o:["البحوث الكمية عندما يكون حجم المجتمع كبيراً","البحوث النوعية عندما يكون المجتمع صغيراً ومعروفاً","دراسة الحالة","البحوث التاريخية"],a:0,e:"أما الاختيار غير العشوائي ففي البحوث النوعية."},
{s:9,t:"m",q:"من مميزات العينات الاحتمالية:",o:["تتيح قدرة أكبر على تعميم نتائج الدراسة وتحد من التحيز","تحتاج إلى موارد أقل دائماً","لا تحتاج إلى قائمة بأفراد المجتمع","تعتمد على حكم الباحث"],a:0,e:"إمكانية تعميم النتائج وفرص متكافئة."},
{s:9,t:"m",q:"شروط استخدام العينة العشوائية البسيطة:",o:["معرفة جميع أفراد المجتمع الأصلي ووجود تجانس بينهم","تباين المجتمع إلى طبقات","صعوبة الوصول إلى المجتمع","وجود عناقيد طبيعية"],a:0,e:"شرطان: معرفة الأفراد والتجانس."},
{s:9,t:"m",q:"من أبسط طرق تطبيق العينة العشوائية البسيطة:",o:["القرعة","الترشيح","المطابقة","الحصص"],a:0,e:"القرعة، أو مولد الأرقام العشوائية."},
{s:9,t:"m",q:"خطوات طريقة القرعة بالترتيب:",o:["ترقيم جميع أفراد المجتمع، كتابة الأرقام على قصاصات ووضعها في صندوق، سحب عدد من القصاصات يساوي حجم العينة","سحب القصاصات، الترقيم، الكتابة","تقسيم المجتمع إلى طبقات، الترقيم، السحب","اختيار المشاركين الأوائل، طلب الترشيحات، التوسع"],a:0,e:"ثلاث خطوات."},
{s:9,t:"m",q:"طريقة أخرى للاختيار العشوائي غير القرعة:",o:["مولد الأرقام العشوائية (Random number generator)","الترشيح","المطابقة","الحصص"],a:0,e:"كما في الشريحة."},
{s:9,t:"m",q:"من عيوب العينة العشوائية البسيطة:",o:["يصعب تطبيقها عندما يكون المجتمع كبيراً جداً أو لا تتوافر قائمة كاملة بأفراده","تزيد تدخل الباحث","لا تتيح فرصاً متكافئة","لا تناسب المجتمع المتجانس"],a:0,e:"ومن مزاياها السهولة وتقليل تدخل الباحث."},
{s:9,t:"m",q:"«دراسة عادات القلق الشائعة لدى طلبة كلية التربية والآداب في جامعة صحار، بحيث يجب أن تتاح لكل طالب في الكلية فرصة أن يصبح من أفراد العينة» مثال على:",o:["العينة العشوائية البسيطة","العينة القصدية","العينة الحصصية","كرة الثلج"],a:0,e:"مثال المحاضرة."},
{s:9,t:"m",q:"خطوات العينة المنتظمة بالترتيب:",o:["حساب طول الدورة، تحديد نقطة البداية، اختيار العناصر دورياً","تحديد نقطة البداية، حساب طول الدورة، اختيار العناصر","تقسيم الطبقات، الاختيار من كل طبقة","اختيار العناقيد، دراسة جميع أفرادها"],a:0,e:"ثلاث خطوات."},
{s:9,t:"m",q:"تستخدم العينة المنتظمة عندما:",o:["يكون ترتيب أفراد المجتمع عشوائياً","يكون المجتمع مقسماً إلى طبقات","يصعب الوصول إلى الأفراد","يكون المجتمع ممتداً جغرافياً"],a:0,e:"كما في الشريحة."},
{s:9,t:"m",q:"لا يُنصح باستخدام العينة المنتظمة عند:",o:["وجود ترتيب دوري في قائمة المجتمع يتوافق مع فاصل المعاينة","وجود قائمة مرتبة لأفراد المجتمع","تجانس المجتمع","كبر حجم المجتمع"],a:0,e:"لأن ذلك قد يؤدي إلى تحيز النتائج."},
{s:9,t:"m",q:"في العينة المنتظمة، نقطة البداية تحدد بقية العناصر؛ لذا فهي:",o:["غير مستقلة","مستقلة تماماً","طبقية","عنقودية"],a:0,e:"تنبيه منهجي في الشريحة."},
{s:9,t:"m",q:"من مميزات العينة المنتظمة:",o:["سهولة التطبيق خصوصاً عند وجود قائمة مرتبة لأفراد المجتمع","لا تحتاج إلى قائمة","تناسب المجتمعات غير المتجانسة","لا تتأثر بالترتيب الدوري"],a:0,e:"كما في المادة العلمية."},
{s:9,t:"m",q:"شروط اختيار العينة العشوائية الطبقية:",o:["معرفة جميع أفراد المجتمع الأصلي وتباين المجتمع (طبقات متباينة وغير متساوية)","تجانس المجتمع","صعوبة الوصول","وجود عناقيد"],a:0,e:"شرطان."},
{s:9,t:"m",q:"العينة العشوائية البسيطة تناسب المجتمع ............ والعينة الطبقية تناسب المجتمع ............",o:["المتجانس / غير المتجانس","غير المتجانس / المتجانس","الصغير / الكبير","المعروف / المجهول"],a:0,e:"البسيطة: متجانس ومتشابه، الطبقية: غير متجانس."},
{s:9,t:"m",q:"الجنس، المستوى التعليمي، المنطقة الجغرافية، سكان الريف والحضر، أمثلة على:",o:["أسس تحديد الطبقات في العينة الطبقية","عناقيد العينة العنقودية","متغيرات تجريبية","فئات العينة المتيسرة"],a:0,e:"أمثلة على الطبقات."},
{s:9,t:"m",q:"تساعد العينة الطبقية على:",o:["التحكم في التحيز والحصول على تمثيل دقيق للمجتمع الأصلي وضمان تمثيل الفئات المهمة","زيادة التحيز","تقليل التمثيل","الاستغناء عن العشوائية"],a:0,e:"كما في الشريحة."},
{s:9,t:"m",q:"تستخدم العينة العنقودية خصوصاً عندما:",o:["يكون المجتمع كبيراً أو منتشراً جغرافياً، مما يجعل اختيار الأفراد مباشرة مكلفاً أو صعباً","يكون المجتمع صغيراً ومتجانساً","تكون قائمة الأفراد مرتبة","يكون المجتمع مكوناً من طبقات"],a:0,e:"متى تستخدم العنقودية."},
{s:9,t:"m",q:"اختيار عدة صفوف عشوائياً من مجتمع الدراسة عند صعوبة اختيار الأفراد مثال على العينة:",o:["العنقودية","الطبقية","المنتظمة","الحصصية"],a:0,e:"وحدة الاختيار هي المجموعة (الصف)."},
{s:9,t:"m",q:"من الصعوبات والملاحظات على العينة العنقودية:",o:["قد لا تمثل المجتمع وقد تكون نسبة الخطأ أكبر، وقد يتم تجاهل بعض المجموعات","تحتاج تكلفة مرتفعة","تختار الأفراد مباشرة","لا توفر الوقت"],a:0,e:"كما في الشريحة."},
{s:9,t:"m",q:"العينة التي تختار الأفراد وفق فاصل ثابت بعد بداية عشوائية:",o:["المنتظمة","البسيطة","الطبقية","العنقودية"],a:0,e:"خلاصة الفرق."},
{s:9,t:"m",q:"العينة التي تختار مجموعات كاملة من المجتمع:",o:["العنقودية","الطبقية","المنتظمة","الحصصية"],a:0,e:"خلاصة الفرق."},
{s:9,t:"m",q:"العينة التي تقسم المجتمع إلى فئات ثم تأخذ عينة عشوائية من كل فئة:",o:["الطبقية","العنقودية","الحصصية","المنتظمة"],a:0,e:"انتبه: الحصصية تقسم أيضاً لكن بدون عشوائية."},
{s:9,t:"tf",q:"في العينات الاحتمالية يتاح لكل فرد في المجتمع فرصة متساوية للدخول ضمن العينة.",a:true,e:"وهذا أساسها."},
{s:9,t:"tf",q:"العينة العشوائية البسيطة من أسهل وأدق طرق المعاينة وأكثرها استخداماً.",a:true,e:"كما في الشريحة."},
{s:9,t:"tf",q:"تتناسب العينة العشوائية البسيطة مع المجتمعات غير المتجانسة.",a:false,e:"تتناسب مع المجتمعات المتجانسة نسبياً."},
{s:9,t:"tf",q:"في العينة العنقودية تكون وحدة الاختيار هي الفرد.",a:false,e:"وحدة الاختيار هي المجموعة (العنقود) وليس الفرد."},
{s:9,t:"tf",q:"في العينة العنقودية تتكون العينة من جميع أفراد العناقيد المختارة.",a:true,e:"مثلاً جميع الطلبة في الشعب المختارة."},
{s:9,t:"tf",q:"تساعد العينة العنقودية على توفير الوقت والتكلفة.",a:true,e:"لكن خطأ المعاينة قد يكون أكبر إذا لم تمثل العناقيد تنوع المجتمع."},
{s:9,t:"tf",q:"في العينة الطبقية يتم اختيار الأفراد داخل كل طبقة بطريقة عشوائية.",a:true,e:"وهذا ما يميزها عن الحصصية."},
{s:9,t:"tf",q:"يتحدد الأسلوب الأنسب من العينات الاحتمالية وفق طبيعة المجتمع وأهداف الدراسة وإمكانات الباحث.",a:true,e:"خلاصة الفرق."},
{s:9,t:"tf",q:"العينة الطبقية تستخدم عندما يتكون المجتمع الأصلي من جماعات فرعية أكثر تجانساً تعد مجتمعات فرعية ضمن المجتمع الأكبر.",a:true,e:"متى تستخدم الطبقية."},

/* ================= 10 العينات غير الاحتمالية ================= */
{s:10,t:"d",q:"أساليب اختيار لا تعتمد على إعطاء كل فرد في المجتمع فرصة معلومة ومتساوية للاختيار، ويستبعد فيها بعض الأفراد بصورة متعمدة.",a:"العينات غير الاحتمالية"},
{s:10,t:"d",q:"عينة يختار فيها الباحث المشاركين الذين يسهل الوصول إليهم والمتاحين وقت إجراء الدراسة، بدلاً من اختيارهم عشوائياً.",a:"العينة المتيسرة (سهلة المنال)"},
{s:10,t:"d",q:"تقوم على تقسيم المجتمع إلى فئات وفق خصائص محددة، ثم تحديد عدد مطلوب من كل فئة، إلا أن اختيار الأشخاص داخل كل فئة لا يتم بالضرورة بطريقة عشوائية.",a:"العينة الحصصية"},
{s:10,t:"d",q:"يختار فيها الباحث المشاركين عن قصد لأنهم يمتلكون معلومات أو خبرات أو خصائص مرتبطة مباشرة بموضوع الدراسة.",a:"العينة القصدية (العمدية)"},
{s:10,t:"d",q:"تستخدم عندما يصعب الوصول إلى أفراد المجتمع، وتعتمد على ترشيح المشاركين لأشخاص آخرين بالمواصفات نفسها، فتتوسع العينة تدريجياً.",a:"عينة كرة الثلج (المتدحرجة)"},
{s:10,t:"m",q:"أنواع العينات غير الاحتمالية:",o:["المتيسرة، الحصصية، القصدية، كرة الثلج","البسيطة، المنتظمة، الطبقية، العنقودية","الطولية، المستعرضة، الاتجاهية","المسحية، الارتباطية، السببية"],a:0,e:"أربعة أنواع."},
{s:10,t:"m",q:"أساس العينات غير الاحتمالية:",o:["التحديد","العشوائية","الانتظام","الطبقات"],a:0,e:"كما في الخريطة الذهنية."},
{s:10,t:"m",q:"تستخدم العينات غير الاحتمالية (الاختيار غير العشوائي) في:",o:["البحوث النوعية عندما يكون المجتمع صغيراً ومعروفاً للباحث","البحوث الكمية ذات المجتمعات الكبيرة","التجارب الحقيقية","المسوح الوطنية"],a:0,e:"كما في الشريحة."},
{s:10,t:"m",q:"في العينات غير الاحتمالية يقتصر التعميم على:",o:["العينة، مع احتمال وجود تحيز","المجتمع كاملاً","جميع المجتمعات المشابهة","لا يوجد قيود"],a:0,e:"قدرتها على التعميم الإحصائي محدودة."},
{s:10,t:"m",q:"اسم آخر للعينة المتيسرة:",o:["عينة الصدفة / الملاءمة / سهلة المنال","العينة العمدية","العينة المتدحرجة","العينة الحصصية"],a:0,e:"المتيسرة = الصدفة = الملاءمة = سهلة المنال."},
{s:10,t:"m",q:"العامل الرئيسي في اختيار العينة المتيسرة:",o:["سهولة الوصول إلى المشاركين وتوافرهم","الخبرة","الترشيح","العشوائية"],a:0,e:"سهولة الوصول."},
{s:10,t:"m",q:"باحث يتعرف على اتجاهات طلبة الجامعة نحو الذكاء الاصطناعي، فيختار الطلبة الموجودين في مكتبة الجامعة وقت جمع البيانات. نوع العينة:",o:["متيسرة","عشوائية بسيطة","قصدية","حصصية"],a:0,e:"اختيرت بناء على سهولة الوصول، لا الاختيار العشوائي."},
{s:10,t:"m",q:"من مميزات العينة المتيسرة:",o:["سهولة تطبيقها وسرعتها وانخفاض تكلفتها","قدرتها العالية على التعميم","تمثيلها الدقيق للمجتمع","خلوها من الأخطاء"],a:0,e:"ولذلك تناسب الدراسات الاستطلاعية."},
{s:10,t:"m",q:"من أهم عيوب العينة المتيسرة:",o:["احتمال عدم تمثيلها للمجتمع الأصلي","ارتفاع تكلفتها","صعوبة تطبيقها","حاجتها إلى قائمة كاملة بالأفراد"],a:0,e:"الأشخاص المتاحون قد يختلفون عن بقية أفراد المجتمع."},
{s:10,t:"m",q:"مجتمع من 100 موظف (60٪ ذكور و40٪ إناث)، حدد الباحث 60 ذكراً و40 أنثى ثم اختار الأشخاص المتاحين حتى استكمل العدد. نوع العينة:",o:["الحصصية","الطبقية","العنقودية","المنتظمة"],a:0,e:"حصص لكل فئة دون اختيار عشوائي."},
{s:10,t:"m",q:"الفرق الأساسي بين العينة الحصصية والعينة الطبقية يكمن في:",o:["طريقة اختيار الأفراد؛ عشوائي في الطبقية وغير مشروط في الحصصية","تقسيم المجتمع إلى فئات","حجم العينة","نوع البحث"],a:0,e:"كلتاهما تقسم المجتمع إلى فئات."},
{s:10,t:"m",q:"لماذا توفر العينة الطبقية أساساً أقوى للتعميم الإحصائي من الحصصية؟",o:["لأن الاختيار داخل الطبقات عشوائي","لأن عينتها أصغر","لأنها لا تقسم المجتمع","لأنها تعتمد على الترشيح"],a:0,e:"في الحصصية تدخل الباحث في الاختيار قد يؤدي إلى التحيز."},
{s:10,t:"m",q:"دراسة واقع الإدارة المدرسية في مديرية تربية خلال الثمانينيات من وجهة نظر المعلمين والمديرين، بتقسيم المجتمع إلى معلمين ومديرين ثم اختيار أفراد من كل فئة ممن كانوا موجودين، مثال على:",o:["العينة الحصصية","العينة الطبقية","العينة القصدية","العينة العنقودية"],a:0,e:"مثال شريحة العينة الحصصية."},
{s:10,t:"m",q:"اسم آخر للعينة القصدية:",o:["العمدية","المتدحرجة","سهلة المنال","الملاءمة"],a:0,e:"القصدية = العمدية."},
{s:10,t:"m",q:"لدراسة خبرات مديري المدارس في إدارة الأزمات التعليمية، يختار الباحث عمداً مديرين سبق لهم التعامل مع أزمات محددة. نوع العينة:",o:["القصدية","المتيسرة","الحصصية","العشوائية البسيطة"],a:0,e:"اختيار أصحاب الخبرة عن قصد."},
{s:10,t:"m",q:"الهدف في العينة القصدية:",o:["الوصول إلى الأشخاص الأكثر صلة بالظاهرة","الحصول على أكبر عدد من المشاركين","إعطاء فرص متساوية للجميع","تقليل التكلفة فقط"],a:0,e:"لا يكون الهدف أكبر عدد، بل الأكثر صلة."},
{s:10,t:"m",q:"لدراسة أوضاع المدارس من 1970 إلى 1990، يختار الباحث أشخاصاً عاشوا أو عملوا في المدارس خلال تلك الفترة. نوع العينة:",o:["القصدية","الحصصية","كرة الثلج","المنتظمة"],a:0,e:"لأنهم يمتلكون المعلومات المطلوبة."},
{s:10,t:"m",q:"من مخاطر العينة القصدية:",o:["اعتماد الاختيار على تقدير الباحث قد يؤدي إلى التحيز إذا لم تكن المعايير واضحة ومبررة","انخفاض نسبة الردود","ارتفاع التكلفة","كبر حجم العينة"],a:0,e:"وقد تكون الوثائق ناقصة أو غير دقيقة."},
{s:10,t:"m",q:"تتم عينة كرة الثلج في ثلاث مراحل بالترتيب:",o:["اختيار المشاركين الأوائل، طلب الترشيحات، توسيع العينة","طلب الترشيحات، اختيار المشاركين، التوسع","حساب طول الدورة، تحديد البداية، الاختيار","تقسيم الفئات، تحديد الحصص، الاختيار"],a:0,e:"الثلاث مراحل."},
{s:10,t:"m",q:"المشاركون الأوائل في عينة كرة الثلج يسمون:",o:["Seeds","Clusters","Strata","Quota"],a:0,e:"المشاركون الأوائل (Seeds)."},
{s:10,t:"m",q:"من أمثلة المجتمعات المناسبة لعينة كرة الثلج:",o:["المدمنون والمشاركون في أنشطة رياضية مختلفة","طلبة صف دراسي معروف","موظفو مؤسسة بقائمة كاملة","طلبة كلية مسجلون"],a:0,e:"فئات يصعب الوصول إليها."},
{s:10,t:"m",q:"من مميزات عينة كرة الثلج:",o:["فعالة في الشبكات الاجتماعية خاصة عند وجود ثقة بين الأفراد","تمثيلها الدقيق للمجتمع","ملاءمتها للتعميم الإحصائي","سهولة ضمان دقتها"],a:0,e:"وتحتاج موارد أقل، ومناسبة للوصول إلى أفراد المجتمع."},
{s:10,t:"m",q:"من الملاحظات على عينة كرة الثلج:",o:["قد لا تكون ممثلة للمجتمع لأن المشاركين يميلون إلى ترشيح أشخاص يشبهونهم","تحتاج موارد كثيرة","لا تناسب البحوث النوعية","تتطلب قائمة كاملة بالمجتمع"],a:0,e:"غير ملائمة للدراسات التي تتطلب تعميماً إحصائياً."},
{s:10,t:"m",q:"العينة التي تقوم على «استكمال عدد محدد من فئات المجتمع»:",o:["الحصصية","المتيسرة","القصدية","كرة الثلج"],a:0,e:"خلاصة الملزمة."},
{s:10,t:"m",q:"العينة التي تعتمد على «إحالة المشاركين إلى مشاركين آخرين»:",o:["كرة الثلج","القصدية","الحصصية","المتيسرة"],a:0,e:"خلاصة الملزمة."},
{s:10,t:"m",q:"يستخدم الباحث العينات غير الاحتمالية في الحالات التالية ما عدا:",o:["عندما يريد تعميماً إحصائياً دقيقاً على مجتمع كبير","عندما يصعب تطبيق الاختيار العشوائي","عندما تكون الدراسة استكشافية أو نوعية","عندما يستهدف أفراداً يمتلكون خبرات محددة"],a:0,e:"قدرتها على التعميم الإحصائي محدودة."},
{s:10,t:"tf",q:"العينة المتيسرة مناسبة للدراسات الاستطلاعية التي يريد الباحث من خلالها الحصول على معلومات أولية عن المشكلة.",a:true,e:"لسهولتها وسرعتها وانخفاض تكلفتها."},
{s:10,t:"tf",q:"العينة المتيسرة تمكن من تعميم النتائج على المجتمع بدرجة عالية.",a:false,e:"إمكانية تعميم نتائجها محدودة."},
{s:10,t:"tf",q:"في العينة الحصصية يشترط الاختيار العشوائي داخل كل فئة.",a:false,e:"لا يشترط؛ وهذا الفرق عن الطبقية."},
{s:10,t:"tf",q:"تفيد العينة الحصصية عندما يريد الباحث ضمان تمثيل فئات محددة ولا تتوافر له إمكانية تنفيذ معاينة عشوائية كاملة.",a:true,e:"كما في المادة العلمية."},
{s:10,t:"tf",q:"في العينة القصدية يختار الباحث المشاركين لسهولة الوصول إليهم.",a:false,e:"يختارهم عن قصد لامتلاكهم معلومات وخبرات مرتبطة بالموضوع."},
{s:10,t:"tf",q:"تتطلب العينة القصدية معلومات سابقة كافية، وقد تتغير الظروف فتفقد العينة قدرتها على التمثيل.",a:true,e:"شروط ومخاطر القصدية."},
{s:10,t:"tf",q:"عينة كرة الثلج أنسب للبحوث النوعية والاستكشافية.",a:true,e:"أكثر من الدراسات التي تستهدف التعميم الإحصائي."},
{s:10,t:"tf",q:"عينة كرة الثلج ملائمة للدراسات التي تتطلب تحليلات إحصائية لتعميم النتائج.",a:false,e:"غير ملائمة لذلك."},
{s:10,t:"tf",q:"ينبغي للباحث في جميع حالات العينات غير الاحتمالية توضيح طريقة الاختيار وحدودها وتجنب تعميم النتائج بصورة تتجاوز ما يسمح به تصميم العينة.",a:true,e:"خلاصة الملزمة."},
{s:10,t:"tf",q:"العينة الحصصية من العينات الاحتمالية.",a:false,e:"الحصصية غير احتمالية."},
{s:10,t:"tf",q:"تحتاج عينة كرة الثلج إلى موارد أقل من بعض طرق المعاينة الأخرى.",a:true,e:"من مزاياها."},

/* ================= 11 أخطاء المعاينة ================= */
{s:11,t:"d",q:"خطأ ينشأ عندما لا تدخل الصدفة بعض وحدات المجتمع ضمن العينة، ويقل بزيادة حجم العينة.",a:"خطأ المعاينة العشوائي"},
{s:11,t:"d",q:"خطأ يتصف بأنه ثابت القيمة، ويصعب التقليل منه أو التخلص منه، ولا يقل بزيادة حجم العينة.",a:"خطأ التحيز (Bias Error)"},
{s:11,t:"d",q:"اختلاف ضئيل بين خصائص العينة وخصائص المجتمع الأصلي، وهو خطأ غير منتظم يرجع إلى المصادفة.",a:"خطأ العينة"},
{s:11,t:"m",q:"يعتمد متوسط حجم أخطاء المعاينة العشوائية على:",o:["حجم العينة، ومدى تشتت مفرداتها، وطريقة اختيار الوحدات","نوع البحث فقط","رغبة المشاركين","عدد الباحثين"],a:0,e:"ثلاثة عوامل."},
{s:11,t:"m",q:"اختلاف قيم الوحدات التي تتكون منها العينة يسمى:",o:["الاختلاف أو التشتت (Variation)","التحيز","الخطأ المعياري","الثبات"],a:0,e:"كما في شريحة أخطاء اختيار العينات."},
{s:11,t:"m",q:"للتقليل من خطأ العينة العشوائية:",o:["زيادة حجم العينة واختيار الطريقة المناسبة مثل الطبقية أو المنتظمة","تقليل حجم العينة","استبدال الوحدات الصعبة","استخدام العينة المتيسرة"],a:0,e:"الطريقتان المذكورتان."},
{s:11,t:"m",q:"يُقدَّر خطأ المعاينة بحساب:",o:["الخطأ المعياري (Standard Error)","معامل الارتباط","المتوسط","المنوال"],a:0,e:"يقدر الخطأ المعياري بحساب الانحراف المعياري لمتوسطات العينات الممكنة."},
{s:11,t:"m",q:"أثر زيادة حجم العينة على خطأ التحيز:",o:["لا يقل","يقل","يختفي تماماً","يتضاعف"],a:0,e:"خطأ التحيز لا يقل بزيادة حجم العينة."},
{s:11,t:"m",q:"أثر زيادة حجم العينة على خطأ المعاينة العشوائي:",o:["يقل","لا يتأثر","يزيد","يصبح ثابتاً"],a:0,e:"يقل بزيادة حجم العينة."},
{s:11,t:"m",q:"أنواع خطأ التحيز الثلاثة:",o:["التحيز في الاختيار، التحيز في التقدير، التعريف الخاطئ لوحدة المعاينة","العشوائي، المنتظم، الطبقي","الصدق، الثبات، الموضوعية","الطباعة، التبويب، التفسير"],a:0,e:"كما في شريحة أنواع خطأ التحيز."},

,{s:11,t:"d",q:"إجراء بحث تجريبي على عينة صغيرة قبل الدراسة لكشف التحيز المقصود وغير المقصود وتحسين الأدوات.",a:"الدراسة الاستطلاعية"}
];

</script>
<script>
const $=id=>document.getElementById(id);
const ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const TYPES=[["all","الكل"],["m","اختياري"],["tf","صح وخطأ"],["d","تعاريف"]];
const TN={m:"اختيار من متعدد",tf:"صح أو خطأ",d:"اختر المصطلح"};
Q.forEach((q,i)=>q.id=i);
const TERMS=[...new Set(Q.filter(q=>q.t==="d").map(q=>q.a))];
let type="all", list=[], idx=0, ok=0, no=0, answered=false, wrongIds=[], cur=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function pool(){const s=$('sec').value;return Q.filter(q=>(type==="all"||q.t===type)&&(s==="all"||q.s===+s))}
function buildFilters(){
  const counts={all:Q.length,m:0,tf:0,d:0}; Q.forEach(q=>counts[q.t]++);
  $('types').insertAdjacentHTML('beforeend',TYPES.map(([k,l])=>`<button class="chip" data-t="${k}" aria-pressed="${k===type}">${l}<small>${ar(counts[k])}</small></button>`).join(''));
  $('types').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;type=b.dataset.t;document.querySelectorAll('#types .chip').forEach(c=>c.setAttribute('aria-pressed',c===b));upd()};
  $('sec').innerHTML=`<option value="all">كل الموضوعات</option>`+SECTIONS.map((s,i)=>`<option value="${i}">${ar(i+1)}. ${s} (${ar(Q.filter(q=>q.s===i).length)})</option>`).join('');
  $('sec').onchange=upd;
}
function upd(){$('pool').textContent=`${ar(pool().length)} سؤال في هذا الاختيار`}

function prep(q){
  let opts;
  if(q.t==="m") opts=shuffle(q.o.map((t,i)=>({t,c:i===q.a})));
  else if(q.t==="tf") opts=[{t:"صح",c:q.a===true},{t:"خطأ",c:q.a===false}];
  else{
    const near=TERMS.filter(t=>t!==q.a&&Q.some(x=>x.t==="d"&&x.a===t&&Math.abs(x.s-q.s)<=1));
    const far=TERMS.filter(t=>t!==q.a&&!near.includes(t));
    const ds=shuffle(near).slice(0,3); while(ds.length<3) ds.push(shuffle(far).find(t=>!ds.includes(t)));
    opts=shuffle([{t:q.a,c:true},...ds.map(t=>({t,c:false}))]);
  }
  return {q,opts};
}
function start(ids){
  const src=ids?Q.filter(q=>ids.includes(q.id)):pool();
  if(!src.length){$('card').innerHTML=`<p class="ask">ما فيه أسئلة في هذا الاختيار. غيّر النوع أو الموضوع.</p>`;return}
  list=shuffle(src); idx=0; ok=0; no=0; wrongIds=[]; show();
}
function rail(){$('pos').textContent=ar(Math.min(idx+1,list.length));$('tot').textContent=ar(list.length);$('ok').textContent=ar(ok);$('no').textContent=ar(no);$('fill').style.width=(list.length?((idx+(answered?1:0))/list.length*100):0)+'%'}
function show(){
  answered=false; cur=prep(list[idx]); const q=cur.q;
  const keys=q.t==="tf"?["ص","خ"]:["١","٢","٣","٤"];
  $('card').innerHTML=`<div class="meta"><span class="tag ${q.t}">${TN[q.t]}</span><span class="sec">${SECTIONS[q.s]}</span></div>
    ${q.t==="d"?`<p class="ask">ما المصطلح الذي يدل عليه التعريف التالي؟</p>`:''}
    <p class="qtext ${q.t==="d"?'def':''}">${q.q}</p>
    <div class="opts ${q.t==="tf"?'tf':''}">${cur.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${keys[i]}</span><span>${o.t}</span></button>`).join('')}</div>
    <div id="fbx"></div>
    <div class="nav"><button class="btn" id="quit">إنهاء وعرض النتيجة</button><button class="btn primary" id="next" disabled>التالي ←</button></div>`;
  $('card').querySelector('.opts').onclick=e=>{const b=e.target.closest('.opt');if(b)pick(+b.dataset.i)};
  $('next').onclick=next; $('quit').onclick=finish;
  rail();
}
function pick(i){
  if(answered) return; answered=true;
  const q=cur.q, right=cur.opts[i].c;
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,j)=>{b.disabled=true; if(cur.opts[j].c) b.classList.add('ok'); else if(j===i) b.classList.add('no'); else b.classList.add('dim')});
  const corr=cur.opts.find(o=>o.c).t;
  if(right) ok++; else {no++; wrongIds.push(q.id)}
  const st=load('u2wrong')||[]; const set=new Set(st); right?set.delete(q.id):set.add(q.id); save('u2wrong',[...set]);
  $('fbx').innerHTML=`<div class="fb ${right?'ok':'no'}"><strong>${right?'صح ✓':'خطأ ✗'}</strong>${right?'':`<span>الإجابة الصحيحة: <span class="ans">${corr}</span></span>`}${q.e?`<span>${q.e}</span>`:''}</div>`;
  $('next').disabled=false; $('next').focus({preventScroll:true}); rail();
}
function next(){ if(idx<list.length-1){idx++;show()} else finish() }
function finish(){
  const done=ok+no; const pct=done?Math.round(ok/done*100):0;
  const by={}; list.slice(0,answered?idx+1:idx).forEach(q=>{by[q.s]=by[q.s]||{t:0,w:0};by[q.s].t++;if(wrongIds.includes(q.id))by[q.s].w++});
  const wr=Q.filter(q=>wrongIds.includes(q.id));
  $('card').innerHTML=`<div class="end">
    <div class="big">${ar(pct)}٪</div>
    <div>${ar(ok)} صح من ${ar(done)} سؤال</div>
    <div class="persec">${Object.entries(by).map(([s,v])=>{const p=Math.round((v.t-v.w)/v.t*100);return `<div class="ps"><span>${SECTIONS[s]}</span><span class="b"><i style="width:${p}%"></i></span><span>${ar(p)}٪</span></div>`}).join('')}</div>
    ${wr.length?`<div class="wrong"><b>الأسئلة اللي أخطأت فيها (${ar(wr.length)})</b>${wr.map(q=>`<div class="wr">${q.t==="d"?'<span class="hint">التعريف: </span>':''}${q.q}<br>الإجابة: <span class="ans">${q.t==="tf"?(q.a?'صح':'خطأ'):(q.t==="m"?q.o[q.a]:q.a)}</span>${q.e?`<div class="hint">${q.e}</div>`:''}</div>`).join('')}</div>`:'<div>ما أخطأت في أي سؤال 👏</div>'}
    <div class="nav" style="justify-content:center"><button class="btn primary" id="again">جولة جديدة</button>${wr.length?'<button class="btn" id="redo">أعد الأخطاء فقط</button>':''}</div>
  </div>`;
  $('again').onclick=()=>start(); if(wr.length) $('redo').onclick=()=>start(wrongIds.slice());
  idx=list.length; answered=false; rail(); $('fill').style.width='100%'; refreshRetry();
}
function refreshRetry(){const w=load('u2wrong')||[];$('retry').hidden=!w.length;$('retry').textContent=`أعد الأسئلة اللي أخطأت فيها (${ar(w.length)})`}
$('start').onclick=()=>start();
$('retry').onclick=()=>start(load('u2wrong')||[]);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('button'))return;
  const map={"1":0,"2":1,"3":2,"4":3,"١":0,"٢":1,"٣":2,"٤":3,"ص":0,"خ":1};
  if(e.key in map && document.querySelector('.opt') && !answered){const n=map[e.key];if(n<cur.opts.length){e.preventDefault();pick(n)}}
  else if(e.key==='Enter' && answered && !$('next').disabled){e.preventDefault();next()}
});
buildFilters(); upd(); refreshRetry(); start();
</script>
</body></html>
